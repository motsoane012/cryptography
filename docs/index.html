<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>CS4542 Crypto Question Bank</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&family=IBM+Plex+Sans:ital,wght@0,400;0,500;0,600;1,400&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
/* Layout idea: a study workbench — sidebar index of topics/papers on the left, a stack of exam-style question cards on the right, solutions folded under each card. */
:root{
  --bg:#eef1f4; --panel:#ffffff; --ink:#15233b; --muted:#5b6880; --line:#d6dce5;
  --accent:#0b6e79; --accent-soft:#dff0f1; --answer:#b86e00; --answer-soft:#fff3df;
  --good:#1f7a3f; --good-soft:#e2f4e8; --bad:#b3261e; --bad-soft:#fbe5e3;
  --display:"Bricolage Grotesque", "Segoe UI", system-ui, sans-serif;
  --body:"IBM Plex Sans", "Segoe UI", system-ui, sans-serif;
  --mono:"IBM Plex Mono", ui-monospace, Consolas, monospace;
  color-scheme:light;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0f1520; --panel:#172131; --ink:#e4e9f2; --muted:#9aa7bd; --line:#2a3850;
    --accent:#4cc3cf; --accent-soft:#163a42; --answer:#f2b24c; --answer-soft:#3a2c12;
    --good:#5bd38a; --good-soft:#163524; --bad:#ff8a80; --bad-soft:#3d1c1a; color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0f1520; --panel:#172131; --ink:#e4e9f2; --muted:#9aa7bd; --line:#2a3850;
  --accent:#4cc3cf; --accent-soft:#163a42; --answer:#f2b24c; --answer-soft:#3a2c12;
  --good:#5bd38a; --good-soft:#163524; --bad:#ff8a80; --bad-soft:#3d1c1a; color-scheme:dark;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{background:var(--bg);color:var(--ink);font:15px/1.55 var(--body)}
button,input,select{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
header{position:sticky;top:0;z-index:5;background:var(--panel);border-bottom:1px solid var(--line);padding:10px 16px;display:flex;gap:12px;align-items:center;flex-wrap:wrap}
header h1{font:800 20px/1.1 var(--display);margin:0;letter-spacing:-.01em}
header h1 span{color:var(--accent)}
.search{flex:1 1 220px;min-width:180px;max-width:420px;padding:7px 11px;border:1px solid var(--line);border-radius:8px;background:var(--bg)}
.hbtns{display:flex;gap:6px;flex-wrap:wrap}
.btn{border:1px solid var(--line);background:var(--panel);border-radius:8px;padding:6px 11px;cursor:pointer;font-size:13.5px}
.btn:hover{border-color:var(--accent)}
.btn.on{background:var(--accent);border-color:var(--accent);color:var(--panel)}
.wrap{display:grid;grid-template-columns:290px 1fr;min-height:calc(100% - 58px)}
nav{border-right:1px solid var(--line);background:var(--panel);padding:12px;overflow:auto;position:sticky;top:58px;height:calc(100vh - 58px)}
.tabs{display:flex;gap:4px;margin-bottom:10px}
.tabs button{flex:1;padding:7px 4px;border:1px solid var(--line);background:var(--bg);border-radius:8px;cursor:pointer;font-weight:600;font-size:13px}
.tabs button.on{background:var(--ink);color:var(--panel);border-color:var(--ink)}
.navlist{display:flex;flex-direction:column;gap:2px}
.navgroup{font:600 11px/1 var(--body);text-transform:uppercase;letter-spacing:.08em;color:var(--muted);margin:12px 6px 4px}
.ni{display:grid;grid-template-columns:1fr auto;gap:2px 8px;text-align:left;border:0;background:none;padding:7px 8px;border-radius:8px;cursor:pointer}
.ni:hover{background:var(--bg)}
.ni.on{background:var(--accent-soft)}
.ni b{font-weight:600;font-size:14px}
.ni small{grid-column:1/2;color:var(--muted);font-size:12px;line-height:1.3}
.ni .cnt{grid-row:1/3;grid-column:2;align-self:center;font:500 12px var(--mono);color:var(--muted);font-variant-numeric:tabular-nums}
.bar{grid-column:1/3;height:3px;background:var(--line);border-radius:3px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--good)}
main{padding:18px clamp(16px,3vw,36px) 60px;min-width:0}
.vhead{display:flex;flex-wrap:wrap;align-items:end;gap:10px 18px;margin-bottom:14px}
.vhead h2{font:800 clamp(22px,3vw,30px)/1.1 var(--display);margin:0;text-wrap:balance}
.vhead p{margin:0;color:var(--muted)}
.vtools{margin-left:auto;display:flex;gap:6px;flex-wrap:wrap}
.cards{display:flex;flex-direction:column;gap:14px;max-width:980px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:14px 16px;border-left:4px solid var(--line)}
.card.calc{border-left-color:var(--accent)}
.card.mcq{border-left-color:var(--answer)}
.card.done{opacity:.72}
.meta{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin-bottom:8px}
.chip{font:500 12px var(--mono);padding:2px 7px;border-radius:6px;background:var(--bg);border:1px solid var(--line);cursor:pointer}
.chip:hover{border-color:var(--accent)}
.tag{font-size:11.5px;font-weight:600;text-transform:uppercase;letter-spacing:.05em;color:var(--muted)}
.marks{margin-left:auto;font:500 12.5px var(--mono);color:var(--muted)}
.qnum{font:800 15px var(--display);color:var(--accent)}
.q{max-width:72ch}
.q .note,.note{color:var(--muted);font-size:13.5px}
.actions{display:flex;gap:8px;margin-top:10px;flex-wrap:wrap}
.sol{margin-top:12px;border-top:1px dashed var(--line);padding-top:12px}
.sol[hidden]{display:none}
.ans{background:var(--answer-soft);border-left:3px solid var(--answer);padding:8px 12px;border-radius:6px;margin-bottom:10px}
.sol h4{margin:14px 0 6px;font:600 14.5px var(--body);color:var(--accent)}
.sol ol.steps{padding-left:22px;margin:6px 0}
.sol ol.steps li{margin:4px 0}
.sol ol.cont{list-style:none;padding-left:0}
.tw{overflow-x:auto;margin:8px 0}
table.wt{border-collapse:collapse;font-size:13.5px;font-variant-numeric:tabular-nums}
table.wt th,table.wt td{border:1px solid var(--line);padding:4px 8px;text-align:left;vertical-align:top}
table.wt th{background:var(--bg);font-weight:600}
table.pf,table.st{border-collapse:collapse;margin:6px 0;font:500 14px var(--mono)}
table.pf td{border:1px solid var(--line);width:38px;height:30px;text-align:center}
table.st td{border:1px solid var(--ink);width:56px;text-align:center;padding:3px;line-height:1.2}
table.st small{color:var(--muted);font-size:11px}
.mono{font-family:var(--mono)}
.small{font-size:12px;word-break:break-all}
.mat{font-family:var(--mono)}
.tip{background:var(--accent-soft);padding:6px 10px;border-radius:6px;font-size:13.5px}
pre.code{background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:10px;overflow:auto;font:12.5px/1.45 var(--mono)}
details{margin:8px 0}
summary{cursor:pointer;color:var(--accent);font-weight:500}
.diag{margin:12px 0;overflow-x:auto}
.diag svg{max-width:100%;height:auto;display:block}
.diag figcaption{font-size:12.5px;color:var(--muted);margin-top:4px}
.opts{display:flex;flex-direction:column;gap:6px;margin-top:8px}
.opt{display:flex;gap:10px;align-items:flex-start;text-align:left;border:1px solid var(--line);background:var(--panel);border-radius:8px;padding:7px 10px;cursor:pointer}
.opt:hover{border-color:var(--accent)}
.opt .L{font:600 13px var(--mono);color:var(--muted);min-width:18px}
.opt.right{background:var(--good-soft);border-color:var(--good)}
.opt.wrong{background:var(--bad-soft);border-color:var(--bad)}
.feedback{margin-top:8px;font-size:14px}
.feedback b.g{color:var(--good)} .feedback b.r{color:var(--bad)}
.empty{color:var(--muted);padding:30px 0}
.home{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:12px;max-width:980px;margin-bottom:22px}
.tile{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:12px 14px;text-align:left;cursor:pointer;display:flex;flex-direction:column;gap:4px}
.tile:hover{border-color:var(--accent)}
.tile b{font:700 16px var(--display)}
.tile span{color:var(--muted);font-size:13px}
.tile em{font-style:normal;font:500 12px var(--mono);color:var(--accent)}
.stats{display:flex;gap:18px;flex-wrap:wrap;margin:4px 0 18px;color:var(--muted)}
.stats b{font:800 22px var(--display);color:var(--ink);display:block}
.tool{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:14px 16px;max-width:980px;margin-bottom:14px}
.tool h3{margin:0 0 8px;font:700 17px var(--display)}
.tool .row{display:flex;flex-wrap:wrap;gap:8px;align-items:end;margin-bottom:8px}
.tool label{display:flex;flex-direction:column;font-size:12.5px;color:var(--muted);gap:2px}
.tool input{border:1px solid var(--line);border-radius:6px;padding:5px 8px;background:var(--bg);width:120px}
.tool input.wide{width:220px}
.out{min-height:10px}
svg text{font-family:var(--body)}
@media (max-width:820px){
  .wrap{grid-template-columns:1fr}
  nav{position:static;height:auto;max-height:none;border-right:0;border-bottom:1px solid var(--line)}
  .navlist{max-height:260px;overflow:auto}
  header{position:static}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<header>
  <h1>Crypto<span>Bank</span></h1>
  <input id="search" class="search" type="search" placeholder="Search questions (e.g. Playfair, CRT, Kerberos, EX25)…" aria-label="Search questions">
  <div class="hbtns">
    <button class="btn" id="calcOnly" aria-pressed="false" title="Show only questions with calculations">Calculations only</button>
    <button class="btn" id="hideDone" aria-pressed="false">Hide done</button>
    <button class="btn" id="showAll">Open all solutions</button>
    <button class="btn" id="goTools">Calculators</button>
  </div>
</header>
<div class="wrap">
  <nav aria-label="Browse">
    <div class="tabs"><button id="tabTopic" class="on">By topic</button><button id="tabPaper">By paper</button></div>
    <div id="navlist" class="navlist"></div>
  </nav>
  <main id="main"></main>
</div>
<script>
const DATA = {"topics": [{"id": "fund", "name": "Security Fundamentals", "sub": "CIA, attacks, attack surfaces, services"}, {"id": "classical", "name": "Classical Ciphers", "sub": "Affine, Playfair, Vigenère, Hill, transposition"}, {"id": "nt", "name": "Number Theory", "sub": "Euclid, congruences, Fermat/Euler, CRT, Miller–Rabin, GF(2ⁿ)"}, {"id": "block", "name": "Block Ciphers & DES", "sub": "Feistel, DES, S-DES, avalanche"}, {"id": "aes", "name": "AES & S-AES", "sub": "Rounds, key expansion, MixColumns"}, {"id": "modes", "name": "Modes of Operation", "sub": "ECB, CBC, CTR, CFB, OFB"}, {"id": "pk", "name": "Public Key: RSA, DH, ElGamal", "sub": "Keys, encryption, signatures, MITM"}, {"id": "hash", "name": "Hashes & Signatures", "sub": "Hash properties, SHA padding, salts, signing"}, {"id": "keys", "name": "Key Management & PKI", "sub": "CAs, certificates, KDCs, secret sharing"}, {"id": "auth", "name": "Authentication & Kerberos", "sub": "Factors, Kerberos, NSPK, passwords"}, {"id": "net", "name": "TLS & Network Defence", "sub": "TLS handshake, cipher suites, DMZ/IDS"}, {"id": "mcq", "name": "Multiple Choice", "sub": "Test 3 papers — tap an option"}], "papers": [{"id": "T1A", "name": "Test 1 · CS4542 · 65 marks (1h40)", "kind": "test"}, {"id": "T1B", "name": "Test 1 · CS4542 · 65 marks (1h37)", "kind": "test"}, {"id": "T1C", "name": "Test 1 · CS4442 · 70 marks", "kind": "test"}, {"id": "T1D", "name": "Test 1 · CS4442 2021 · 61 marks", "kind": "test"}, {"id": "T1E", "name": "Test 1 · CS4542 · 68 marks (1h50)", "kind": "test"}, {"id": "T2A", "name": "Test 2 · CS4542 · 60 marks (1h30)", "kind": "test"}, {"id": "T2B", "name": "Test 2 · CS4542 · 60 marks (1h40)", "kind": "test"}, {"id": "T2C", "name": "Test 2 · CS4542 · 60 marks (1h30, ECB/OAEP)", "kind": "test"}, {"id": "T3A", "name": "Test 3 · CS4542 · 40 marks", "kind": "test"}, {"id": "T3B", "name": "Test 3 · CS4542 · 36 MCQs", "kind": "test"}, {"id": "SUP26", "name": "Supplementary Exam · June 2026", "kind": "exam"}, {"id": "EX25", "name": "Exam · November 2025", "kind": "exam"}, {"id": "EX24", "name": "Exam · 11 December 2024", "kind": "exam"}, {"id": "EX22", "name": "Exam · February 2022 (CS4442)", "kind": "exam"}, {"id": "EXAB", "name": "Exam · Section A/B paper (music cipher)", "kind": "exam"}, {"id": "PX", "name": "Paper · Kerckhoff / Feistel / Kerberos", "kind": "exam"}, {"id": "PY", "name": "Paper · Terms / IDS & DMZ / CRT", "kind": "exam"}, {"id": "PZ", "name": "Paper · Euler / RSA / ElGamal (Q4)", "kind": "exam"}, {"id": "E0", "name": "Exercise 0 · Maths revision", "kind": "exercise"}, {"id": "E1", "name": "Exercise 1 · Classical ciphers", "kind": "exercise"}, {"id": "E2", "name": "Exercise 2 · Totients, inverses, puzzles", "kind": "exercise"}, {"id": "E3", "name": "Exercise 3 · Brute force & Feistel", "kind": "exercise"}, {"id": "E4", "name": "Exercise 4 · Block cipher modes", "kind": "exercise"}, {"id": "E5", "name": "Exercise 5 · Fermat, RSA, D-H", "kind": "exercise"}, {"id": "E6", "name": "Exercise 6 · ElGamal & hashes", "kind": "exercise"}, {"id": "E7", "name": "Exercise 7 · CRT & signatures", "kind": "exercise"}], "qs": [{"t": "fund", "src": ["T1B Q1(b)", "T1D Q1(b)"], "m": 4, "q": "Consider a networking student that records network traffic using a packet analyser tool, such as Wireshark, for later analysis.<br>i. Is this attack an active or a passive attack? Support your answer. [2]<br>ii. Briefly explain how a passive attack can complement an active attack. [2]", "a": "<div class=\"ans\"><b>Answer:<\/b> i. Passive — the student only captures/reads traffic and doesn't alter it. ii. Passive reconnaissance gathers the information an active attack then uses.<\/div><ol class=\"steps\"><li><b>i.<\/b> Passive attack (eavesdropping / traffic analysis): packets are copied and analysed, nothing is modified, injected or blocked, so it's very hard to detect. It threatens confidentiality.<\/li><li><b>ii.<\/b> Information captured passively (IP addresses, open services, session cookies, password hashes, message formats, timing) is then used to launch active attacks — e.g. replaying a captured login, hijacking a session, spoofing a host, or targeting a vulnerable service found by sniffing.<\/li><\/ol>", "k": "theory", "d": null, "id": 0}, {"t": "fund", "src": ["T1C Q1(a)"], "m": 8, "q": "The digital attack surface potentially exposes the organisation's cloud and on-premises infrastructure to any hacker with an internet connection. Briefly explain each attack vector: i. Weak passwords ii. Misconfigurations iii. Outdated or obsolete devices, data, or applications iv. Internet-facing assets", "a": "<div class=\"ans\"><b>Answer:<\/b> Each is an entry point an attacker can exploit; brief explanations below.<\/div><ol class=\"steps\"><li><b>Weak passwords:<\/b> short, common, reused or default passwords are guessed or cracked (brute force, dictionary, credential stuffing), giving direct account access.<\/li><li><b>Misconfigurations:<\/b> wrong settings — open ports, default admin accounts, public cloud storage buckets, overly permissive firewall rules — expose systems without any 'hacking' needed.<\/li><li><b>Outdated/obsolete devices, data or applications:<\/b> unpatched or end-of-life software has known vulnerabilities with public exploits; old forgotten data and devices are unmonitored targets.<\/li><li><b>Internet-facing assets:<\/b> web servers, VPN gateways, email servers, APIs and cloud services are reachable by anyone online, so they are scanned and attacked constantly.<\/li><\/ol>", "k": "theory", "d": null, "id": 1}, {"t": "fund", "src": ["T1C Q1(d)"], "m": 8, "q": "During COVID, institutions of higher learning resorted to e-learning; at NUL Thuto was used.<br>i. Give examples of confidentiality, integrity and availability requirements associated with Thuto, and in each case indicate the degree of importance of the requirement. [6]<br>ii. Give and explain any security vulnerability of Thuto. [2]", "a": "<div class=\"ans\"><b>Answer:<\/b> C: student marks/personal data (high); I: assessments and grades (high); A: access during tests/lectures (high, moderate otherwise).<\/div><div class=\"tw\"><table class=\"wt\"><thead><tr><th>Service<\/th><th>Example requirement<\/th><th>Importance<\/th><\/tr><\/thead><tbody><tr><td>Confidentiality<\/td><td>Student records, marks, unreleased test papers must only be seen by authorised users<\/td><td>High — privacy laws, cheating risk<\/td><\/tr><tr><td>Integrity<\/td><td>Submitted assignments, quiz answers and grades must not be altered by unauthorised people<\/td><td>High — academic results depend on it<\/td><\/tr><tr><td>Availability<\/td><td>System must be up for lectures, submissions and online tests (especially near deadlines)<\/td><td>High during tests/deadlines; moderate at other times<\/td><\/tr><\/tbody><\/table><\/div><h4>ii.<\/h4><p>E.g. <b>weak password-only logins<\/b>: students often use guessable passwords and fall for phishing, so an attacker can log in as a student/lecturer to submit, view or change work. (Others: no MFA, DDoS on exam days, unpatched Moodle plugins.)<\/p>", "k": "theory", "d": null, "id": 2}, {"t": "fund", "src": ["T1A Q1(a)(b)"], "m": 15, "q": "a) The CIA triad represents the fundamental principles of information security.<br>i. Identify any TWO threats to a wireless network that could compromise security, and specify the security service affected in each case. [4]<br>ii. Briefly explain each of the following attack vectors in a typical organisation's digital attack surface, and map each to the corresponding CIA attribute: Phishing Attacks, Insecure Endpoints, Insider Threats. [7]<br>b) Differentiate between active attacks and passive attacks, giving one example of each. [4]", "a": "<div class=\"ans\"><b>Answer:<\/b> a) i. Eavesdropping → confidentiality; jamming/DoS → availability (also rogue AP/evil twin → authentication/integrity).<\/div><h4>a) i.<\/h4><ol class=\"steps\"><li><b>Eavesdropping / sniffing<\/b> of radio traffic (weak or no WPA2/3 encryption) → <b>confidentiality<\/b>.<\/li><li><b>Jamming / deauthentication (DoS)<\/b> → <b>availability<\/b>.<\/li><li>(Also: rogue access point / evil twin → authentication &amp; integrity, MITM can alter data.)<\/li><\/ol><h4>a) ii.<\/h4><div class=\"tw\"><table class=\"wt\"><thead><tr><th>Vector<\/th><th>Explanation<\/th><th>CIA<\/th><\/tr><\/thead><tbody><tr><td>Phishing<\/td><td>Fraudulent emails/sites trick users into revealing credentials or running malware.<\/td><td>Confidentiality (stolen data/credentials); can lead to integrity loss<\/td><\/tr><tr><td>Insecure endpoints<\/td><td>Unpatched laptops, phones, IoT without antivirus/encryption become entry points; malware such as ransomware spreads from them.<\/td><td>Integrity &amp; availability (ransomware), confidentiality if stolen<\/td><\/tr><tr><td>Insider threats<\/td><td>Employees/contractors misuse their legitimate access, maliciously or carelessly.<\/td><td>Confidentiality (leaks) and integrity (sabotage, fraud)<\/td><\/tr><\/tbody><\/table><\/div><h4>b)<\/h4><div class=\"tw\"><table class=\"wt\"><thead><tr><th><\/th><th>Passive<\/th><th>Active<\/th><\/tr><\/thead><tbody><tr><td>What<\/td><td>Observes/monitors traffic only, no changes<\/td><td>Modifies, creates or blocks data/traffic<\/td><\/tr><tr><td>Detection<\/td><td>Hard to detect — focus on prevention (encryption)<\/td><td>Easier to detect — focus on detection &amp; recovery<\/td><\/tr><tr><td>Example<\/td><td>Eavesdropping, traffic analysis<\/td><td>Masquerade, replay, message modification, DoS<\/td><\/tr><\/tbody><\/table><\/div>", "k": "theory", "d": null, "id": 3}, {"t": "fund", "src": ["SUP26 Q1"], "m": 16, "q": "a) i. Describe one scenario where confidentiality is compromised without affecting integrity, and provide an example attack. [2]<br>ii. Explain insider threats, misconfigurations and insecure endpoints, mapping each to the CIA attribute primarily affected. [6]<br>b) Differentiate between active and passive attacks. Give two examples of each. [4]<br>c) For Eavesdropping and Denial-of-Service, identify the affected security service and one mitigation measure. [4]", "a": "<div class=\"ans\"><b>Answer:<\/b> a) i. Data is read but not changed — e.g. sniffing an unencrypted login. c) Eavesdropping → confidentiality (encrypt with TLS/VPN); DoS → availability (filtering, rate limiting, redundancy).<\/div><h4>a) i.<\/h4><p>An attacker on public Wi-Fi sniffs an unencrypted HTTP login or email — the data reaches the receiver unchanged (integrity intact) but its secrecy is lost. Attack: <b>eavesdropping / packet sniffing<\/b>.<\/p><h4>a) ii.<\/h4><div class=\"tw\"><table class=\"wt\"><thead><tr><th>Vector<\/th><th>Explanation<\/th><th>Primary CIA attribute<\/th><\/tr><\/thead><tbody><tr><td>Insider threats<\/td><td>Trusted staff misusing access (leaking or altering data)<\/td><td>Confidentiality (also integrity)<\/td><\/tr><tr><td>Misconfigurations<\/td><td>Default passwords, open ports, public cloud buckets expose data/services<\/td><td>Confidentiality<\/td><\/tr><tr><td>Insecure endpoints<\/td><td>Unpatched/unprotected devices infected with malware/ransomware<\/td><td>Integrity &amp; availability<\/td><\/tr><\/tbody><\/table><\/div><h4>b)<\/h4><div class=\"tw\"><table class=\"wt\"><thead><tr><th>Passive<\/th><th>Active<\/th><\/tr><\/thead><tbody><tr><td>Only observes, no modification; hard to detect<\/td><td>Alters/creates/blocks data; easier to detect<\/td><\/tr><tr><td>Eavesdropping; traffic analysis<\/td><td>Replay; masquerade; message modification; DoS<\/td><\/tr><\/tbody><\/table><\/div><h4>c)<\/h4><div class=\"tw\"><table class=\"wt\"><thead><tr><th>Attack<\/th><th>Service affected<\/th><th>Mitigation<\/th><\/tr><\/thead><tbody><tr><td>Eavesdropping<\/td><td>Confidentiality<\/td><td>Encrypt traffic (TLS, VPN/IPsec, WPA3)<\/td><\/tr><tr><td>Denial of Service<\/td><td>Availability<\/td><td>Firewall/IPS filtering, rate limiting, DDoS protection/CDN, redundancy<\/td><\/tr><\/tbody><\/table><\/div>", "k": "theory", "d": null, "id": 4}, {"t": "fund", "src": ["EX25 Q1(a)(b)(c)"], "m": 15, "q": "a) i. Differentiate between an attack surface and an attack vector. [2] ii. Explain the concept of Social Engineering, and describe one organisational method used to mitigate it. [3]<br>b) i. Describe one scenario where availability is compromised without affecting confidentiality, and provide an example attack. [2] ii. Is it possible to compromise integrity while confidentiality remains intact? Explain. [2]<br>c) i. Define a brute-force attack and explain why key length is important in mitigating it. [3] ii. Define a dictionary attack, and explain how password policies help reduce its effectiveness. [3]", "a": "<div class=\"ans\"><b>Answer:<\/b> Attack surface = all entry points; attack vector = a specific path/method through one of them.<\/div><h4>a) i.<\/h4><p><b>Attack surface:<\/b> the total set of points where an attacker could try to get in (all ports, apps, users, devices). <b>Attack vector:<\/b> the specific route or method used to exploit one of them (e.g. phishing email, unpatched VPN).<\/p><h4>a) ii.<\/h4><p><b>Social engineering<\/b> manipulates people rather than technology — tricking them into giving passwords, clicking links or granting access (phishing, pretexting, tailgating). Mitigation: regular <b>security-awareness training<\/b> with simulated phishing, plus verification procedures (call-back before payments/password resets).<\/p><h4>b) i.<\/h4><p>A company website/server is flooded so it becomes unreachable — no data is read or leaked, but users can't access the service. Example: <b>DDoS / SYN flood<\/b>.<\/p><h4>b) ii.<\/h4><p><b>Yes.<\/b> An attacker can alter data without ever reading it — e.g. flipping bits in a CTR/stream-encrypted message (the content stays secret but is changed), or deleting/corrupting records. That's why encryption needs a MAC/signature for integrity.<\/p><h4>c) i.<\/h4><p><b>Brute force:<\/b> trying every possible key/password until one works. Work grows as 2<sup>n<\/sup> for an n-bit key, so each extra bit doubles the effort: 56-bit DES fell in days, 128-bit AES would take longer than the age of the universe.<\/p><h4>c) ii.<\/h4><p><b>Dictionary attack:<\/b> a targeted guessing attack using lists of common/likely passwords and variations instead of every combination. Policies help by requiring length and complexity (not in dictionaries), banning common passwords, account lockout/rate limiting after failed attempts, and MFA.<\/p>", "k": "theory", "d": null, "id": 5}, {"t": "fund", "src": ["EX24 Q1(a)(c)"], "m": 16, "q": "a) An attack surface is the total number of possible points of entry for unauthorised access. Attack surfaces can be physical, digital, or social engineering in nature.<br>i. Briefly explain each mentioned attack surface. [3]<br>ii. For a typical organisation such as NUL, list any three digital attack surface vectors. [3]<br>iii. For the vectors listed, briefly explain how the risks could be mitigated. [3]<br>c) NUL's ERP system, ITS, has a Student Management Information System dubbed Student iEnabler.<br>i. Give examples of confidentiality, integrity, and availability requirements associated with Student iEnabler. [3]<br>ii. Give and explain any two security vulnerabilities of Student iEnabler. Also explain how they could be mitigated. [2,2]", "a": "<div class=\"ans\"><b>Answer:<\/b> Physical = hardware/premises; digital = software/network; social = people.<\/div><h4>a) i.<\/h4><ol class=\"steps\"><li><b>Physical:<\/b> devices and places an attacker can touch — laptops, USB ports, server rooms, discarded drives.<\/li><li><b>Digital:<\/b> everything reachable over a network — websites, apps, ports, APIs, cloud services, code.<\/li><li><b>Social engineering:<\/b> people who can be manipulated — staff/students tricked by phishing, phone pretexting, tailgating.<\/li><\/ol><h4>a) ii &amp; iii.<\/h4><div class=\"tw\"><table class=\"wt\"><thead><tr><th>Vector (NUL)<\/th><th>Mitigation<\/th><\/tr><\/thead><tbody><tr><td>Weak/reused student &amp; staff passwords<\/td><td>Strong password policy, MFA, lockout<\/td><\/tr><tr><td>Outdated/unpatched systems (Thuto, iEnabler, lab PCs)<\/td><td>Patch management, retire unsupported software, vulnerability scans<\/td><\/tr><tr><td>Internet-facing services &amp; misconfigurations (email, Wi-Fi, web portals)<\/td><td>Firewalls/WAF, close unused ports, secure configuration baselines, IDS monitoring<\/td><\/tr><\/tbody><\/table><\/div><h4>c) i.<\/h4><ol class=\"steps\"><li><b>C:<\/b> students' personal details, fees and results are only visible to that student and authorised staff.<\/li><li><b>I:<\/b> marks, registration and fee records can only be changed by authorised staff, with an audit trail.<\/li><li><b>A:<\/b> the portal must be up during registration and results release periods.<\/li><\/ol><h4>c) ii.<\/h4><ol class=\"steps\"><li><b>Password-only authentication<\/b> (weak/shared passwords, phishing) → enforce strong passwords + MFA.<\/li><li><b>Web application flaws<\/b> (SQL injection, broken access control letting a student view others' records) → secure coding, input validation, penetration testing, WAF; plus <b>DoS during peak registration<\/b> → load balancing, capacity planning.<\/li><\/ol>", "k": "theory", "d": null, "id": 6}, {"t": "fund", "src": ["EXAB Q1(a)(b)", "EX22 Q2(a)(c)"], "m": 10, "q": "a) An attack can be classified as strictly either active or passive. To what extent do you agree or disagree? [3] <span class='note'>(EX22: Differentiate between active and passive attacks, with an example of each [4].)<\/span><br>b) Your colleague argues that a defence strategy to counter/prevent any form of attack must be purely technical. Do you agree? [3]", "a": "<div class=\"ans\"><b>Answer:<\/b> a) Partly disagree — the classification is useful, but real attacks often combine both. b) Disagree — people and procedures matter as much as technology.<\/div><h4>a)<\/h4><ol class=\"steps\"><li>Passive: observes only (eavesdropping, traffic analysis), e.g. sniffing Wi-Fi. Active: modifies/creates/blocks (masquerade, replay, modification, DoS), e.g. replaying a captured login.<\/li><li>The labels describe single actions well, but real attacks are usually <b>multi-stage<\/b>: passive reconnaissance (sniffing) then an active attack (replay/hijack). So an attack campaign is often both — not strictly one or the other.<\/li><\/ol><h4>b)<\/h4><ol class=\"steps\"><li>Disagree. Technical controls (encryption, firewalls, IDS) are necessary but not sufficient.<\/li><li>Many attacks target people (phishing, social engineering, insiders) — countered by awareness training, policies and procedures.<\/li><li>Physical security (locked server rooms), legal/management controls and incident response are also needed ⇒ defence in depth = technical + administrative + physical.<\/li><\/ol>", "k": "theory", "d": null, "id": 7}, {"t": "fund", "src": ["EXAB Q1(c)"], "m": 9, "q": "The OSI security architecture highlights the importance of understanding security services. List any three security services needed within a computer network. For each service, mention mechanisms used to provide it. Further, list and describe a possible attack on each of the three services.", "a": "<div class=\"ans\"><b>Answer:<\/b> Confidentiality, Integrity, Authentication (also Availability, Non-repudiation, Access control).<\/div><div class=\"tw\"><table class=\"wt\"><thead><tr><th>Service<\/th><th>Mechanisms<\/th><th>Attack on it<\/th><\/tr><\/thead><tbody><tr><td>Confidentiality<\/td><td>Encipherment (AES, TLS), traffic padding, routing control<\/td><td>Eavesdropping / traffic analysis — reading data in transit<\/td><\/tr><tr><td>Data integrity<\/td><td>Hash functions, MACs/HMAC, digital signatures<\/td><td>Message modification — altering, inserting, reordering or replaying data<\/td><\/tr><tr><td>Authentication<\/td><td>Passwords + MFA, digital signatures/certificates, authentication exchange (Kerberos)<\/td><td>Masquerade / spoofing — pretending to be another user or host<\/td><\/tr><tr><td>Availability (extra)<\/td><td>Redundancy, firewalls, rate limiting<\/td><td>Denial of service<\/td><\/tr><tr><td>Non-repudiation (extra)<\/td><td>Digital signatures, notarisation<\/td><td>Repudiation — sender denies sending<\/td><\/tr><\/tbody><\/table><\/div>", "k": "theory", "d": null, "id": 8}, {"t": "fund", "src": ["EX22 Q2(b)"], "m": 3, "q": "What type of attacks are addressed by message authentication?", "a": "<div class=\"ans\"><b>Answer:<\/b> Masquerade, content modification, sequence modification and timing modification (replay/delay).<\/div><ol class=\"steps\"><li><b>Masquerade:<\/b> fraudulent messages claiming to come from a legitimate source.<\/li><li><b>Content modification:<\/b> changes to the message contents.<\/li><li><b>Sequence modification:<\/b> insertion, deletion or reordering of messages.<\/li><li><b>Timing modification:<\/b> delay or replay of messages. (Source/destination repudiation needs digital signatures.)<\/li><\/ol>", "k": "theory", "d": null, "id": 9}, {"t": "fund", "src": ["PY Q1"], "m": 10, "q": "For each description, give the term (≤ 3 words) that best describes it. In most cases the term is in Table 1 (Authenticity, Confidentiality, Honeypot, Integrity, IPS, IPSec, PKI, Signing, TLS Server, X.509) — spelling counts!<br>a) Ensures any modification to the data is detected by the intended receiver.<br>b) Ensures data received was sent by the specified sender.<br>c) Ensures a third party can verify that the data was sent by the specified sender.<br>d) An accepted standard for defining the format of public key certificates.<br>e) The number of integers in 1, …, n−1 that are relatively prime to n.<br>f) A trusted entity that issues TLS certificates to organisations that need them.<br>g) A network security tool that continuously monitors a network for malicious activity and takes action to prevent it.<br>h) Generating a hash with a private key and confirming the hash with the public key.<br>i) A secure protocol suite that authenticates and encrypts packets between two computers over an IP network.<br>j) An isolated computer or network that appears legitimate but is a closely-monitored trap.", "a": "<div class=\"ans\"><b>Answer:<\/b> Integrity, Authenticity, Non-repudiation, X.509, Euler's totient, Certificate Authority, IPS, Signing, IPSec, Honeypot<\/div><div class=\"tw\"><table class=\"wt\"><thead><tr><th><\/th><th>Description<\/th><th>Term<\/th><\/tr><\/thead><tbody><tr><td>a<\/td><td>Ensures any modification to the data is detected by the intended receiver.<\/td><td><b>Integrity<\/b><\/td><\/tr><tr><td>b<\/td><td>Ensures data received was sent by the specified sender.<\/td><td><b>Authenticity<\/b><\/td><\/tr><tr><td>c<\/td><td>Ensures a third party can verify that the data was sent by the specified sender.<\/td><td><b>Non-repudiation (via Signing)<\/b><\/td><\/tr><tr><td>d<\/td><td>An accepted standard for defining the format of public key certificates.<\/td><td><b>X.509<\/b><\/td><\/tr><tr><td>e<\/td><td>The number of integers in 1, …, n−1 that are relatively prime to n.<\/td><td><b>Euler's totient (φ(n))<\/b><\/td><\/tr><tr><td>f<\/td><td>A trusted entity that issues TLS certificates to organisations that need them.<\/td><td><b>Certificate Authority<\/b><\/td><\/tr><tr><td>g<\/td><td>A network security tool that continuously monitors a network for malicious activity and takes action to prevent it.<\/td><td><b>IPS<\/b><\/td><\/tr><tr><td>h<\/td><td>Generating a hash with a private key and confirming the hash with the public key.<\/td><td><b>Signing<\/b><\/td><\/tr><tr><td>i<\/td><td>A secure protocol suite that authenticates and encrypts packets between two computers over an IP network.<\/td><td><b>IPSec<\/b><\/td><\/tr><tr><td>j<\/td><td>An isolated computer or network that appears legitimate but is a closely-monitored trap.<\/td><td><b>Honeypot<\/b><\/td><\/tr><\/tbody><\/table><\/div><p class='tip'>(c) is the property that a <i>third party<\/i> can check the sender — non-repudiation, achieved by signing. (e) and (f) aren't in the table — that's why it says \"in most cases\". IPS (not IDS) because it also <i>takes action<\/i>.<\/p>", "k": "theory", "d": null, "id": 10}, {"t": "classical", "src": ["T1B Q1(a)"], "m": 4, "q": "The ciphertext UCR was encrypted using the function 9x + 2 mod 26. Find the plaintext.", "a": "<div class=\"ans\"><b>Answer:<\/b> Plaintext = <b>CAT<\/b><\/div><ol class=\"steps\"><li>Decryption: d(y) = a<sup>−1<\/sup>(y − b) mod 26 with a = 9, b = 2.<\/li><li>9<sup>−1<\/sup> mod 26: 26 = 2×9 + 8, 9 = 1×8 + 1 ⇒ 1 = 9 − 8 = 9 − (26 − 2×9) = 3×9 − 26 ⇒ 9<sup>−1<\/sup> = 3 (check 9×3 = 27 ≡ 1 ✓)<\/li><li>So d(y) = 3(y − 2) mod 26. Letters a=0 … z=25:<\/li><\/ol><div class=\"tw\"><table class=\"wt\"><thead><tr><th>c<\/th><th>y<\/th><th>a<sup>−1<\/sup>(y − b)<\/th><th>mod 26<\/th><th>p<\/th><\/tr><\/thead><tbody><tr><td>U<\/td><td>20<\/td><td>3×(20−2) = 54<\/td><td>2<\/td><td>c<\/td><\/tr><tr><td>C<\/td><td>2<\/td><td>3×(2−2) = 0<\/td><td>0<\/td><td>a<\/td><\/tr><tr><td>R<\/td><td>17<\/td><td>3×(17−2) = 45<\/td><td>19<\/td><td>t<\/td><\/tr><\/tbody><\/table><\/div><p>Check by re-encrypting: e(x)=9x+2 on CAT gives UCR ✓<\/p>", "k": "calc", "d": null, "id": 11}, {"t": "classical", "src": ["T1C Q1(b)"], "m": 6, "q": "Consider an affine cipher (mod 26). You do a chosen plaintext attack using \"hahaha\". The ciphertext is NONONO.<br>i. Briefly explain a chosen plaintext attack. [1]<br>ii. Determine the encryption function. [5]", "a": "<div class=\"ans\"><b>Answer:<\/b> ii. e(x) = 11x + 14 (mod 26)<\/div><h4>i.<\/h4><p>In a <b>chosen-plaintext attack<\/b> the attacker can pick plaintexts of their choice, get them encrypted (e.g. temporary access to the encryption machine), and use the plaintext–ciphertext pairs to recover the key.<\/p><h4>ii.<\/h4><ol class=\"steps\"><li>Letters: h = 7 → N = 13; a = 0 → O = 14.<\/li><li>e(x) = ax + b: from a ↦ O: a·0 + b ≡ 14 ⇒ <b>b = 14<\/b>.<\/li><li>From h ↦ N: 7a + 14 ≡ 13 ⇒ 7a ≡ −1 ≡ 25 (mod 26).<\/li><li>7<sup>−1<\/sup> mod 26 = 15 (7 × 15 = 105 = 4×26 + 1).<\/li><li>a ≡ 15 × 25 = 375 = 14×26 + 11 ⇒ <b>a = 11<\/b> (gcd(11, 26) = 1 ✓ valid key).<\/li><li>e(x) = 11x + 14 mod 26. Check: h: 11×7 + 14 = 91 = 3×26 + 13 → N ✓; a: 14 → O ✓<\/li><\/ol>", "k": "calc", "d": null, "id": 12}, {"t": "classical", "src": ["EX24 Q3(a)"], "m": 7, "q": "Consider an affine cipher (mod 26). Determine the decryption function if you do a chosen plaintext attack using \"yes\" and the ciphertext is \"TXP\".", "a": "<div class=\"ans\"><b>Answer:<\/b> e(x) = 5x + 3, so d(y) = 21(y − 3) ≡ 21y + 15 (mod 26)<\/div><ol class=\"steps\"><li>Values: y = 24 → T = 19; e = 4 → X = 23; s = 18 → P = 15.<\/li><li>Equations: 24a + b ≡ 19 … (1) &nbsp; 4a + b ≡ 23 … (2)<\/li><li>(1) − (2): 20a ≡ −4 ≡ 22 (mod 26).<\/li><li>gcd(20, 26) = 2 and 2 | 22 ⇒ divide by 2: 10a ≡ 11 (mod 13).<\/li><li>10<sup>−1<\/sup> mod 13 = 4 (10 × 4 = 40 = 3×13 + 1) ⇒ a ≡ 4 × 11 = 44 ≡ 5 (mod 13) ⇒ a = 5 or 18 (mod 26).<\/li><li>a must be coprime to 26 ⇒ a = 18 is even, rejected ⇒ <b>a = 5<\/b>.<\/li><li>From (2): b ≡ 23 − 20 = <b>3<\/b>. So e(x) = 5x + 3.<\/li><li>Check third letter: s = 18 → 5×18 + 3 = 93 = 3×26 + 15 → P ✓<\/li><li>Decryption: 5<sup>−1<\/sup> mod 26 = 21 (5×21 = 105 ≡ 1) ⇒ d(y) = 21(y − 3) = 21y − 63 ≡ <b>21y + 15<\/b> (mod 26) (since −63 + 78 = 15).<\/li><\/ol>", "k": "calc", "d": null, "id": 13}, {"t": "classical", "src": ["EX25 Q2(b)"], "m": 5, "q": "Consider the affine cipher e(x) = 7x + 3 (mod 26). Determine the decryption function.", "a": "<div class=\"ans\"><b>Answer:<\/b> d(y) = 15(y − 3) ≡ 15y + 7 (mod 26)<\/div><ol class=\"steps\"><li>d(y) = a<sup>−1<\/sup>(y − b) mod 26, need 7<sup>−1<\/sup> mod 26.<\/li><li>Euclid: 26 = 3×7 + 5; 7 = 1×5 + 2; 5 = 2×2 + 1<\/li><li>Back-sub: 1 = 5 − 2×2 = 5 − 2(7 − 5) = 3×5 − 2×7 = 3(26 − 3×7) − 2×7 = 3×26 − 11×7<\/li><li>⇒ 7<sup>−1<\/sup> ≡ −11 ≡ 15 (mod 26). Check 7 × 15 = 105 = 4×26 + 1 ✓<\/li><li>d(y) = 15(y − 3) = 15y − 45 ≡ 15y + 7 (mod 26) (since −45 + 52 = 7).<\/li><li>Check: x = 2 → e = 17 → d = 15×17 + 7 = 262 = 10×26 + 2 ✓<\/li><\/ol>", "k": "calc", "d": null, "id": 14}, {"t": "classical", "src": ["T1A Q2(b)"], "m": 9, "q": "Consider the affine cipher e(x) = ax + b (mod 26). Assess the following parameters:<br>i. a = 4, b = 6 [2]<br>ii. a = 3, b = 10 [2]<br>iii. Determine the decryption function when e(x) = 5x + 7 (mod 26). [5]", "a": "<div class=\"ans\"><b>Answer:<\/b> i. invalid (gcd(4,26) = 2) &nbsp; ii. valid &nbsp; iii. d(y) = 21(y − 7) ≡ 21y + 9 (mod 26)<\/div><h4>i. a = 4, b = 6<\/h4><ol class=\"steps\"><li>The key is only usable if a has an inverse mod 26, i.e. gcd(a, 26) = 1.<\/li><li>gcd(4, 26) = 2 ≠ 1 ⇒ <b>not valid<\/b>: e.g. e(0) = 6 and e(13) = 4×13 + 6 = 58 ≡ 6 — two letters map to the same cipher letter, so decryption is ambiguous.<\/li><\/ol><h4>ii. a = 3, b = 10<\/h4><ol class=\"steps\"><li>gcd(3, 26) = 1 ⇒ 3<sup>−1<\/sup> exists (3×9 = 27 ≡ 1) ⇒ <b>valid<\/b>; b can be any value 0–25.<\/li><\/ol><h4>iii. e(x) = 5x + 7<\/h4><ol class=\"steps\"><li>5<sup>−1<\/sup> mod 26: 26 = 5×5 + 1 ⇒ 1 = 26 − 5×5 ⇒ 5<sup>−1<\/sup> ≡ −5 ≡ 21. Check 5×21 = 105 ≡ 1 ✓<\/li><li>d(y) = 21(y − 7) = 21y − 147. −147 + 6×26 = −147 + 156 = 9<\/li><li>⇒ <b>d(y) = 21y + 9 (mod 26)<\/b>. Check: x = 1 → y = 12 → 21×12 + 9 = 261 = 10×26 + 1 ✓<\/li><\/ol>", "k": "calc", "d": null, "id": 15}, {"t": "classical", "src": ["E1 A(c)"], "m": null, "q": "Given the encryption function e(x) = 17x + 26 (mod 128). Find the corresponding decryption function.", "a": "<div class=\"ans\"><b>Answer:<\/b> d(y) = 113(y − 26) ≡ 113y + 6 (mod 128)<\/div><ol class=\"steps\"><li>Need 17<sup>−1<\/sup> mod 128. Euclid: 128 = 7×17 + 9; 17 = 1×9 + 8; 9 = 1×8 + 1<\/li><li>Back-sub: 1 = 9 − 8 = 9 − (17 − 9) = 2×9 − 17 = 2(128 − 7×17) − 17 = 2×128 − 15×17<\/li><li>⇒ 17<sup>−1<\/sup> ≡ −15 ≡ 113 (mod 128). Check 17×113 = 1921 = 15×128 + 1 ✓<\/li><li>d(y) = 113(y − 26) = 113y − 2938; 2938 = 22×128 + 122 ⇒ −2938 ≡ −122 ≡ 6 (mod 128)<\/li><li><b>d(y) = 113y + 6 (mod 128)<\/b><\/li><\/ol>", "k": "calc", "d": null, "id": 16}, {"t": "classical", "src": ["T1C Q1(c)"], "m": 4, "q": "Using the Playfair cipher with the keyword \"SECRETIVE\", encrypt the message \"Bob\".", "a": "<div class=\"ans\"><b>Answer:<\/b> Ciphertext = <b>APAY<\/b><\/div><ol class=\"steps\"><li>Build the 5×5 key square: write the keyword (dropping repeated letters), then the rest of the alphabet; I and J share a cell.<\/li><li>Key square:<table class=\"pf\"><tr><td>S<\/td><td>E<\/td><td>C<\/td><td>R<\/td><td>T<\/td><\/tr><tr><td>I/J<\/td><td>V<\/td><td>A<\/td><td>B<\/td><td>D<\/td><\/tr><tr><td>F<\/td><td>G<\/td><td>H<\/td><td>K<\/td><td>L<\/td><\/tr><tr><td>M<\/td><td>N<\/td><td>O<\/td><td>P<\/td><td>Q<\/td><\/tr><tr><td>U<\/td><td>W<\/td><td>X<\/td><td>Y<\/td><td>Z<\/td><\/tr><\/table><\/li><li>Split the plaintext into digrams (insert X between a repeated pair, pad an odd last letter with X): <b>BO BX<\/b><\/li><li>Encrypt each digram:<\/li><\/ol><div class=\"tw\"><table class=\"wt\"><thead><tr><th>digram<\/th><th>positions (row,col)<\/th><th>rule<\/th><th>cipher<\/th><\/tr><\/thead><tbody><tr><td>BO<\/td><td>(1,3) (3,2)<\/td><td>rectangle → swap columns (stay in own row)<\/td><td>AP<\/td><\/tr><tr><td>BX<\/td><td>(1,3) (4,2)<\/td><td>rectangle → swap columns (stay in own row)<\/td><td>AY<\/td><\/tr><\/tbody><\/table><\/div>", "k": "calc", "d": null, "id": 17}, {"t": "classical", "src": ["EX22 Q1(b)"], "m": 2, "q": "Encrypt the word \"secure\" with key \"cyber\" using Playfair cipher.", "a": "<div class=\"ans\"><b>Answer:<\/b> Ciphertext = <b>XGACCR<\/b><\/div><ol class=\"steps\"><li>Build the 5×5 key square: write the keyword (dropping repeated letters), then the rest of the alphabet; I and J share a cell.<\/li><li>Key square:<table class=\"pf\"><tr><td>C<\/td><td>Y<\/td><td>B<\/td><td>E<\/td><td>R<\/td><\/tr><tr><td>A<\/td><td>D<\/td><td>F<\/td><td>G<\/td><td>H<\/td><\/tr><tr><td>I/J<\/td><td>K<\/td><td>L<\/td><td>M<\/td><td>N<\/td><\/tr><tr><td>O<\/td><td>P<\/td><td>Q<\/td><td>S<\/td><td>T<\/td><\/tr><tr><td>U<\/td><td>V<\/td><td>W<\/td><td>X<\/td><td>Z<\/td><\/tr><\/table><\/li><li>Split the plaintext into digrams (insert X between a repeated pair, pad an odd last letter with X): <b>SE CU RE<\/b><\/li><li>Encrypt each digram:<\/li><\/ol><div class=\"tw\"><table class=\"wt\"><thead><tr><th>digram<\/th><th>positions (row,col)<\/th><th>rule<\/th><th>cipher<\/th><\/tr><\/thead><tbody><tr><td>SE<\/td><td>(3,3) (0,3)<\/td><td>same column → take letter below<\/td><td>XG<\/td><\/tr><tr><td>CU<\/td><td>(0,0) (4,0)<\/td><td>same column → take letter below<\/td><td>AC<\/td><\/tr><tr><td>RE<\/td><td>(0,4) (0,3)<\/td><td>same row → take letter to the right<\/td><td>CR<\/td><\/tr><\/tbody><\/table><\/div>", "k": "calc", "d": null, "id": 18}, {"t": "classical", "src": ["EX25 Q2(a)"], "m": 5, "q": "Encrypt the plaintext \"CYBER\" using a Playfair Cipher with key \"TECHNOLOGY\".", "a": "<div class=\"ans\"><b>Answer:<\/b> Ciphertext = <b>HGDTXH<\/b><\/div><ol class=\"steps\"><li>Build the 5×5 key square: write the keyword (dropping repeated letters), then the rest of the alphabet; I and J share a cell.<\/li><li>Key square:<table class=\"pf\"><tr><td>T<\/td><td>E<\/td><td>C<\/td><td>H<\/td><td>N<\/td><\/tr><tr><td>O<\/td><td>L<\/td><td>G<\/td><td>Y<\/td><td>A<\/td><\/tr><tr><td>B<\/td><td>D<\/td><td>F<\/td><td>I/J<\/td><td>K<\/td><\/tr><tr><td>M<\/td><td>P<\/td><td>Q<\/td><td>R<\/td><td>S<\/td><\/tr><tr><td>U<\/td><td>V<\/td><td>W<\/td><td>X<\/td><td>Z<\/td><\/tr><\/table><\/li><li>Split the plaintext into digrams (insert X between a repeated pair, pad an odd last letter with X): <b>CY BE RX<\/b><\/li><li>Encrypt each digram:<\/li><\/ol><div class=\"tw\"><table class=\"wt\"><thead><tr><th>digram<\/th><th>positions (row,col)<\/th><th>rule<\/th><th>cipher<\/th><\/tr><\/thead><tbody><tr><td>CY<\/td><td>(0,2) (1,3)<\/td><td>rectangle → swap columns (stay in own row)<\/td><td>HG<\/td><\/tr><tr><td>BE<\/td><td>(2,0) (0,1)<\/td><td>rectangle → swap columns (stay in own row)<\/td><td>DT<\/td><\/tr><tr><td>RX<\/td><td>(3,3) (4,3)<\/td><td>same column → take letter below<\/td><td>XH<\/td><\/tr><\/tbody><\/table><\/div>", "k": "calc", "d": null, "id": 19}, {"t": "classical", "src": ["T1A Q2(a)"], "m": 3, "q": "Explain the Vigenère Cipher with a suitable example.", "a": "<div class=\"ans\"><b>Answer:<\/b> Vigenère is a polyalphabetic substitution cipher: each plaintext letter is shifted by the corresponding letter of a repeating keyword.<\/div><ol class=\"steps\"><li>Letters are numbers a = 0 … z = 25. Repeat the key under the plaintext.<\/li><li>Encrypt: C<sub>i<\/sub> = (P<sub>i<\/sub> + K<sub>i mod m<\/sub>) mod 26; decrypt: P<sub>i<\/sub> = (C<sub>i<\/sub> − K<sub>i<\/sub>) mod 26.<\/li><li>Example: plaintext \"attack\", key \"key\" → <b>KXRKGI<\/b>:<div class=\"tw\"><table class=\"wt\"><thead><tr><th>letter<\/th><th>value<\/th><th>key<\/th><th>value<\/th><th>sum<\/th><th>mod 26<\/th><th>result<\/th><\/tr><\/thead><tbody><tr><td>a<\/td><td>0<\/td><td>k<\/td><td>10<\/td><td>0+10 = 10<\/td><td>10<\/td><td>k<\/td><\/tr><tr><td>t<\/td><td>19<\/td><td>e<\/td><td>4<\/td><td>19+4 = 23<\/td><td>23<\/td><td>x<\/td><\/tr><tr><td>t<\/td><td>19<\/td><td>y<\/td><td>24<\/td><td>19+24 = 43<\/td><td>17<\/td><td>r<\/td><\/tr><tr><td>a<\/td><td>0<\/td><td>k<\/td><td>10<\/td><td>0+10 = 10<\/td><td>10<\/td><td>k<\/td><\/tr><tr><td>c<\/td><td>2<\/td><td>e<\/td><td>4<\/td><td>2+4 = 6<\/td><td>6<\/td><td>g<\/td><\/tr><tr><td>k<\/td><td>10<\/td><td>y<\/td><td>24<\/td><td>10+24 = 34<\/td><td>8<\/td><td>i<\/td><\/tr><\/tbody><\/table><\/div><\/li><li>Because the same plaintext letter can encrypt to different letters (the two 'a's→ 'k' and 'y'), single-letter frequencies are flattened — stronger than a monoalphabetic cipher, but breakable once the key length is found (Kasiski / index of coincidence).<\/li><\/ol>", "k": "calc", "d": null, "id": 20}, {"t": "classical", "src": ["EX22 Q1(c)"], "m": 6, "q": "Decrypt the ciphertext \"iagf\" generated with the key \"faic\" using Hill cipher and based on the alphabet \"ABCDEFGHI\".", "a": "<div class=\"ans\"><b>Answer:<\/b> Plaintext = <b>HIDE<\/b><\/div><ol class=\"steps\"><li>Alphabet has 9 letters: A=0, B=1, …, I=8, so work mod 9.<\/li><li>Key \"faic\" → 2×2 matrix (row by row) K = <span class='mat'>[5 0 ; 8 2]<\/span>.<\/li><li>det K = 5×2 − 0×8 = 10 ≡ 1 (mod 9); gcd(1, 9) = 1 so K is invertible; det<sup>−1<\/sup> = 1.<\/li><li>adj(K) = [d −b ; −c a] = <span class='mat'>[2 0 ; -8 5]<\/span> ≡ <span class='mat'>[2 0 ; 1 5]<\/span> (mod 9)<\/li><li>K<sup>−1<\/sup> = det<sup>−1<\/sup> × adj(K) = <span class='mat'>[2 0 ; 1 5]<\/span> (mod 9)<\/li><li>Decrypt each pair as a column vector: P = K<sup>−1<\/sup>·C (mod 9):<\/li><\/ol><div class=\"tw\"><table class=\"wt\"><thead><tr><th>pair<\/th><th>C<\/th><th>top row<\/th><th>bottom row<\/th><th>mod 9<\/th><th>plain<\/th><\/tr><\/thead><tbody><tr><td>IA<\/td><td>(8, 0)<\/td><td>2×8 + 0×0 = 16<\/td><td>1×8 + 5×0 = 8<\/td><td>(7, 8)<\/td><td>hi<\/td><\/tr><tr><td>GF<\/td><td>(6, 5)<\/td><td>2×6 + 0×5 = 12<\/td><td>1×6 + 5×5 = 31<\/td><td>(3, 4)<\/td><td>de<\/td><\/tr><\/tbody><\/table><\/div><p class='tip'>Check: K × (7, 8)<sup>T<\/sup> = (5×7 + 0×8, 8×7 + 2×8) = (35, 72) ≡ (8, 0) = \"ia\" ✓<\/p>", "k": "calc", "d": null, "id": 21}, {"t": "classical", "src": ["EXAB Q2"], "m": 15, "q": "Two friends who love music decided to base their communication on the alphabet of music (letters A to G).<br>a) They encrypt \"feed\" using the key \"cage\". What do they get using: i. Vigenère cipher [2] ii. Column transposition cipher [2]<br>b) Decrypt the ciphertext \"cfdg\" generated with Hill cipher, using the key \"abeg\". [6]<br>c) An affine-cipher fan says the alphabet is too small and advises doubling the alphabet size and adding one (so 2×7 + 1 = 15). On the increased alphabet the friend advises using the affine cipher with either (5, 8) or (6, 8) as encryption keys, where 8 is legitimately within the key space. Is the overall advice sound? [5]", "a": "<div class=\"ans\"><b>Answer:<\/b> a) i. AEDA &nbsp; ii. EFDE &nbsp; b) ACED &nbsp; c) No — both keys are invalid for a 15-letter alphabet.<\/div><p>Alphabet: A=0, B=1, C=2, D=3, E=4, F=5, G=6 ⇒ all arithmetic mod 7.<\/p><h4>a) i. Vigenère<\/h4><div class=\"tw\"><table class=\"wt\"><thead><tr><th>letter<\/th><th>value<\/th><th>key<\/th><th>value<\/th><th>sum<\/th><th>mod 7<\/th><th>result<\/th><\/tr><\/thead><tbody><tr><td>f<\/td><td>5<\/td><td>c<\/td><td>2<\/td><td>5+2 = 7<\/td><td>0<\/td><td>a<\/td><\/tr><tr><td>e<\/td><td>4<\/td><td>a<\/td><td>0<\/td><td>4+0 = 4<\/td><td>4<\/td><td>e<\/td><\/tr><tr><td>e<\/td><td>4<\/td><td>g<\/td><td>6<\/td><td>4+6 = 10<\/td><td>3<\/td><td>d<\/td><\/tr><tr><td>d<\/td><td>3<\/td><td>e<\/td><td>4<\/td><td>3+4 = 7<\/td><td>0<\/td><td>a<\/td><\/tr><\/tbody><\/table><\/div><h4>a) ii. Column transposition<\/h4><ol class=\"steps\"><li>Write the plaintext in rows under the key letters; number the key letters alphabetically: c a g e → a=1, c=2, e=3, g=4.<\/li><li><div class=\"tw\"><table class=\"wt\"><thead><tr><th>c (2)<\/th><th>a (1)<\/th><th>g (4)<\/th><th>e (3)<\/th><\/tr><\/thead><tbody><tr><td>f<\/td><td>e<\/td><td>e<\/td><td>d<\/td><\/tr><\/tbody><\/table><\/div><\/li><li>Read the columns in key order 1, 2, 3, 4: a→E, c→F, e→D, g→E ⇒ <b>EFDE<\/b><\/li><\/ol><h4>b) Hill decryption (mod 7)<\/h4><ol class=\"steps\"><li>Key \"abeg\" → K = <span class='mat'>[0 1 ; 4 6]<\/span> (a=0, b=1, e=4, g=6).<\/li><li>det K = 0×6 − 1×4 = −4 ≡ 3 (mod 7); det<sup>−1<\/sup> = 5 (3×5 = 15 ≡ 1).<\/li><li>adj(K) = <span class='mat'>[6 -1 ; -4 0]<\/span> ≡ <span class='mat'>[6 6 ; 3 0]<\/span>; K<sup>−1<\/sup> = 5 × adj = <span class='mat'>[2 2 ; 1 0]<\/span> (mod 7).<\/li><li>P = K<sup>−1<\/sup>·C for each column vector:<\/li><\/ol><div class=\"tw\"><table class=\"wt\"><thead><tr><th>pair<\/th><th>C<\/th><th>top row<\/th><th>bottom row<\/th><th>mod 7<\/th><th>plain<\/th><\/tr><\/thead><tbody><tr><td>CF<\/td><td>(2, 5)<\/td><td>2×2 + 2×5 = 14<\/td><td>1×2 + 0×5 = 2<\/td><td>(0, 2)<\/td><td>ac<\/td><\/tr><tr><td>DG<\/td><td>(3, 6)<\/td><td>2×3 + 2×6 = 18<\/td><td>1×3 + 0×6 = 3<\/td><td>(4, 3)<\/td><td>ed<\/td><\/tr><\/tbody><\/table><\/div><p class='tip'>Check: K·(0, 2)<sup>T<\/sup> = (0×0 + 1×2, 4×0 + 6×2) = (2, 12) ≡ (2, 5) = \"cf\" ✓. Same column-vector convention (C = K·P) as the Feb 2022 Hill question, which decrypts to the word HIDE.<\/p><h4>c) Affine on a 15-letter alphabet<\/h4><ol class=\"steps\"><li>For e(x) = ax + b mod 15 to be decryptable, a must have an inverse mod 15 ⇒ gcd(a, 15) = 1.<\/li><li>(5, 8): gcd(5, 15) = 5 ≠ 1 ⇒ invalid. (6, 8): gcd(6, 15) = 3 ≠ 1 ⇒ invalid.<\/li><li>b = 8 is fine (any 0 ≤ b ≤ 14 works) — the problem is a.<\/li><li>Valid a values: {1, 2, 4, 7, 8, 11, 13, 14} → only φ(15) = 8 choices, key space 8 × 15 = 120 — still tiny and brute-forceable.<\/li><li>⇒ The advice is <b>not sound<\/b>: both suggested keys make the cipher non-invertible, and a bigger alphabet alone does not give real security.<\/li><\/ol>", "k": "calc", "d": null, "id": 22}, {"t": "classical", "src": ["EX24 Q2(a)"], "m": 4, "q": "Consider a general mono-alphabetic cipher operating on a language which has 30 characters. There are 1,000,000 words in the dictionary of this language. An attacker can decrypt at 10<sup>12<\/sup> decryptions per second.<br>i. If the attacker attempts a brute force attack, what is the maximum time the attack will take? [1]<br>ii. Explain what language analysis is, and how it can make an attack on a mono-alphabetic cipher very easy compared to an attack on a poly-alphabetic cipher. [3]", "a": "<div class=\"ans\"><b>Answer:<\/b> i. 30! / 10<sup>12<\/sup> ≈ 2.65e+20 s ≈ 8.4e+12 years<\/div><h4>i.<\/h4><ol class=\"steps\"><li>A general monoalphabetic key is any permutation of the 30 characters ⇒ key space = 30! ≈ 2.65 × 10<sup>32<\/sup>.<\/li><li>Worst case try every key: 30! / 10<sup>12<\/sup> ≈ 2.65e+20 seconds.<\/li><li>÷ (3.156 × 10<sup>7<\/sup> s per year) ≈ <b>8.4e+12 years<\/b> — brute force is hopeless.<\/li><li>(The 1,000,000-word dictionary is only used to recognise when a trial key gives sensible text.)<\/li><\/ol><h4>ii.<\/h4><ol class=\"steps\"><li><b>Language (frequency) analysis<\/b> uses the known statistics of the language: letter frequencies, common digrams/trigrams, common words.<\/li><li>In a monoalphabetic cipher each plaintext letter always maps to the same cipher letter, so the ciphertext keeps the exact frequency pattern of the language — just relabelled.<\/li><li>Match the most frequent cipher letters to the most frequent language letters, then fix the rest using digrams/words ⇒ broken in minutes despite the huge key space.<\/li><li>A polyalphabetic cipher (e.g. Vigenère) uses many substitution alphabets, so one plaintext letter becomes different cipher letters; the frequencies are flattened and the attacker must first find the key length before frequency analysis works.<\/li><\/ol>", "k": "calc", "d": null, "id": 23}, {"t": "classical", "src": ["EX22 Q1(a)"], "m": 2, "q": "Explain the major challenge to using classical cryptography in modern systems.", "a": "<div class=\"ans\"><b>Answer:<\/b> Classical ciphers are too weak against modern computing — small key spaces and leaked statistical patterns make them easy to brute-force or break with frequency/known-plaintext analysis.<\/div><ol class=\"steps\"><li>Key spaces (e.g. 25 Caesar shifts, 312 affine keys) are trivially brute-forced by computers.<\/li><li>They work letter-by-letter, so language statistics leak into the ciphertext (no real diffusion/confusion).<\/li><li>They are also only designed for text, not arbitrary binary data, and give no integrity/authentication.<\/li><\/ol>", "k": "theory", "d": null, "id": 24}, {"t": "classical", "src": ["E1 A(a)"], "m": null, "q": "Encrypt the word \"looter\" using: i. Shift cipher with k = 10 &nbsp; ii. Playfair with keyword \"security\" &nbsp; iii. Auto-key cipher with keyword \"two\" &nbsp; iv. Vigenère with key \"fat\" &nbsp; v. Hill cipher with k = [6 7 ; 3 15]", "a": "<div class=\"ans\"><b>Answer:<\/b> i. VYYDOB &nbsp; ii. MPMACS &nbsp; iii. EKCESF &nbsp; iv. QOHYEK &nbsp; v. IJJPNH<\/div><h4>i. Shift k = 10<\/h4><div class=\"tw\"><table class=\"wt\"><thead><tr><th>p<\/th><th>l<\/th><th>o<\/th><th>o<\/th><th>t<\/th><th>e<\/th><th>r<\/th><\/tr><\/thead><tbody><tr><td>x<\/td><td>11<\/td><td>14<\/td><td>14<\/td><td>19<\/td><td>4<\/td><td>17<\/td><\/tr><tr><td>x+10 mod 26<\/td><td>21<\/td><td>24<\/td><td>24<\/td><td>3<\/td><td>14<\/td><td>1<\/td><\/tr><tr><td>c<\/td><td>V<\/td><td>Y<\/td><td>Y<\/td><td>D<\/td><td>O<\/td><td>B<\/td><\/tr><\/tbody><\/table><\/div><h4>ii. Playfair<\/h4><table class=\"pf\"><tr><td>S<\/td><td>E<\/td><td>C<\/td><td>U<\/td><td>R<\/td><\/tr><tr><td>I/J<\/td><td>T<\/td><td>Y<\/td><td>A<\/td><td>B<\/td><\/tr><tr><td>D<\/td><td>F<\/td><td>G<\/td><td>H<\/td><td>K<\/td><\/tr><tr><td>L<\/td><td>M<\/td><td>N<\/td><td>O<\/td><td>P<\/td><\/tr><tr><td>Q<\/td><td>V<\/td><td>W<\/td><td>X<\/td><td>Z<\/td><\/tr><\/table><p>Digrams: LO OT ER<\/p><div class=\"tw\"><table class=\"wt\"><thead><tr><th>digram<\/th><th>positions (row,col)<\/th><th>rule<\/th><th>cipher<\/th><\/tr><\/thead><tbody><tr><td>LO<\/td><td>(3,0) (3,3)<\/td><td>same row → take letter to the right<\/td><td>MP<\/td><\/tr><tr><td>OT<\/td><td>(3,3) (1,1)<\/td><td>rectangle → swap columns (stay in own row)<\/td><td>MA<\/td><\/tr><tr><td>ER<\/td><td>(0,1) (0,4)<\/td><td>same row → take letter to the right<\/td><td>CS<\/td><\/tr><\/tbody><\/table><\/div><h4>iii. Autokey<\/h4><p>Key stream = keyword followed by the plaintext itself: t w o l o o<\/p><div class=\"tw\"><table class=\"wt\"><thead><tr><th>p<\/th><th>value<\/th><th>key<\/th><th>value<\/th><th>sum mod 26<\/th><th>c<\/th><\/tr><\/thead><tbody><tr><td>l<\/td><td>11<\/td><td>t<\/td><td>19<\/td><td>4<\/td><td>e<\/td><\/tr><tr><td>o<\/td><td>14<\/td><td>w<\/td><td>22<\/td><td>10<\/td><td>k<\/td><\/tr><tr><td>o<\/td><td>14<\/td><td>o<\/td><td>14<\/td><td>2<\/td><td>c<\/td><\/tr><tr><td>t<\/td><td>19<\/td><td>l<\/td><td>11<\/td><td>4<\/td><td>e<\/td><\/tr><tr><td>e<\/td><td>4<\/td><td>o<\/td><td>14<\/td><td>18<\/td><td>s<\/td><\/tr><tr><td>r<\/td><td>17<\/td><td>o<\/td><td>14<\/td><td>5<\/td><td>f<\/td><\/tr><\/tbody><\/table><\/div><h4>iv. Vigenère<\/h4><div class=\"tw\"><table class=\"wt\"><thead><tr><th>letter<\/th><th>value<\/th><th>key<\/th><th>value<\/th><th>sum<\/th><th>mod 26<\/th><th>result<\/th><\/tr><\/thead><tbody><tr><td>l<\/td><td>11<\/td><td>f<\/td><td>5<\/td><td>11+5 = 16<\/td><td>16<\/td><td>q<\/td><\/tr><tr><td>o<\/td><td>14<\/td><td>a<\/td><td>0<\/td><td>14+0 = 14<\/td><td>14<\/td><td>o<\/td><\/tr><tr><td>o<\/td><td>14<\/td><td>t<\/td><td>19<\/td><td>14+19 = 33<\/td><td>7<\/td><td>h<\/td><\/tr><tr><td>t<\/td><td>19<\/td><td>f<\/td><td>5<\/td><td>19+5 = 24<\/td><td>24<\/td><td>y<\/td><\/tr><tr><td>e<\/td><td>4<\/td><td>a<\/td><td>0<\/td><td>4+0 = 4<\/td><td>4<\/td><td>e<\/td><\/tr><tr><td>r<\/td><td>17<\/td><td>t<\/td><td>19<\/td><td>17+19 = 36<\/td><td>10<\/td><td>k<\/td><\/tr><\/tbody><\/table><\/div><h4>v. Hill (C = K·P, column vectors, mod 26)<\/h4><div class=\"tw\"><table class=\"wt\"><thead><tr><th>pair<\/th><th>P<\/th><th>top row<\/th><th>bottom row<\/th><th>mod 26<\/th><th>c<\/th><\/tr><\/thead><tbody><tr><td>lo<\/td><td>(11, 14)<\/td><td>6×11 + 7×14 = 164<\/td><td>3×11 + 15×14 = 243<\/td><td>(8, 9)<\/td><td>IJ<\/td><\/tr><tr><td>ot<\/td><td>(14, 19)<\/td><td>6×14 + 7×19 = 217<\/td><td>3×14 + 15×19 = 327<\/td><td>(9, 15)<\/td><td>JP<\/td><\/tr><tr><td>er<\/td><td>(4, 17)<\/td><td>6×4 + 7×17 = 143<\/td><td>3×4 + 15×17 = 267<\/td><td>(13, 7)<\/td><td>NH<\/td><\/tr><\/tbody><\/table><\/div>", "k": "calc", "d": null, "id": 25}, {"t": "classical", "src": ["E1 A(b)"], "m": null, "q": "Suppose ciphertext EEDLUIOIHFBGGNLR was obtained from encrypting plaintext p with rectangular transposition cipher using a key k. No padding was necessary. What is p and k?", "a": "<div class=\"ans\"><b>Answer:<\/b> p = HUGE FINE BOLD GIRL (\"hugefineboldgirl\"), k = 3 2 4 1 (4 columns)<\/div><ol class=\"steps\"><li>16 letters, no padding ⇒ rectangle is 2×8, 4×4 or 8×2. Try 4 columns: split the ciphertext into 4 columns of 4: EEDL | UIOI | HFBG | GNLR.<\/li><li>Try column orders until rows read as English. Placing them as columns 4, 2, 1, 3:<\/li><li><div class=\"tw\"><table class=\"wt\"><thead><tr><th>col 1<\/th><th>col 2<\/th><th>col 3<\/th><th>col 4<\/th><\/tr><\/thead><tbody><tr><td>H<\/td><td>U<\/td><td>G<\/td><td>E<\/td><\/tr><tr><td>F<\/td><td>I<\/td><td>N<\/td><td>E<\/td><\/tr><tr><td>B<\/td><td>O<\/td><td>L<\/td><td>D<\/td><\/tr><tr><td>G<\/td><td>I<\/td><td>R<\/td><td>L<\/td><\/tr><\/tbody><\/table><\/div><\/li><li>Rows read: HUGE FINE BOLD GIRL ✓<\/li><li>The first column read out (EEDL) was column 4, then column 2 (UIOI), column 1 (HFBG), column 3 (GNLR) ⇒ key numbers per column: <b>3 2 4 1<\/b>.<\/li><\/ol>", "k": "calc", "d": null, "id": 26}, {"t": "classical", "src": ["E1 B", "E2 C"], "m": null, "q": "Simple substitution: write a program to decipher<br><span class='mono small'>SEVEBPAELOELNWGORPGVYUAAGLROEKLKUVUBPWPTGLOPWRUWSPLVELRNQSGLSIPKEWAOEYWEFUAGLSPAAGRPLCPGLSIPQTGSKUVUCEOPUCEOPSESUATUNEQSSIPXQPPLVZUVVGLRNPYEWPULEYYGCGUAULEQLCPBPLS<\/span><br>a) enciphered with key UNCOPYRIGHTABLEZXWVSQMKJFD (hint: royal affairs, not our country).<br>b) What is the result with keys i. ELOIDTGKXYCRHBPMZJQVWNFSAU ii. MOVIEZYXWUTSRQPNLKJHGFDCBA iii. DERMATOGLYPHICSZXWVUQNKJFB?<br>c) Encipher your own message with one of the keys.", "a": "<div class=\"ans\"><b>Answer:<\/b> a) \"TO SOME LONDON BRIDGE IS FALLING DOWN WAS A MERE KINDERGARTEN SONG BUT IN THE WORLD OF ROYAL INTELLIGENCE IN THE UK IT WAS A CODE, A CODE TO TALK ABOUT THE QUEEN'S PASSING BEFORE AN OFFICIAL ANNOUNCEMENT\"<\/div><h4>Program (Python)<\/h4><pre class=\"code\">import string\nALPHA = string.ascii_uppercase\n\ndef decipher(ct, key):\n    # key[i] is the cipher letter used for ALPHA[i]\n    table = {key[i]: ALPHA[i] for i in range(26)}\n    return \"\".join(table.get(c, c) for c in ct)\n\ndef encipher(pt, key):\n    table = {ALPHA[i]: key[i] for i in range(26)}\n    return \"\".join(table.get(c, c) for c in pt.upper())\n\nct = \"SEVEBPAELOELNWGORPGV...\"   # paste full ciphertext\nprint(decipher(ct, \"UNCOPYRIGHTABLEZXWVSQMKJFD\"))<\/pre><h4>a) Output<\/h4><p class='mono small'>TOSOMELONDONBRIDGEISFALLINGDOWNWASAMEREKINDERGARTENSONGBUTINTHEWORLDOFROYALINTELLIGENCEINTHEUKITWASACODEACODETOTALKABOUTTHEQUEENSPASSINGBEFOREANOFFICIALANOUNCEMENT<\/p><h4>b) Wrong keys give gibberish<\/h4><ol class=\"steps\"><li><span class='mono small'>XATANOYABCABVUGCLOGTJZYYGBLCAHBHZTZNOUOFGBCOULZUXOBTABLVSXGB…<\/span><\/li><li><span class='mono small'>LECEYOZEQBEQPIUBMOUCGJZZUQMBERQRJCJYOIOKUQBOIMJILOQCEQMPNLUQ…<\/span><\/li><li><span class='mono small'>OBSBZKEBIGBIVRHGCKHSJTEEHICGBWIWTSTZKRKFHIGKRCTROKISBICVUOHI…<\/span><\/li><\/ol><p>Each is still a valid permutation, so the program runs — but only the correct key gives readable English. Point: the cipher is only as strong as keeping the key secret, yet frequency analysis would still break it.<\/p><h4>c)<\/h4><p>e.g. encipher(\"MEET AT NOON\", \"UNCOPYRIGHTABLEZXWVSQMKJFD\") → <span class='mono'>BPPS US LEEL<\/span><\/p>", "k": "calc", "d": null, "id": 27}, {"t": "classical", "src": ["E2 B(a)"], "m": null, "q": "Assume the hexadecimal number system is the alphabet in use. For p = 3BE60A4 and keyword = 19F, what is c using Vigenère cipher?", "a": "<div class=\"ans\"><b>Answer:<\/b> c = 44D7995<\/div><ol class=\"steps\"><li>Alphabet of 16 symbols ⇒ C<sub>i<\/sub> = (P<sub>i<\/sub> + K<sub>i<\/sub>) mod 16, key repeated 1 9 F 1 9 F 1.<\/li><\/ol><div class=\"tw\"><table class=\"wt\"><thead><tr><th>p<\/th><th>value<\/th><th>key<\/th><th>value<\/th><th>sum<\/th><th>mod 16<\/th><\/tr><\/thead><tbody><tr><td>3<\/td><td>3<\/td><td>1<\/td><td>1<\/td><td>4<\/td><td>4<\/td><\/tr><tr><td>B<\/td><td>11<\/td><td>9<\/td><td>9<\/td><td>20<\/td><td>4<\/td><\/tr><tr><td>E<\/td><td>14<\/td><td>F<\/td><td>15<\/td><td>29<\/td><td>D<\/td><\/tr><tr><td>6<\/td><td>6<\/td><td>1<\/td><td>1<\/td><td>7<\/td><td>7<\/td><\/tr><tr><td>0<\/td><td>0<\/td><td>9<\/td><td>9<\/td><td>9<\/td><td>9<\/td><\/tr><tr><td>A<\/td><td>10<\/td><td>F<\/td><td>15<\/td><td>25<\/td><td>9<\/td><\/tr><tr><td>4<\/td><td>4<\/td><td>1<\/td><td>1<\/td><td>5<\/td><td>5<\/td><\/tr><\/tbody><\/table><\/div>", "k": "calc", "d": null, "id": 28}, {"t": "classical", "src": ["E2 B(b)"], "m": null, "q": "The ciphertext SPLPLQTDHV was obtained by encrypting plaintext p with a rectangular transposition cipher (key k, no padding), followed by a Playfair cipher with the key \"worker bees\" (padding with 'x' was necessary). Find p and k. Hints: p is English, the first word has 4 letters, the last letter is not a vowel.", "a": "<div class=\"ans\"><b>Answer:<\/b> p = \"late night\", k = 3 1 2<\/div><ol class=\"steps\"><li>Undo the last step first: Playfair-decrypt with key square for WORKER BEES:<table class=\"pf\"><tr><td>W<\/td><td>O<\/td><td>R<\/td><td>K<\/td><td>E<\/td><\/tr><tr><td>B<\/td><td>S<\/td><td>A<\/td><td>C<\/td><td>D<\/td><\/tr><tr><td>F<\/td><td>G<\/td><td>H<\/td><td>I/J<\/td><td>L<\/td><\/tr><tr><td>M<\/td><td>N<\/td><td>P<\/td><td>Q<\/td><td>T<\/td><\/tr><tr><td>U<\/td><td>V<\/td><td>X<\/td><td>Y<\/td><td>Z<\/td><\/tr><\/table><\/li><li>Decrypt rules are the reverse: same row → letter to the LEFT, same column → letter ABOVE, rectangle → swap columns.<\/li><li>SP → AN, LP → HT, LQ → IT, TD → LE, HV → GX ⇒ <b>ANHTITLEGX<\/b><\/li><li>The final X is Playfair padding (odd length), so the transposition ciphertext is ANHTITLEG (9 letters ⇒ 3×3 grid).<\/li><li>Columns: ANH | TIT | LEG. The letters A,E,G,H,I,L,N,T,T with a 4-letter first word suggest LATE NIGHT:<\/li><li><div class=\"tw\"><table class=\"wt\"><thead><tr><th>col 1<\/th><th>col 2<\/th><th>col 3<\/th><\/tr><\/thead><tbody><tr><td>L<\/td><td>A<\/td><td>T<\/td><\/tr><tr><td>E<\/td><td>N<\/td><td>I<\/td><\/tr><tr><td>G<\/td><td>H<\/td><td>T<\/td><\/tr><\/tbody><\/table><\/div><\/li><li>Columns are LEG (col 1), ANH (col 2), TIT (col 3); read-out order was col 2, col 3, col 1 ⇒ key <b>k = 3 1 2<\/b>.<\/li><li>p = <b>LATENIGHT<\/b> — first word 4 letters, last letter T is not a vowel ✓<\/li><\/ol>", "k": "calc", "d": null, "id": 29}, {"t": "nt", "src": ["T1B Q2(a)"], "m": 5, "q": "Find integers x and y such that 17x + 101y = 1.", "a": "<div class=\"ans\"><b>Answer:<\/b> x = 6, y = −1 &nbsp;(check: 17(6) + 101(−1) = 1)<\/div><ol class=\"steps\"><li>Euclid first: 101 = 5 × 17 + 16; 17 = 1 × 16 + 1; 16 = 16 × 1 + 0<\/li><li>Extended Euclid table (each row satisfies r<sub>i<\/sub> = 17·x<sub>i<\/sub> + 101·y<sub>i<\/sub>):<\/li><\/ol><div class=\"tw\"><table class=\"wt\"><thead><tr><th>i<\/th><th>q<sub>i<\/sub> = ⌊r<sub>i-2<\/sub>/r<sub>i-1<\/sub>⌋<\/th><th>r<sub>i<\/sub> = r<sub>i-2<\/sub> − q·r<sub>i-1<\/sub><\/th><th>x<sub>i<\/sub> = x<sub>i-2<\/sub> − q·x<sub>i-1<\/sub><\/th><th>y<sub>i<\/sub> = y<sub>i-2<\/sub> − q·y<sub>i-1<\/sub><\/th><\/tr><\/thead><tbody><tr><td>0<\/td><td>–<\/td><td>17<\/td><td>1<\/td><td>0<\/td><\/tr><tr><td>1<\/td><td>–<\/td><td>101<\/td><td>0<\/td><td>1<\/td><\/tr><tr><td>2<\/td><td>0<\/td><td>17<\/td><td>1<\/td><td>0<\/td><\/tr><tr><td>3<\/td><td>5<\/td><td>16<\/td><td>-5<\/td><td>1<\/td><\/tr><tr><td>4<\/td><td>1<\/td><td><b>1<\/b><\/td><td>6<\/td><td>-1<\/td><\/tr><tr><td>5<\/td><td>16<\/td><td>0<\/td><td>-101<\/td><td>17<\/td><\/tr><\/tbody><\/table><\/div><ol class=\"steps cont\"><li>Last non-zero remainder: gcd(17, 101) = 1, with x = 6, y = −1.<\/li><li>Check: 17×(6) + 101×(−1) = 102 + -101 = 1 ✓<\/li><li>General solution: x = 6 + 101t, y = −1 − 17t (t ∈ ℤ)<\/li><\/ol><p class='tip'>Back-substitution version (what you'd write by hand):<\/p><ol class=\"steps\"><li>101 = 5 × 17 + 16<\/li><li>17 = 1 × 16 + 1<\/li><li>16 = 16 × 1 + 0<\/li><\/ol><p>Back-substitute:<\/p><ol class=\"steps\"><li>1 = 17 − 1 × 16<\/li><li>1 = −1 × 101 + (6) × 17<\/li><\/ol>", "k": "calc", "d": null, "id": 30}, {"t": "nt", "src": ["T1A Q3(b)"], "m": 6, "q": "Find integers x and y such that 47x + 21y = 2. Use the Extended Euclidean Algorithm.", "a": "<div class=\"ans\"><b>Answer:<\/b> x = −8, y = 18 &nbsp;(check: 47(−8) + 21(18) = 2)<\/div><ol class=\"steps\"><li>Euclid first: 47 = 2 × 21 + 5; 21 = 4 × 5 + 1; 5 = 5 × 1 + 0<\/li><li>Extended Euclid table (each row satisfies r<sub>i<\/sub> = 47·x<sub>i<\/sub> + 21·y<sub>i<\/sub>):<\/li><\/ol><div class=\"tw\"><table class=\"wt\"><thead><tr><th>i<\/th><th>q<sub>i<\/sub> = ⌊r<sub>i-2<\/sub>/r<sub>i-1<\/sub>⌋<\/th><th>r<sub>i<\/sub> = r<sub>i-2<\/sub> − q·r<sub>i-1<\/sub><\/th><th>x<sub>i<\/sub> = x<sub>i-2<\/sub> − q·x<sub>i-1<\/sub><\/th><th>y<sub>i<\/sub> = y<sub>i-2<\/sub> − q·y<sub>i-1<\/sub><\/th><\/tr><\/thead><tbody><tr><td>0<\/td><td>–<\/td><td>47<\/td><td>1<\/td><td>0<\/td><\/tr><tr><td>1<\/td><td>–<\/td><td>21<\/td><td>0<\/td><td>1<\/td><\/tr><tr><td>2<\/td><td>2<\/td><td>5<\/td><td>1<\/td><td>-2<\/td><\/tr><tr><td>3<\/td><td>4<\/td><td><b>1<\/b><\/td><td>-4<\/td><td>9<\/td><\/tr><tr><td>4<\/td><td>5<\/td><td>0<\/td><td>21<\/td><td>-47<\/td><\/tr><\/tbody><\/table><\/div><ol class=\"steps cont\"><li>Last non-zero remainder: gcd(47, 21) = 1, with x = −4, y = 9.<\/li><li>Check: 47×(−4) + 21×(9) = -188 + 189 = 1 ✓<\/li><li>Multiply through by 2: x = 2×(−4) = −8, y = 2×(9) = 18<\/li><li>Check: 47×(−8) + 21×(18) = -376 + 378 = 2 ✓<\/li><li>General solution: x = −8 + 21t, y = 18 − 47t (t ∈ ℤ)<\/li><\/ol><p class='tip'>Back-substitution version (what you'd write by hand):<\/p><ol class=\"steps\"><li>47 = 2 × 21 + 5<\/li><li>21 = 4 × 5 + 1<\/li><li>5 = 5 × 1 + 0<\/li><\/ol><p>Back-substitute:<\/p><ol class=\"steps\"><li>1 = 21 − 4 × 5<\/li><li>1 = −4 × 47 + (9) × 21<\/li><\/ol>", "k": "calc", "d": null, "id": 31}, {"t": "nt", "src": g congruences:<br>i. 5<sup>39<\/sup> ≡ x (mod 17) &nbsp;[3]<br>ii. 7x ≡ 3 (mod 7) &nbsp;[3]", "a": "<div class=\"ans\"><b>Answer:<\/b> i. x = 10 &nbsp; ii. no solution<\/div><h4>i.<\/h4><ol class=\"steps\"><li>gcd(5, 17) = 1, so by Fermat's theorem 5<sup>16<\/sup> ≡ 1 (mod 17)<\/li><li>39 = 2 × 16 + 7<\/li><li>5<sup>39<\/sup> = (5<sup>16<\/sup>)<sup>2<\/sup> × 5<sup>7<\/sup> ≡ 1<sup>2<\/sup> × 5<sup>7<\/sup> ≡ 5<sup>7<\/sup> (mod 17)<\/li><\/ol><p>7 in binary = 111<sub>2<\/sub>, so 7 = 4 + 2 + 1.<\/p><div class=\"tw\"><table class=\"wt\"><thead><tr><th>power<\/th><th>working<\/th><th>value mod 17<\/th><\/tr><\/thead><tbody><tr><td>5<sup>1<\/sup><\/td><td>5 mod 17<\/td><td>5<\/td><\/tr><tr><td>5<sup>2<\/sup><\/td><td>5<sup>2<\/sup> = 25 mod 17<\/td><td>8<\/td><\/tr><tr><td>5<sup>4<\/sup><\/td><td>8<sup>2<\/sup> = 64 mod 17<\/td><td>13<\/td><\/tr><\/tbody><\/table><\/div><p>5<sup>7<\/sup> = 5<sup>4<\/sup> × 5<sup>2<\/sup> × 5<sup>1<\/sup> ≡ 13 × 8 × 5 (mod 17)<\/p><ol class=\"steps\"><li>13 × 8 = 104 ≡ 2<\/li><li>2 × 5 = 10 ≡ 10<\/li><\/ol><p>⇒ 5<sup>7<\/sup> mod 17 = <b>10<\/b><\/p><h4>ii. 7x ≡ 3 (mod 7)<\/h4><ol class=\"steps\"><li>7x is always a multiple of 7, so 7x ≡ 0 (mod 7) for every integer x.<\/li><li>We need 7x ≡ 3, but 0 ≢ 3 (mod 7). Equivalently gcd(7, 7) = 7 does not divide 3.<\/li><li>⇒ <b>No solution.<\/b><\/li><\/ol>", "k": "calc", "d": null, "id": 41}, {"t": "nt", "src": ["T1C Q2(d)"], "m": 5, "q": "Solve the following congruences simultaneously: 3<sup>20<\/sup> ≡ x (mod 19) and 3x ≡ 4 (mod 11). &nbsp;[4,1]", "a": "<div class=\"ans\"><b>Answer:<\/b> x ≡ 9 (mod 19) and x ≡ 5 (mod 11) ⇒ x ≡ 104 (mod 209)<\/div><h4>Step 1: reduce 3<sup>20<\/sup> mod 19<\/h4><ol class=\"steps\"><li>gcd(3, 19) = 1, so by Fermat's theorem 3<sup>18<\/sup> ≡ 1 (mod 19)<\/li><li>20 = 1 × 18 + 2<\/li><li>3<sup>20<\/sup> = (3<sup>18<\/sup>)<sup>1<\/sup> × 3<sup>2<\/sup> ≡ 1<sup>1<\/sup> × 3<sup>2<\/sup> ≡ 3<sup>2<\/sup> (mod 19)<\/li><li>3<sup>2<\/sup> = 9 = 0 × 19 + 9 ≡ <b>9<\/b> (mod 19)<\/li><\/ol><h4>Step 2: 3x ≡ 4 (mod 11)<\/h4><ol class=\"steps\"><li>gcd(3, 11) = 1 so a unique solution exists.<\/li><li>Inverse of 3 mod 11 is 4 since 3 × 4 = 12 ≡ 1 (mod 11)<\/li><li>x ≡ 4 × 4 = 16 ≡ 5 (mod 11)<\/li><li>Check: 3 × 5 = 15 = 1 × 11 + 4 ≡ 4 (mod 11) ✓<\/li><\/ol><h4>Step 3: combine with CRT<\/h4><p>M = 19 × 11 = 209. Moduli are pairwise coprime so CRT applies.<\/p><div class=\"tw\"><table class=\"wt\"><thead><tr><th>m<sub>i<\/sub><\/th><th>a<sub>i<\/sub><\/th><th>M<sub>i<\/sub> = M/m<sub>i<\/sub><\/th><th>M<sub>i<\/sub> mod m<sub>i<\/sub><\/th><th>y<sub>i<\/sub> = M<sub>i<\/sub><sup>−1<\/sup> mod m<sub>i<\/sub><\/th><th>a<sub>i<\/sub>·M<sub>i<\/sub>·y<sub>i<\/sub><\/th><\/tr><\/thead><tbody><tr><td>19<\/td><td>9<\/td><td>11<\/td><td>11 mod 19 = 11<\/td><td>7<\/td><td>693<\/td><\/tr><tr><td>11<\/td><td>5<\/td><td>19<\/td><td>19 mod 11 = 8<\/td><td>7<\/td><td>665<\/td><\/tr><\/tbody><\/table><\/div><p>x = 693 + 665 = 1358 ≡ <b>104<\/b> (mod 209)<\/p><p>Check: 104 mod 19 = 9, 104 mod 11 = 5 ✓<\/p>", "k": "calc", "d": null, "id": 42}, {"t": "nt", "src": ["EX24 Q3(b)"], "m": 10, "q": "Solve the following congruences simultaneously: 4<sup>19<\/sup> ≡ x (mod 17) and 6x ≡ 4 (mod 11). &nbsp;[3,2,5]", "a": "<div class=\"ans\"><b>Answer:<\/b> x ≡ 13 (mod 17), x ≡ 8 (mod 11) ⇒ x ≡ 30 (mod 187)<\/div><h4>Part 1 [3]: 4<sup>19<\/sup> mod 17<\/h4><ol class=\"steps\"><li>gcd(4, 17) = 1, so by Fermat's theorem 4<sup>16<\/sup> ≡ 1 (mod 17)<\/li><li>19 = 1 × 16 + 3<\/li><li>4<sup>19<\/sup> = (4<sup>16<\/sup>)<sup>1<\/sup> × 4<sup>3<\/sup> ≡ 1<sup>1<\/sup> × 4<sup>3<\/sup> ≡ 4<sup>3<\/sup> (mod 17)<\/li><li>4<sup>3<\/sup> = 64 = 3 × 17 + 13 ≡ <b>13<\/b> (mod 17)<\/li><\/ol><h4>Part 2 [2]: 6x ≡ 4 (mod 11)<\/h4><ol class=\"steps\"><li>gcd(6, 11) = 1 so a unique solution exists.<\/li><li>Inverse of 6 mod 11 is 2 since 6 × 2 = 12 ≡ 1 (mod 11)<\/li><li>x ≡ 2 × 4 = 8 ≡ 8 (mod 11)<\/li><li>Check: 6 × 8 = 48 = 4 × 11 + 4 ≡ 4 (mod 11) ✓<\/li><\/ol><h4>Part 3 [5]: CRT< wt\"><thead><tr><th>m<sub>i<\/sub><\/th><th>a<sub>i<\/sub><\/th><th>M<sub>i<\/sub> = M/m<sub>i<\/sub><\/th><th>M<sub>i<\/sub> mod m<sub>i<\/sub><\/th><th>y<sub>i<\/sub> = M<sub>i<\/sub><sup>−1<\/sup> mod m<sub>i<\/sub><\/th><th>a<sub>i<\/sub>·M<sub>i<\/sub>·y<sub>i<\/sub><\/th><\/tr><\/thead><tbody><tr><td>4<\/td><td>2<\/td><td>9<\/td><td>9 mod 4 = 1<\/td><td>1<\/td><td>18<\/td><\/tr><tr><td>9<\/td><td>7<\/td><td>4<\/td><td>4 mod 9 = 4<\/td><td>7<\/td><td>196<\/td><\/tr><\/tbody><\/table><\/div><p>x = 18 + 196 = 214 ≡ <b>34<\/b> (mod 36)<\/p><p>Check: 34 mod 4 = 2, 34 mod 9 = 7 ✓<\/p>", "k": "calc", "d": null, "id": 45}, {"t": "nt", "src": ["E7 A(b)"], "m": null, "q": "Use the Chinese Remainder Theorem to solve:<br>x ≡ 3 (mod 4)<br>x ≡ 1 (mod 5)<br>x ≡ 2 (mod 3)", "a": "<div class=\"ans\"><b>Answer:<\/b> x ≡ 11 (mod 60)<\/div><p>M = 4 × 5 × 3 = 60. Moduli are pairwise coprime so CRT applies.<\/p><div class=\"tw\"><table class=\"wt\"><thead><tr><th>m<sub>i<\/sub><\/th><th>a<sub>i<\/sub><\/th><th>M<sub>i<\/sub> = M/m<sub>i<\/sub><\/th><th>M<sub>i<\/sub> mod m<sub>i<\/sub><\/th><th>y<sub>i<\/sub> = M<sub>i<\/sub><sup>−1<\/sup> mod m<sub>i<\/sub><\/th><th>a<sub>i<\/sub>·M<sub>i<\/sub>·y<sub>i<\/sub><\/th><\/tr><\/thead><tbody><tr><td>4<\/td><td>3<\/td><td>15<\/td><td>15 mod 4 = 3<\/td><td>3<\/td><td>135<\/td><\/tr><tr><td>5<\/td><td>1<\/td><td>12<\/td><td>12 mod 5 = 2<\/td><td>3<\/td><td>36<\/td><\/tr><tr><td>3<\/td><td>2<\/td><td>20<\/td><td>20 mod 3 = 2<\/td><td>2<\/td><td>80<\/td><\/tr><\/tbody><\/table><\/div><p>x = 135 + 36 + 80 = 251 ≡ <b>11<\/b> (mod 60)<\/p><p>Check: 11 mod 4 = 3, 11 mod 5 = 1, 11 mod 3 = 2 ✓<\/p>", "k": "calc", "d": null, "id": 46}, {"t": "nt", "src": ["E7 A(c)"], "m": null, "q": "Use the Chinese Remainder Theorem to solve:<br>x ≡ 2 (mod 5)<br>x ≡ 3 (mod 7)<br>x ≡ 10 (mod 11)", "a": "<div class=\"ans\"><b>Answer:<\/b> x ≡ 87 (mod 385)<\/div><p>M = 5 × 7 × 11 = 385. Moduli are pairwise coprime so CRT applies.<\/p><div class=\"tw\"><table class=\"wt\"><thead><tr><th>m<sub>i<\/sub><\/th><th>a<sub>i<\/sub><\/th><th>M<sub>i<\/sub> = M/m<sub>i<\/sub><\/th><th>M<sub>i<\/sub> mod m<sub>i<\/sub><\/th><th>y<sub>i<\/sub> = M<sub>i<\/sub><sup>−1<\/sup> mod m<sub>i<\/sub><\/th><th>a<sub>i<\/sub>·M<sub>i<\/sub>·y<sub>i<\/sub><\/th><\/tr><\/thead><tbody><tr><td>5<\/td><td>2<\/td><td>77<\/td><td>77 mod 5 = 2<\/td><td>3<\/td><td>462<\/td><\/tr><tr><td>7<\/td><td>3<\/td><td>55<\/td><td>55 mod 7 = 6<\/td><td>6<\/td><td>990<\/td><\/tr><tr><td>11<\/td><td>10<\/td><td>35<\/td><td>35 mod 11 = 2<\/td><td>6<\/td><td>2100<\/td><\/tr><\/tbody><\/table><\/div><p>x = 462 + 990 + 2100 = 3552 ≡ <b>87<\/b> (mod 385)<\/p><p>Check: 87 mod 5 = 2, 87 mod 7 = 3, 87 mod 11 = 10 ✓<\/p>", "k": "calc", "d": null, "id": 47}, {"t": "nt", "src": ["E7 A(d)"], "m": null, "q": "Use the Chinese Remainder Theorem to solve:<br>x ≡ 3 (mod 17)<br>x ≡ 10 (mod 16)<br>x ≡ 0 (mod 15)", "a": "<div class=\"ans\"><b>Answer:<\/b> x ≡ 3930 (mod 4080)<\/div><p>M = 17 × 16 × 15 = 4080. Moduli are pairwise coprime so CRT applies.<\/p><div class=\"tw\"><table class=\"wt\"><thead><tr><th>m<sub>i<\/sub><\/th><th>a<sub>i<\/sub><\/th><th>M<sub>i<\/sub> = M/m<sub>i<\/sub><\/th><th>M<sub>i<\/sub> mod m<sub>i<\/sub><\/th><th>y<sub>i<\/sub> = M<sub>i<\/sub><sup>−1<\/sup> mod m<sub>i<\/sub><\/th><th>a<sub>i<\/sub>·M<sub>i<\/sub>·y<sub>i<\/sub><\/th><\/tr><\/thead><tbody><tr><td>17<\/td><td>3<\/td><td>240<\/td><td>240 mod 17 = 2<\/td><td>9<\/td><td>6480<\/td><\/tr><tr><td>16<\/td><td>10<\/td><td>255<\/td><td>255 mod 16 = 15<\/td><td>15<\/td><td>38250<\/td><\/tr><tr><td>15<\/td><td>0<\/td><td>272<\/td><td>272 mod 15 = 2<\/td><td>8<\/td><td>0<\/td><\/tr><\/tbody><\/table><\/div><p>x = 6480 + 38250 + 0 = 44730 ≡ <b>3930<\/b> (mod 4080)<\/p><p>Check: 3930 mod 17 = 3, 3930 mod 16 = 10, 3930 mod 15 = 0 ✓<\/p>", "k": "calc", "d": null, "id": 48}, {"t": "nt", "src": ["T1A Q2(d)"], "m": 3, "q": "A number can be represented as the product of its primes: 540 = 2<sup>2<\/sup> × 3<sup>4<\/sup> × 5. Compute Euler's Totient Function, φ(540).", "a": "<div class=\"ans\"><b>Answer:<\/b> φ(540) = 144<\/div><ol class=\"steps\"><li>Formula: if n = ∏ p<sup>k<\/sup> then φ(n) = n ∏ (1 − 1/p).<\/li><li>φ(540) = 540 × (1 − 1/2) × (1 − 1/3) × (1 − 1/5) = 540 × 1/2 × 2/3 × 4/5<\/li><li>= 270 × 2/3 × 4/5 = 180 × 4/5 = <b>144<\/b><\/li><li>(Same thing using prime powers: φ(2²)·φ(3⁴)·φ(5) = 2 × 54 × 4 = 144)<\/li><\/ol>", "k": "calc", "d": null, "id": 49}, {"t": "nt", "src": ["EX25 Q3(a)"], "m": 2, "q": "Compute Euler's Totient Function of n = p×q where p = 73 and q = 41.", "a": "<div class=\"ans\"><b>Answer:<\/b> φ(n) = 2880<\/div><ol class=\"steps\"><li>p and q are distinct primes, so φ(pq) = (p − 1)(q − 1).<\/li><li>φ(73 × 41) = 72 × 40 = <b>2880<\/b><\/li><\/ol>", "k": "calc", "d": null, "id": 50}, {"t": "nt", "src": ["E2 A(a)"], "m": null, "q": "Find the value of: i. φ(19) &nbsp; ii. φ(125) &nbsp; iii. φ(462) &nbsp; iv. φ(4563)", "a": "<div class=\"ans\"><b>Answer:<\/b> φ(19) = 18, φ(125) = 100, φ(462) = 120, φ(4563) = 2808<\/div><ol class=\"steps\"><li>19 is prime ⇒ φ(19) = 19 − 1 = <b>18<\/b><\/li><li>125 = 5<sup>3<\/sup> ⇒ φ(125) = 125 × (1 − 1/5) = <b>100<\/b><\/li><li>462 = 2 × 3 × 7 × 11 ⇒ φ(462) = 462 × (1 − 1/2) × (1 − 1/3) × (1 − 1/7) × (1 − 1/11) = <b>120<\/b><\/li><li>4563 = 3<sup>3<\/sup> × 13<sup>2<\/sup> ⇒ φ(4563) = 4563 × (1 − 1/3) × (1 − 1/13) = <b>2808<\/b><\/li><\/ol>", "k": "calc", "d": null, "id": 51}, {"t": "nt", "src": ["E2 A(b)"], "m": null, "q": "Using the extended Euclidean algorithm, find the multiplicative inverse of: i. 3 mod 10 &nbsp; ii. 8 mod 11 &nbsp; iii. 15 mod 26 &nbsp; iv. 47 mod 64", "a": "<div class=\"ans\"><b>Answer:<\/b> 7, 7, 7, 15<\/div><ol class=\"steps\"><li><b>3<sup>−1<\/sup> mod 10 = 7<\/b><ol class=\"steps\"><li>10 = 3 × 3 + 1<\/li><li>3 = 3 × 1 + 0<\/li><\/ol><p>Back-substitute:<\/p><ol class=\"steps\"><li>1 = 10 − 3 × 3<\/li><\/ol><p>So 3 × (−3) ≡ 1 ⇒ inverse = −3 mod 10 = 7. Check: 3×7 = 21 ≡ 1 (mod 10) ✓<\/p><\/li><li><b>8<sup>−1<\/sup> mod 11 = 7<\/b><ol class=\"steps\"><li>11 = 1 × 8 + 3<\/li><li>8 = 2 × 3 + 2<\/li><li>3 = 1 × 2 + 1<\/li><li>2 = 2 × 1 + 0<\/li><\/ol><p>Back-substitute:<\/p><ol class=\"steps\"><li>1 = 3 − 1 × 2<\/li><li>1 = −1 × 8 + (3) × 3<\/li><li>1 = 3 × 11 − (4) × 8<\/li><\/ol><p>So 8 × (−4) ≡ 1 ⇒ inverse = −4 mod 11 = 7. Check: 8×7 = 56 ≡ 1 (mod 11) ✓<\/p><\/li><li><b>15<sup>−1<\/sup> mod 26 = 7<\/b><ol class=\"steps\"><li>26 = 1 × 15 + 11<\/li><li>15 = 1 × 11 + 4<\/li><li>11 = 2 × 4 + 3<\/li><li>4 = 1 × 3 + 1<\/li><li>3 = 3 × 1 + 0<\/li><\/ol><p>Back-substitute:<\/p><ol class=\"steps\"><li>1 = 4 − 1 × 3<\/li><li>1 = −1 × 11 + (3) × 4<\/li><li>1 = 3 × 15 − (4) × 11<\/li><li>1 = −4 × 26 + (7) × 15<\/li><\/ol><p>So 15 × (7) ≡ 1 ⇒ inverse = 7 mod 26 = 7. Check: 15×7 = 105 ≡ 1 (mod 26) ✓<\/p><\/li><li><b>47<sup>−1<\/sup> mod 64 = 15<\/b><ol class=\"steps\"><li>64 = 1 × 47 + 17<\/li><li>47 = 2 × 17 + 13<\/li><li>17 = 1 × 13 + 4<\/li><li>13 = 3 × 4 + 1<\/li><li>4 = 4 × 1 + 0<\/li><\/ol><p>Back-substitute:<\/p><ol class=\"steps\"><li>1 = 13 − 3 × 4<\/li><li>1 = −3 × 17 + (4) × 13<\/li><li>1 = 4 × 47 − (11) × 17<\/li><li>1 = −11 × 64 + (15) × 47<\/li><\/ol><p>So 47 × (15) ≡ 1 ⇒ inverse = 15 mod 64 = 15. Check: 47×15 = 705 ≡ 1 (mod 64) ✓<\/p><\/li><\/ol>", "k": "calc", "d": null, "id": 52}, {"t": "nt", "src": ["T1C Q2(c)"], "m": 2, "q": "Determine whether 2 is a primitive root mod 5.", "a": "<div class=\"ans\"><b>Answer:<\/b> Yes, 2 is a primitive root mod 5.<\/div><ol class=\"steps\"><li>A primitive root mod p generates every non-zero residue: its order must be φ(5) = 4.<\/li><li>Powers of 2 mod 5:<div class=\"tw\"><table class=\"wt\"><thead><tr><th>k<\/th><th>1<\/th><th>2<\/th><th>3<\/th><th>4<\/th><\/tr><\/thead><tbody><tr><td>2<sup>k<\/sup> mod 5<\/td><td>2<\/td><td>4<\/td><td>3<\/td><td>1<\/td><\/tr><\/tbody><\/table><\/div><\/li><li>We get {2, 4, 3, 1} = all of {1,2,3,4}, and the first time we hit 1 is at k = 4 = p − 1 ⇒ primitive root ✓<\/li><\/ol>", "k"

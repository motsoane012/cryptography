n later with a password.<\/li><li>ii. <b>Mutual:<\/b> mutual TLS (client and server certificates, e.g. IPsec/VPN or banking APIs), or Kerberos (message 6 authenticates the server back to the client).<\/li><li>iii. Both sides prove their identity, so neither a fake server (phishing/MITM) nor a fake client can impersonate — required where both ends must be trusted (banking, military, admin access).<\/li><\/ol>", "k": "theory", "d": "sigconf", "id": 159}, {"t": "hash", "src": ["EX25 Q6(c)(d)(e)"], "m": 10, "q": "c) Consider a hash function that is used for password storage. Should it meet both preimage resistance and collision resistance properties? Explain. [4]<br>d) Explain the difference between SHA-1 and SHA-256 in terms of security and collision resistance. [3]<br>e) Given a hash function h(x) = x<sup>3<\/sup> + x + 1 (mod 29), explain why it is unsuitable for security applications. [3]", "a": "<div class=\"ans\"><b>Answer:<\/b> c) Preimage (and second-preimage) resistance is essential; full collision resistance is less critical but desirable. d) SHA-1: 160-bit, collisions found — broken; SHA-256: 256-bit, ~2<sup>128<\/sup> collision security. e) Only 29 outputs, trivial collisions and preimages.<\/div><h4>c)<\/h4><ol class=\"steps\"><li><b>Preimage resistance is essential:<\/b> if the password file is stolen, the attacker must not be able to reverse a stored hash to get the password.<\/li><li><b>Second-preimage resistance<\/b> matters too: the attacker must not find a <i>different<\/i> password that hashes to the stored value (it would log in just as well).<\/li><li><b>Collision resistance<\/b> (any two inputs with same hash) is less critical — the attacker targets a fixed stored hash, not any pair — but a good hash should have it anyway. Use a slow, salted hash (bcrypt/Argon2).<\/li><\/ol><h4>d)<\/h4><div class=\"tw\"><table class=\"wt\"><thead><tr><th><\/th><th>SHA-1<\/th><th>SHA-256<\/th><\/tr><\/thead><tbody><tr><td>Digest size<\/td><td>160 bits<\/td><td>256 bits<\/td><\/tr><tr><td>Ideal collision security (birthday)<\/td><td>2<sup>80<\/sup><\/td><td>2<sup>128<\/sup><\/td><\/tr><tr><td>Status<\/td><td>Broken: practical collision found (SHAttered, 2017, ~2<sup>63<\/sup> work); deprecated for certificates/signatures<\/td><td>No practical attacks; current standard (SHA-2 family)<\/td><\/tr><\/tbody><\/table><\/div><h4>e)<\/h4><ol class=\"steps\"><li>Output is only 0–28 (≈ 5 bits) ⇒ collisions after a handful of inputs; e.g. h(0) = h(12) = h(17) = 1 and h(1) = h(7) = h(21) = 3.<\/li><li>Also h(x) = h(x + 29) for every x (periodic), so infinitely many collisions.<\/li><li>Preimage: just try the 29 residues to find x — no one-way property; the polynomial is simple algebra with no avalanche effect.<\/li><\/ol>", "k": "calc", "d": null, "id": 160}, {"t": "hash", "src": ["SUP26 Q6"], "m": 20, "q": "a) Explain one-way function, trapdoor function, and collision resistance. [6]<br>b) Assess whether a simple checksum provides preimage resistance, second-preimage resistance and collision resistance. [6]<br>c) What is salt in password hashing? Should each user have a unique salt? Justify. [4]<br>d) Compare SHA-1 and SHA-256 from a security perspective. [4]", "a": "<div class=\"ans\"><b>Answer:<\/b> a) One-way: easy forward, infeasible backward; trapdoor: one-way unless you know a secret; collision resistance: can't find two inputs with same output. b) A checksum gives none of them. c) Random per-user value hashed with the password; yes, unique.<\/div><h4>a)<\/h4><ol class=\"steps\"><li><b>One-way function:<\/b> y = f(x) is easy to compute, but given y it's infeasible to find x (e.g. hash functions, g<sup>x<\/sup> mod p).<\/li><li><b>Trapdoor function:<\/b> a one-way function that becomes easy to invert if you know secret 'trapdoor' information (e.g. RSA: m<sup>e<\/sup> mod n is hard to invert unless you know d / the factors of n). Basis of public-key encryption.<\/li><li><b>Collision resistance:<\/b> infeasible to find any two different inputs x ≠ y with H(x) = H(y).<\/li><\/ol><h4>b)<\/h4><ol class=\"steps\"><li>Simple checksum, e.g. XOR (or sum) of all blocks.<\/li><li><b>Preimage:<\/b> NO — given target h, take any message M and append one block B = h ⊕ checksum(M); new checksum = h.<\/li><li><b>Second preimage:<\/b> NO — swap two blocks, or flip the same bit in two blocks ⇒ same checksum.<\/li><li><b>Collision:<\/b> NO — trivially many (e.g. 0001‖0010 and 0011‖0000 both give 0011).<\/li><li>Checksums only detect accidental errors, not deliberate changes.<\/li><\/ol><h4>c)<\/h4><ol class=\"steps\"><li><b>Salt:<\/b> a random value generated for each user, combined with the password before hashing; the system stores (salt, H(salt ‖ password)).<\/li><li>Yes, <b>unique per user<\/b>: then two users with the same password get different hashes, and precomputed rainbow/dictionary tables are useless — the attacker must attack each user's hash separately.<\/li><li>A shared (global) salt only forces one new table for the whole database.<\/li><\/ol><h4>d)<\/h4><p>SHA-1 has a 160-bit output (2<sup>80<\/sup> birthday bound) and practical collisions have been demonstrated (2017) — deprecated. SHA-256 has a 256-bit output (2<sup>128<\/sup> collision security) with no known practical attacks — recommended.<\/p>", "k": "theory", "d": null, "id": 161}, {"t": "hash", "src": ["T2B Q3(a)(b)(c)"], "m": 14, "q": "a) Explain why hashing alone does not guarantee message authenticity. Also, explain the importance of hashing before signing a message. [2,2]<br>b) Consider a 4-bit checksum. Determine whether it would suffice as a cryptographic algorithm against the properties of one way function, preimage resistance, and second preimage resistance. Give examples where possible. [6]<br>c) What is salt in password hashing? Should each user's salt be unique? Explain. [2,2]", "a": "<div class=\"ans\"><b>Answer:<\/b> a) Anyone can recompute a hash for a changed message — no key involved. b) No: a 4-bit checksum fails all three. c) Random per-user value added before hashing; yes, unique.<\/div><h4>a)<\/h4><ol class=\"steps\"><li>A plain hash uses no secret: an attacker can modify M and simply recompute H(M′) and send both — the receiver's check still passes. Authenticity needs a key (MAC/HMAC) or a signature (E<sub>PR<\/sub>(H(M))).<\/li><li>Hashing before signing: signing a short digest is much faster than signing a long message, and it blocks RSA's algebraic forgeries; the signature still covers the whole message.<\/li><\/ol><h4>b) 4-bit checksum = XOR of all 4-bit blocks<\/h4><ol class=\"steps\"><li><b>One-way:<\/b> No — only 16 possible outputs; given any checksum value you can immediately build an input with it.<\/li><li><b>Preimage resistance:<\/b> No — target 1011? The single block 1011 works, or M = 0101 ‖ 1110 (0101 ⊕ 1110 = 1011).<\/li><li><b>Second-preimage resistance:<\/b> No — given M = 0001 0010 (checksum 0011), M′ = 0010 0001 (swap blocks) or 0011 0000 gives the same 0011.<\/li><li>Also with only 2<sup>4<\/sup> outputs, random messages collide after ~4 tries (birthday). ⇒ Not suitable as a cryptographic hash.<\/li><\/ol><h4>c)<\/h4><p>Salt = random value stored with each user's record and hashed together with the password. Each user's salt should be unique so identical passwords give different hashes and precomputed (rainbow) tables cannot be reused across users.<\/p>", "k": "calc", "d": null, "id": 162}, {"t": "hash", "src": ["PX Q3(b)"], "m": 10, "q": "Hashing is one of the mechanisms used to offer password protection.<br>i. A newbie believes it is possible to use any function of their liking for hashing. They consider using either the function that performs an XOR of the bits in the input message to generate an output or the function h(m) = (2m<sup>5<\/sup> − 32m) mod 17. Explain why both functions are bad. [7]<br>ii. Suppose Malefane managed to steal a system file with user names and hashed passwords. Would this give Malefane access to user accounts on the system, if they also happened to know the hash function used for the passwords? [3]", "a": "<div class=\"ans\"><b>Answer:<\/b> i. XOR → 1-bit output, trivial preimages/collisions; h(m) → only 17 outputs, h(0)=h(2)=h(8)=h(9)=h(15)=0, periodic. ii. Not directly — he'd still need to reverse the hashes, but weak/unsalted passwords can be cracked offline.<\/div><h4>i. XOR of all bits<\/h4><ol class=\"steps\"><li>Output is a single bit (the parity): only 2 possible hashes ⇒ half of all messages collide.<\/li><li>Preimage is trivial: for output 1 send '1', for 0 send '0'. Second preimage: flip any two bits.<\/li><li>Not one-way, no collision resistance, no avalanche.<\/li><\/ol><h4>i. h(m) = (2m<sup>5<\/sup> − 32m) mod 17<\/h4><ol class=\"steps\"><li>Only 17 possible outputs ⇒ collisions after ~5 messages.<\/li><li>Factorises: 2m<sup>5<\/sup> − 32m = 2m(m<sup>4<\/sup> − 16) = 2m(m − 2)(m + 2)(m<sup>2<\/sup> + 4), so h(m) = 0 for m = 0, 2, 15 (≡ −2), and 8, 9 (since 8² = 64 ≡ 13 ≡ −4). Five different inputs, same hash!<\/li><li>Also h(m + 17) = h(m) for all m (periodic), and by Fermat m<sup>17<\/sup> ≡ m — the structure is pure algebra, easy to invert by trying 17 values.<\/li><li>Lesson: don't invent hash functions; use vetted ones (SHA-256, or bcrypt/Argon2 for passwords).<\/li><\/ol><h4>ii.<\/h4><ol class=\"steps\"><li>Not immediately: the file holds H(password), and logging in requires the password itself. A good hash is preimage-resistant, so he can't reverse it.<\/li><li>But knowing H he can run an <b>offline dictionary / brute-force attack<\/b>: hash candidate passwords and compare. Weak passwords will be found, especially if the hashes are unsalted (rainbow tables).<\/li><li>So: strong passwords + per-user salts + a slow hash make the stolen file nearly useless; weak passwords make it dangerous.<\/li><\/ol>", "k": "calc", "d": null, "id": 163}, {"t": "hash", "src": ["EXAB Q3"], "m": 15, "q": "A newbie has observed that XOR seems to be used a lot by cryptographers.<br>a) Briefly explain how encryption and hashing differ. [3]<br>b) Give two conditions that need to be satisfied to make XOR encryption highly secure. [3]<br>c) Explain why a hash function that performs an XOR of the bits in the input message is a less than ideal hashing function. [3]<br>d) Show how trivial it is to perform a known-plaintext attack on a simple XOR cipher. [3]<br>e) What would be your response if, after accepting that XOR cannot be used exclusively for encryption and hashing, the newbie announces they will implement their own cryptographic algorithm? [3]", "a": "<div class=\"ans\"><b>Answer:<\/b> b) Key truly random, at least as long as the message, used only once (one-time pad). d) K = P ⊕ C.<\/div><h4>a)<\/h4><div class=\"tw\"><table class=\"wt\"><thead><tr><th>Encryption<\/th><th>Hashing<\/th><\/tr><\/thead><tbody><tr><td>Reversible with the key (two-way)<\/td><td>One-way — cannot be reversed<\/td><\/tr><tr><td>Uses a key<\/td><td>Usually no key<\/td><\/tr><tr><td>Output length ≈ input length<\/td><td>Fixed-size digest<\/td><\/tr><tr><td>Goal: confidentiality<\/td><td>Goal: integrity / fingerprint<\/td><\/tr><\/tbody><\/table><\/div><h4>b)<\/h4><ol class=\"steps\"><li>The key must be <b>truly random<\/b> and <b>at least as long as the message<\/b>.<\/li><li>The key must be <b>used only once<\/b> and kept secret (one-time pad ⇒ unconditional security).<\/li><\/ol><h4>c)<\/h4><p>XOR of all bits gives a 1-bit (or very short) output, so collisions and preimages are trivial: changing any two bits, or reordering blocks, gives the same hash; no avalanche effect.<\/p><h4>d)<\/h4><ol class=\"steps\"><li>XOR cipher: C = P ⊕ K.<\/li><li>Attacker knows one plaintext P and its ciphertext C ⇒ K = P ⊕ C.<\/li><li>Example: P = 1010, C = 0110 ⇒ K = 1010 ⊕ 0110 = 1100. Now any other ciphertext under K is decrypted: P′ = C′ ⊕ 1100.<\/li><li>That's why XOR is only a building block (inside AES, stream ciphers), never a cipher by itself with a reused key.<\/li><\/ol><h4>e)<\/h4><ol class=\"steps\"><li>Discourage it: \"don't roll your own crypto\". Home-made algorithms haven't had years of public cryptanalysis and usually have flaws the designer can't see.<\/li><li>Kerckhoff's principle: security should rest on the key, using public, peer-reviewed standards (AES, SHA-256, RSA).<\/li><li>Encourage them to study/implement standard algorithms for learning, but use vetted libraries in real systems.<\/li><\/ol>", "k": "calc", "d": null, "id": 164}, {"t": "hash", "src": ["EX25 Q1(d)"], "m": 5, "q": "Differentiate between hashing and encryption. Provide one example use-case for each. Show how the two complement each other.", "a": "<div class=\"ans\"><b>Answer:<\/b> Encryption is reversible with a key (confidentiality); hashing is a one-way fixed-size fingerprint (integrity). Together: encrypt for secrecy + hash/MAC for integrity.<\/div><ol class=\"steps\"><li><b>Encryption:<\/b> two-way, needs a key, output size ≈ input; use-case: AES-encrypting files or HTTPS traffic.<\/li><li><b>Hashing:<\/b> one-way, no key, fixed-size output; use-case: storing salted password hashes, or verifying a download with SHA-256.<\/li><li><b>Complement:<\/b> encryption hides content but doesn't detect tampering; hashing detects tampering but doesn't hide content. E.g. TLS encrypts data with AES and protects integrity with HMAC-SHA256; digital signatures hash the message then encrypt the hash with a private key.<\/li><\/ol>", "k": "theory", "d": null, "id": 165}, {"t": "hash", "src": ["E6 B"], "m": null, "q": "a) Explain why the function that XORs bits of the input message to generate an output, h: {0,1}<sup>n<\/sup> → {0,1}, is not preimage resistant.<br>b) Why are these hash functions not ideal? i. h(x) = x<sup>3<\/sup> − 10x<sup>2<\/sup> + 31x − 30 mod 23 &nbsp; ii. h(x) = a<sup>2x<\/sup> (mod p)", "a": "<div class=\"ans\"><b>Answer:<\/b> a) Output is 1 bit — any message with the right parity is a preimage. b) i. factors as (x−2)(x−3)(x−5) ⇒ h(2) = h(3) = h(5) = 0. ii. h(x) = h(x + (p−1)/2), only half the residues are outputs.<\/div><h4>a)<\/h4><p>Given output b ∈ {0, 1}, the 1-bit message 'b' itself (or any message with b ones mod 2) hashes to b — found instantly. So it's not one-way.<\/p><h4>b) i.<\/h4><ol class=\"steps\"><li>x<sup>3<\/sup> − 10x<sup>2<\/sup> + 31x − 30 = (x − 2)(x − 3)(x − 5).<\/li><li>So h(2) = h(3) = h(5) = 0 — an immediate collision; only 23 outputs; h(x) = h(x + 23).<\/li><li>Preimages: try the 23 residues (or solve the cubic).<\/li><\/ol><h4>b) ii.<\/h4><ol class=\"steps\"><li>a<sup>p−1<\/sup> ≡ 1 (Fermat), so a<sup>2x<\/sup> = a<sup>2(x + (p−1)/2)<\/sup> ⇒ h(x) = h(x + (p − 1)/2): easy collisions.<\/li><li>Outputs are only squares (quadratic residues) ⇒ at most (p − 1)/2 values; and h(x + y) = h(x)h(y) — algebraic structure an attacker can exploit; slow too.<\/li><\/ol>", "k": "calc", "d": null, "id": 166}, {"t": "hash", "src": ["EX24 Q5(a)"], "m": 7, "q": "Let M be an email that Alice wants to send to Bob, {PU<sub>B<\/sub>, PR<sub>B<\/sub>} be Bob's key pair and {PU<sub>A<\/sub>, PR<sub>A<\/sub>} Alice's key pair. Show the messages that will be sent by Alice (in the form E<sub>PUB<\/sub>(M) ‖ E<sub>PRA<\/sub>(M)) which offer:<br>i. Authentication [3]<br>ii. Confidentiality and data integrity [2]<br>iii. Suppose Alice and Bob wanted to have mutual authentication over email service, in real time; explain how this could be achieved. [2]", "a": "<div class=\"ans\"><b>Answer:<\/b> i. M ‖ E<sub>PRA<\/sub>(H(M)) &nbsp; ii. E<sub>PUB<\/sub>(M ‖ E<sub>PRA<\/sub>(H(M))) (or E<sub>PUB<\/sub>(M) ‖ E<sub>PRA<\/sub>(H(M)))<\/div><ol class=\"steps\"><li><b>i. Authentication:<\/b> Alice sends <b>M ‖ E<sub>PRA<\/sub>(H(M))<\/b>. Bob decrypts the signed hash with PU<sub>A<\/sub> and compares with his own H(M): only Alice's private key could have made it ⇒ origin authenticated (and non-repudiation). Sending E<sub>PRA<\/sub>(M) alone also authenticates but is slow for long M.<\/li><li><b>ii. Confidentiality + integrity:<\/b> <b>E<sub>PUB<\/sub>(M ‖ E<sub>PRA<\/sub>(H(M)))<\/b> — only Bob can decrypt (confidentiality); the signed hash inside detects any change (integrity, plus authentication). Equivalent acceptable form: E<sub>PUB<\/sub>(M) ‖ E<sub>PRA<\/sub>(H(M)).<\/li><li><b>iii. Real-time mutual authentication:<\/b> email is store-and-forward, so add a live challenge–response with nonces and signatures/public-key encryption: A → B: E<sub>PUB<\/sub>(ID<sub>A<\/sub> ‖ N<sub>A<\/sub>); B → A: E<sub>PUA<\/sub>(N<sub>A<\/sub> ‖ N<sub>B<\/sub>); A → B: E<sub>PUB<\/sub>(N<sub>B<\/sub>). Each side proves it can decrypt with its private key (or both sign timestamped messages and check freshness). In practice: S/MIME/PGP certificates plus a quick reply/acknowledgement exchange.<\/li><\/ol>", "k": "theory", "d": "sigconf", "id": 167}, {"t": "keys", "src": ["T2A Q1(c)"], "m": 2, "q": "Discuss two potential security issues that may arise due to the public key directory based system.", "a": "<div class=\"ans\"><b>Answer:<\/b> The directory can be tampered with (forged keys inserted), and it's a single point of failure/bottleneck.<\/div><ol class=\"steps\"><li><b>Tampering / impersonation:<\/b> if an attacker compromises the directory (or the authority's private key) they can substitute their own public key for a user's and read messages meant for that user.<\/li><li><b>Availability / bottleneck:<\/b> everyone depends on the directory being online — a DoS on it stops all secure communication; heavy load slows it down. (Also: keys may be stale if users don't update them.)<\/li><\/ol>", "k": "theory", "d": null, "id": 168}, {"t": "keys", "src": ["T2A Q1(d)"], "m": 5, "q": "Consider Figure 1 (Certificate Authority key distribution: (1) PU<sub>A<\/sub>, (2) C<sub>A<\/sub> = E(PR<sub>auth<\/sub>, [Time<sub>1<\/sub> ‖ ID<sub>A<\/sub> ‖ PU<sub>A<\/sub>]), (3) PU<sub>B<\/sub>, (4) C<sub>B<\/sub> = E(PR<sub>auth<\/sub>, [Time<sub>2<\/sub> ‖ ID<sub>B<\/sub> ‖ PU<sub>B<\/sub>]), (5) C<sub>A<\/sub>, (6) C<sub>B<\/sub>).<br>i. Explain the purpose of messages 1 and 2, including what is the purpose of a CA. Also indicate whether these messages are transferred in a secure medium or not and why. [3]<br>ii. After all steps are complete, explain why B knows it has the public key that belongs to A, and that it has not been forged. Also state any assumptions for this to be true. [2]", "a": "<div class=\"ans\"><b>Answer:<\/b> (1) A registers its public key with the CA; (2) the CA returns A's certificate. B trusts PU<sub>A<\/sub> because only the CA could have signed C<sub>A<\/sub>.<\/div><h4>i.<\/h4><ol class=\"steps\"><li><b>Message 1:<\/b> A gives its public key PU<sub>A<\/sub> to the CA to be certified (registration).<\/li><li><b>Message 2:<\/b> the CA returns the certificate C<sub>A<\/sub>, which binds ID<sub>A<\/sub> to PU<sub>A<\/sub> with a timestamp, signed with the CA's private key PR<sub>auth<\/sub>.<\/li><li><b>CA's purpose:<\/b> a trusted third party that vouches that a public key really belongs to a named user, so keys can be distributed without contacting the CA every time.<\/li><li><b>Medium:<\/b> message 1 must be <i>authenticated<\/i> (e.g. A appears in person or uses a protected channel) so the CA knows the key truly is A's — it doesn't need secrecy (public key). Message 2 can go over an insecure channel: the certificate is signed, so any change is detected.<\/li><\/ol><h4>ii.<\/h4><ol class=\"steps\"><li>B decrypts C<sub>A<\/sub> with the CA's public key PU<sub>auth<\/sub> and gets [Time<sub>1<\/sub> ‖ ID<sub>A<\/sub> ‖ PU<sub>A<\/sub>]. Only the CA holds PR<sub>auth<\/sub>, so only the CA could have made it ⇒ PU<sub>A<\/sub> belongs to ID<sub>A<\/sub>; Time<sub>1<\/sub> shows it's current.<\/li><li><b>Assumptions:<\/b> B has an authentic copy of PU<sub>auth<\/sub>; the CA is trustworthy, verified A's identity, and its private key is not compromised; the certificate hasn't expired or been revoked.<\/li><\/ol>", "k": "theory", "d": "cakd", "id": 169}, {"t": "keys", "src": ["T2B Q3(e)"], "m": 6, "q": "Consider the Certificate Authority Key Distribution Scheme figure.<br>i. Explain the purpose of messages 3 and 4. [1]<br>ii. Explain the significance of encrypting C<sub>B<\/sub> with PR<sub>auth<\/sub>. [2]<br>iii. Should these messages be transferred in a secure medium or not? Explain. [3]", "a": "<div class=\"ans\"><b>Answer:<\/b> 3: B submits PU<sub>B<\/sub> to the CA; 4: CA returns B's signed certificate C<sub>B<\/sub>. Signing with PR<sub>auth<\/sub> makes it unforgeable and verifiable by all.<\/div><ol class=\"steps\"><li><b>i.<\/b> (3) Responder B registers its public key PU<sub>B<\/sub> with the CA; (4) the CA issues B's certificate C<sub>B<\/sub> = E(PR<sub>auth<\/sub>, [Time<sub>2<\/sub> ‖ ID<sub>B<\/sub> ‖ PU<sub>B<\/sub>]).<\/li><li><b>ii.<\/b> Encrypting with the CA's private key is a <b>digital signature<\/b>: anyone with PU<sub>auth<\/sub> can read and verify it, but nobody else can create or alter it ⇒ authenticity + integrity of the binding ID<sub>B<\/sub> ↔ PU<sub>B<\/sub>. (It's not for secrecy.)<\/li><li><b>iii.<\/b> Message 3: needs an <b>authenticated<\/b> channel (CA must be sure the key is really B's, e.g. registration in person) but not a confidential one — a public key isn't secret. Message 4: <b>no secure medium needed<\/b> — the certificate is signed, so tampering is detected and its contents are public anyway.<\/li><\/ol>", "k": "theory", "d": "cakd", "id": 170}, {"t": "keys", "src": ["EX24 Q6(a)"], "m": 5, "q": "Consider the CA key distribution figure.<br>i. How does Responder B verify the authenticity of C<sub>A<\/sub>? [1]<br>ii. Give any two benefits of using a Certificate Authority over a Public Key Authority for public key distribution. [2]<br>iii. Give any two reasons why a digital certificate could be revoked. [2]", "a": "<div class=\"ans\"><b>Answer:<\/b> i. Decrypt/verify C<sub>A<\/sub> with the CA's public key PU<sub>auth<\/sub>.<\/div><ol class=\"steps\"><li><b>i.<\/b> B applies D(PU<sub>auth<\/sub>, C<sub>A<\/sub>) → [Time<sub>1<\/sub> ‖ ID<sub>A<\/sub> ‖ PU<sub>A<\/sub>]; valid if it decrypts properly, the ID is A's and the time/validity is current.<\/li><li><b>ii.<\/b> (1) The CA is not needed online for each exchange — users swap certificates directly, so no bottleneck; (2) no single online point of failure/DoS target, and certificates can be cached and checked offline.<\/li><li><b>iii.<\/b> The user's private key is compromised; the CA's own key is compromised; the user is no longer certified (left the organisation, details changed); the certificate was issued in error/fraudulently.<\/li><\/ol>", "k": "theory", "d": "cakd", "id": 171}, {"t": "keys", "src": ["T2B Q3(d)"], "m": 3, "q": "As a security professional, you are tasked to secure a multi-branch company using symmetric keys. Propose an efficient key distribution model that minimizes key count and administrative effort.", "a": "<div class=\"ans\"><b>Answer:<\/b> A (hierarchical) Key Distribution Center: each entity shares one master key with its KDC, which hands out session keys on demand.<\/div><ol class=\"steps\"><li>Use a <b>Key Distribution Center (KDC)<\/b> — a trusted server — with a hierarchy: each branch runs a local KDC, and local KDCs trust a central/head-office KDC.<\/li><li>Each user/host shares one long-term <b>master key<\/b> with its local KDC (delivered once, physically/securely).<\/li><li>When A wants to talk to B, it asks the KDC; the KDC creates a fresh <b>session key<\/b> and sends it to A and B encrypted under their master keys. Cross-branch requests go via the central KDC.<\/li><li>Key count: with pairwise keys n users need n(n − 1)/2 keys (e.g. 1000 users ⇒ 499,500); with a KDC only n master keys (1000). Session keys are temporary and created on demand ⇒ minimal admin.<\/li><li>Admin effort: adding a user means one new master key, not keys with everybody.<\/li><\/ol>", "k": "theory", "d": "kdc", "id": 172}, {"t": "keys", "src": ["SUP26 Q7(a)(b)"], "m": 11, "q": "a) As a security professional, you are tasked to secure a multi-branch company using symmetric keys. Propose an efficient key distribution model that minimizes key count and administrative effort. How would key count change if key distribution was to be done with asymmetric keys? [3,2]<br>b) Explain the purpose of certificates, why they are digitally signed by a CA, and why certificate exchange can occur over an insecure channel. [6]", "a": "<div class=\"ans\"><b>Answer:<\/b> a) Hierarchical KDC (n master keys); with asymmetric keys each entity needs just one key pair (n pairs) plus a CA — no pairwise secrets. b) Certificates bind identity to public key; the CA signature makes them unforgeable, so they can travel openly.<\/div><h4>a)<\/h4><ol class=\"steps\"><li>Use a <b>Key Distribution Center (KDC)<\/b> — a trusted server — with a hierarchy: each branch runs a local KDC, and local KDCs trust a central/head-office KDC.<\/li><li>Each user/host shares one long-term <b>master key<\/b> with its local KDC (delivered once, physically/securely).<\/li><li>When A wants to talk to B, it asks the KDC; the KDC creates a fresh <b>session key<\/b> and sends it to A and B encrypted under their master keys. Cross-branch requests go via the central KDC.<\/li><li>Key count: with pairwise keys n users need n(n − 1)/2 keys (e.g. 1000 users ⇒ 499,500); with a KDC only n master keys (1000). Session keys are temporary and created on demand ⇒ minimal admin.<\/li><li>Admin effort: adding a user means one new master key, not keys with everybody.<\/li><\/ol><ol class=\"steps cont\"><li><b>Asymmetric:<\/b> each of n users needs only <b>one key pair<\/b> (n public + n private = 2n keys); public keys can be published, and there's nothing to share secretly in advance. Pairwise secret keys (n(n−1)/2) disappear; session keys are agreed with RSA/D-H when needed.<\/li><\/ol><h4>b)<\/h4><ol class=\"steps\"><li><b>Purpose:<\/b> a certificate (X.509) binds a subject's identity to its public key (plus validity period, issuer, serial number, algorithm).<\/li><li><b>Why signed by a CA:<\/b> the CA, a trusted third party, signs the certificate with its private key; anyone holding the CA's public key can verify it, and nobody can forge or alter it without detection.<\/li><li><b>Insecure channel is fine:<\/b> the certificate contains only public information (no secrets need hiding), and its integrity/authenticity is protected by the CA's signature — any tampering breaks the signature.<\/li><\/ol>", "k": "theory", "d": "kdc", "id": 173}, {"t": "keys", "src": ["PY Q3"], "m": 12, "q": "Theoretically, key management can be done using a secret sharing scheme based on the Chinese Remainder Theorem (CRT).<br>a) Key management is regarded as very important in cryptography. Why? [2]<br>b) Briefly explain why CRT could possibly be used to implement a secret sharing scheme. [3]<br>c) Use the CRT to solve: x ≡ 4 (mod 5), x ≡ 6 (mod 8), x ≡ 8 (mod 9). [7]", "a": "<div class=\"ans\"><b>Answer:<\/b> c) x ≡ 134 (mod 360)<\/div><h4>a)<\/h4><p>Strong algorithms are useless if keys are generated, stored, distributed or revoked badly — by Kerckhoff's principle the key is the <i>only<\/i> secret. Most real-world breaks come from key handling (leaked/reused/weak keys), not from the algorithm.<\/p><h4>b)<\/h4><ol class=\"steps\"><li>CRT says a number x is uniquely determined (mod M = m<sub>1<\/sub>m<sub>2<\/sub>…m<sub>k<\/sub>) by its remainders x mod m<sub>i<\/sub> for pairwise-coprime moduli.<\/li><li>So a secret S can be split into shares s<sub>i<\/sub> = S mod m<sub>i<\/sub>, one per person; no single share reveals S.<\/li><li>Only when enough shares are combined (product of moduli &gt; S) can CRT rebuild S — a threshold scheme (Mignotte / Asmuth–Bloom), so no single person holds the whole key.<\/li><\/ol><h4>c)<\/h4><p>M = 5 × 8 × 9 = 360. Moduli are pairwise coprime so CRT applies.<\/p><div class=\"tw\"><table class=\"wt\"><thead><tr><th>m<sub>i<\/sub><\/th><th>a<sub>i<\/sub><\/th><th>M<sub>i<\/sub> = M/m<sub>i<\/sub><\/th><th>M<sub>i<\/sub> mod m<sub>i<\/sub><\/th><th>y<sub>i<\/sub> = M<sub>i<\/sub><sup>−1<\/sup> mod m<sub>i<\/sub><\/th><th>a<sub>i<\/sub>·M<sub>i<\/sub>·y<sub>i<\/sub><\/th><\/tr><\/thead><tbody><tr><td>5<\/td><td>4<\/td><td>72<\/td><td>72 mod 5 = 2<\/td><td>3<\/td><td>864<\/td><\/tr><tr><td>8<\/td><td>6<\/td><td>45<\/td><td>45 mod 8 = 5<\/td><td>5<\/td><td>1350<\/td><\/tr><tr><td>9<\/td><td>8<\/td><td>40<\/td><td>40 mod 9 = 4<\/td><td>7<\/td><td>2240<\/td><\/tr><\/tbody><\/table><\/div><p>x = 864 + 1350 + 2240 = 4454 ≡ <b>134<\/b> (mod 360)<\/p><p>Check: 134 mod 5 = 4, 134 mod 8 = 6, 134 mod 9 = 8 ✓<\/p>", "k": "calc", "d": null, "id": 174}, {"t": "keys", "src": ["EX22 Q7(a)"], "m": 4, "q": "Smart young graduates start a company (Sethalala diCert) that sells digital certificates. Why should digital certificates expire or have a period of validity? Also, provide any two typical contents of a digital certificate.", "a": "<div class=\"ans\"><b>Answer:<\/b> Expiry limits the damage of key compromise and forces re-verification. Contents: subject name & public key, issuer, validity period, serial number, CA signature.<\/div><ol class=\"steps\"><li>The longer a key is used, the more chance it has been stolen or cryptanalysed; expiry bounds that exposure.<\/li><li>Subject details change (staff leave, domains change) and crypto standards get weaker over time (e.g. SHA-1, short RSA keys) — expiry forces renewal with current info/algorithms.<\/li><li>It keeps revocation lists (CRLs) manageable — expired certificates drop off.<\/li><li><b>Contents (X.509):<\/b> version, serial number, signature algorithm, issuer name, validity (not before/after), subject name, subject public key, extensions, the CA's signature.<\/li><\/ol>", "k": "theory", "d": null, "id": 175}, {"t": "keys", "src": ["EX22 Q7(b)(c)"], "m": 14, "q": "b) The owners of Sethalala diCert decide to use MD5 to sign certificates, and to use their own hash function h(x) = a<sup>x<\/sup> (mod p) (a an integer, p prime).<br>i. Briefly explain why the suggested use of MD5 is not a good idea. [2]<br>ii. Why, in general, is it a bad idea to roll their own cryptographic function? Explain why their specific choice is not a good cryptographic function. [6]<br>c) i. One owner claims it is sufficient to back up all their data regularly on another server within their premises. Is this a good idea? [4] ii. Give two other security threats Sethalala diCert must worry about and offer countermeasures. [4]", "a": "<div class=\"ans\"><b>Answer:<\/b> MD5 is broken (practical collisions — rogue CA certificates were forged with it). Home-made crypto is unreviewed; a<sup>x<\/sup> mod p has trivial collisions. On-site-only backups are not enough.<\/div><h4>b) i.<\/h4><p>MD5 has practical collision attacks (2004+). In 2008 researchers used MD5 collisions to create a rogue CA certificate — an attacker could get a harmless certificate signed and transfer the signature to a malicious one. Use SHA-256 or better.<\/p><h4>b) ii.<\/h4><ol class=\"steps\"><li>Rolling your own: no expert peer review, subtle flaws undetected, no standards compliance — and a CA's whole business is trust.<\/li><li>h(x) = a<sup>x<\/sup> mod p: by Fermat a<sup>p−1<\/sup> ≡ 1, so h(x) = h(x + (p − 1)) — endless collisions.<\/li><li>Output has at most p − 1 values and is only as long as p; if a isn't a primitive root, even fewer.<\/li><li>Algebraic structure: h(x + y) = h(x)·h(y) — lets an attacker combine hashes to forge new ones.<\/li><li>Slow (modular exponentiation) compared with real hash functions.<\/li><\/ol><h4>c) i.<\/h4><ol class=\"steps\"><li>Not sufficient. A fire, flood, theft or power surge on the premises destroys both copies.<\/li><li>Ransomware/malware on the network can encrypt or delete the connected backup server too.<\/li><li>Better: 3-2-1 rule — 3 copies, 2 media, 1 off-site (and one offline/immutable); encrypt backups; test restores regularly.<\/li><\/ol><h4>c) ii.<\/h4><ol class=\"steps\"><li><b>CA private-key compromise<\/b> → keep it in a Hardware Security Module, offline root CA, strict access control.<\/li><li><b>Phishing / social engineering of staff<\/b> (issuing certs to imposters) → staff training, strict identity verification procedures, MFA.<\/li><li><b>DDoS on the website/OCSP service<\/b> → redundancy, CDN/DDoS protection, firewalls and IDS/IPS.<\/li><\/ol>", "k": "theory", "d": null, "id": 176}, {"t": "auth", "src": ["T3A Q2(a)"], "m": 15, "q": "Consider the dialogue between the Client and TGS in Kerberos 4:<br>(3) C → TGS: ID<sub>v<\/sub> ‖ Ticket<sub>tgs<\/sub> ‖ Authenticator<sub>c<\/sub><br>(4) TGS → C: E(K<sub>c,tgs<\/sub>, [K<sub>c,v<\/sub> ‖ ID<sub>v<\/sub> ‖ TS<sub>4<\/sub> ‖ Ticket<sub>v<\/sub>])<br>Ticket<sub>tgs<\/sub> = E(K<sub>tgs<\/sub>, [K<sub>c,tgs<\/sub> ‖ ID<sub>C<\/sub> ‖ AD<sub>C<\/sub> ‖ ID<sub>tgs<\/sub> ‖ TS<sub>2<\/sub> ‖ Lifetime<sub>2<\/sub>])<br>Ticket<sub>v<\/sub> = E(K<sub>v<\/sub>, [K<sub>c,v<\/sub> ‖ ID<sub>C<\/sub> ‖ AD<sub>C<\/sub> ‖ ID<sub>v<\/sub> ‖ TS<sub>4<\/sub> ‖ Lifetime<sub>4<\/sub>])<br>Authenticator<sub>c<\/sub> = E(K<sub>c,tgs<\/sub>, [ID<sub>C<\/sub> ‖ AD<sub>C<\/sub> ‖ TS<sub>3<\/sub>])<br>i. List and explain all the keys in the dialogue. State whether they are session or master keys. [4]<br>ii. Is it possible for the Client to access Ticket<sub>v<\/sub>? Explain. [2]<br>iii. Explain the roles of Authenticator<sub>c<\/sub> and Lifetime<sub>2<\/sub>. [4]<br>iv. What are the potential security risks associated with Kerberos and how could the risks be mitigated? [3]<br>v. Is there a need for the Client to have multiple Ticket<sub>v<\/sub>? Explain. [2]", "a": "<div class=\"ans\"><b>Answer:<\/b> Keys: K<sub>tgs<\/sub>, K<sub>v<\/sub> (master); K<sub>c,tgs<\/sub>, K<sub>c,v<\/sub> (session). The client cannot read Ticket<sub>v<\/sub>. Yes, one Ticket<sub>v<\/sub> per server.<\/div><h4>i.<\/h4><div class=\"tw\"><table class=\"wt\"><thead><tr><th>Key<\/th><th>Shared by<\/th><th>Type<\/th><th>Role<\/th><\/tr><\/thead><tbody><tr><td>K<sub>tgs<\/sub><\/td><td>AS and TGS<\/td><td>Master (long-term)<\/td><td>Encrypts Ticket<sub>tgs<\/sub> so only the TGS can read it<\/td><\/tr><tr><td>K<sub>v<\/sub><\/td><td>TGS and server V<\/td><td>Master (long-term)<\/td><td>Encrypts Ticket<sub>v<\/sub> so only V can read it<\/td><\/tr><tr><td>K<sub>c,tgs<\/sub><\/td><td>Client and TGS (made by AS)<\/td><td>Session<\/td><td>Encrypts Authenticator<sub>c<\/sub> and message (4)<\/td><\/tr><tr><td>K<sub>c,v<\/sub><\/td><td>Client and V (made by TGS)<\/td><td>Session<\/td><td>Used by C and V for the service session (authenticator in msg 5, reply 6)<\/td><\/tr><\/tbody><\/table><\/div><h4>ii.<\/h4><p>No. Ticket<sub>v<\/sub> is encrypted with K<sub>v<\/sub>, which only the TGS and V know. The client just stores it and forwards it to V. (It can read the outer message (4) because that uses K<sub>c,tgs<\/sub>, so it learns K<sub>c,v<\/sub>.)<\/p><h4>iii.<\/h4><ol class=\"steps\"><li><b>Authenticator<sub>c<\/sub>:<\/b> proves the person presenting Ticket<sub>tgs<\/sub> is the real client — only someone who knows K<sub>c,tgs<\/sub> could make it, and its fresh timestamp TS<sub>3<\/sub> (used once, short-lived) means a stolen ticket can't simply be replayed.<\/li><li><b>Lifetime<sub>2<\/sub>:<\/b> how long Ticket<sub>tgs<\/sub> is valid (e.g. 8 hours). The client can reuse it without re-typing the password, but an intercepted ticket only has a limited window of use.<\/li><\/ol><h4>iv.<\/h4><ol class=\"steps\"><li><b>Replay<\/b> within the lifetime/clock-skew window → short lifetimes, servers keep a replay cache of recent authenticators.<\/li><li><b>Password guessing<\/b>: the AS reply is encrypted with a key derived from the password, so offline dictionary attacks work on weak passwords → strong password policy, pre-authentication.<\/li><li><b>Clock synchronisation dependence<\/b> → secure time sync (NTP).<\/li><li><b>KDC is a single point of failure / high-value target<\/b> → replicate KDCs, harden and physically protect them.<\/li><\/ol><h4>v.<\/h4><p>Yes. A Ticket<sub>v<\/sub> is valid for <b>one specific server V<\/b> (it contains ID<sub>v<\/sub> and is encrypted under that server's K<sub>v<\/sub>). To use a print server, a file server and a mail server the client needs a separate service-granting ticket for each — obtained from the TGS without retyping the password. It also needs a new one after Lifetime<sub>4<\/sub> expires.<\/p>", "k": "theory", "d": "kerberos", "id": 177}, {"t": "auth", "src": ["T3A Q2(b)"], "m": 5, "q": "The Needham–Schroeder Public Key Authentication Protocol (NSPK):<br>1. A → S: A, B<br>2. S → A: {PU<sub>B<\/sub>, B}<sub>PRS<\/sub><br>3. A → B: {N<sub>A<\/sub>, A}<sub>PUB<\/sub><br>4. B → S: B, A<br>5. S → B: {PU<sub>A<\/sub>, A}<sub>PRS<\/sub><br>6. B → A: {N<sub>A<\/sub>, N<sub>B<\/sub>}<sub>PUA<\/sub><br>7. A → B: {N<sub>B<\/sub>}<sub>PUB<\/sub><br>Briefly explain the messages exchanged, state the assumptions and explain whether mutual or one-way authentication is offered.", "a": "<div class=\"ans\"><b>Answer:<\/b> Messages 1–2 and 4–5 fetch certified public keys from S; 3, 6, 7 are a nonce challenge–response. It aims at <b>mutual<\/b> authentication.<\/div><ol class=\"steps\"><li><b>1–2:<\/b> A asks the server S for B's public key; S replies with PU<sub>B<\/sub> and B's name signed with S's private key (a certificate).<\/li><li><b>3:<\/b> A sends a fresh nonce N<sub>A<\/sub> and its identity, encrypted with PU<sub>B<\/sub> (only B can read it).<\/li><li><b>4–5:<\/b> B fetches A's public key from S the same way.<\/li><li><b>6:<\/b> B returns N<sub>A<\/sub> (proving it decrypted message 3 ⇒ it is B) plus its own nonce N<sub>B<\/sub>, encrypted with PU<sub>A<\/sub>.<\/li><li><b>7:<\/b> A returns N<sub>B<\/sub> under PU<sub>B<\/sub>, proving it could decrypt message 6 ⇒ it is A.<\/li><li><b>Assumptions:<\/b> everyone has S's authentic public key PU<sub>S<\/sub>; S is trusted; private keys are secret; nonces are random and never reused.<\/li><li><b>Result:<\/b> <b>mutual<\/b> authentication — each side proves knowledge of its private key by returning the other's nonce.<\/li><li><i>Extra marks:<\/i> Lowe (1995) showed a man-in-the-middle attack: message 6 doesn't name B, so an intruder can relay a session. Fix (NSL): send {N<sub>A<\/sub>, N<sub>B<\/sub>, B}<sub>PUA<\/sub> in step 6.<\/li><\/ol>", "k": "theory", "d": "nspk", "id": 178}, {"t": "auth", "src": ["EX24 Q7(a)(b)"], "m": 10, "q": "a) One of the possible attacks in network security is a replay attack. Differentiate between a normal replay and a suppress replay attack. [3]<br>b) Consider the Kerberos 4 dialogue between a Client and Server V:<br>(5) C → V: Ticket<sub>v<\/sub> ‖ Authenticator<sub>c<\/sub><br>(6) V → C: E(K<sub>c,v<\/sub>, [TS<sub>5<\/sub> + 1])<br>i. Show the contents of Authenticator<sub>c<\/sub>. [2]<br>ii. Explain the role of message (6). [2]<br>iii. Give any three potential security risks associated with Kerberos. [3]", "a": "<div class=\"ans\"><b>Answer:<\/b> b) i. Authenticator<sub>c<\/sub> = E(K<sub>c,v<\/sub>, [ID<sub>C<\/sub> ‖ AD<sub>C<\/sub> ‖ TS<sub>5<\/sub>]) ii. V proves its identity to C (mutual authentication).<\/div><h4>a)<\/h4><ol class=\"steps\"><li><b>Normal replay:<\/b> the attacker copies a valid message and simply sends it again later (or to another party) to repeat its effect, e.g. replaying an authentication message.<\/li><li><b>Suppress-replay:<\/b> exploits clock differences — when the sender's clock is ahead of the receiver's, the attacker <i>intercepts and suppresses<\/i> the message so it never arrives, then replays it later when its timestamp has become valid at the receiver. Timestamps alone can't detect it; needs synchronised clocks or nonces.<\/li><\/ol><h4>b)<\/h4><ol class=\"steps\"><li><b>i.<\/b> Authenticator<sub>c<\/sub> = E(K<sub>c,v<\/sub>, [ID<sub>C<\/sub> ‖ AD<sub>C<\/sub> ‖ TS<sub>5<\/sub>]) — client ID, network address, and a fresh timestamp, encrypted with the session key from Ticket<sub>v<\/sub>.<\/li><li><b>ii.<\/b> Message (6) authenticates the <b>server to the client<\/b>: only the real V could decrypt Ticket<sub>v<\/sub> to get K<sub>c,v<\/sub>, read TS<sub>5<\/sub> and return TS<sub>5<\/sub> + 1. The +1 shows it's a fresh reply, not a replay of the client's own message ⇒ mutual authentication.<\/li><li><b>iii.<\/b> Replay attacks within the allowed clock skew/lifetime; offline password-guessing on the AS reply; dependence on synchronised clocks; KDC as single point of failure/compromise (holds all master keys); stolen tickets usable until expiry.<\/li><\/ol>", "k": "theory", "d": "kerberos", "id": 179}, {"t": "auth", "src": ["EX25 Q5", "SUP26 Q5"], "m": 20, "q": "a) Differentiate between knowledge-based, possession-based, and inherence-based authentication factors, giving one possible vulnerability for each type. [6]<br>b) Kerberos involves three two-message exchanges: client↔KDC (AS), client↔TGS, and client↔server S.<br>i. Give the role of the three Kerberos master keys and explain how they are distributed: client–KDC key [3], TGS key [3], server key [2].<br>ii. Kerberos tickets contain timestamps and lifetime fields. Explain how these fields jointly prevent replay attacks. [2]<br>iii. An alternative to timestamps could be the use of nonces. Would this work in Kerberos? Explain. [2]<br>iv. Suppose an attacker captures the communication between client and TGS (including the TGT and Authenticator). Explain why the attacker cannot use the captured messages to access server S. [2]", "a": "<div class=\"ans\"><b>Answer:<\/b> Something you know / have / are. Master keys: K<sub>c<\/sub> (password-derived), K<sub>tgs<\/sub> (AS↔TGS), K<sub>v<\/sub> (TGS↔server). Captured TGT is useless without the session key K<sub>c,tgs<\/sub>.<\/div><h4>a)<\/h4><div class=\"tw\"><table class=\"wt\"><thead><tr><th>Factor<\/th><th>Meaning / example<\/th><th>Vulnerability<\/th><\/tr><\/thead><tbody><tr><td>Knowledge<\/td><td>Something you <b>know<\/b>: password, PIN, security question<\/td><td>Guessing, dictionary/brute force, phishing, shoulder-surfing<\/td><\/tr><tr><td>Possession<\/td><td>Something you <b>have<\/b>: phone OTP, smart card, token<\/td><td>Theft/loss, SIM-swap, cloning the card<\/td><\/tr><tr><td>Inherence<\/td><td>Something you <b>are<\/b>: fingerprint, face, iris<\/td><td>Spoofing (fake fingerprint/photo); can't be changed if leaked; false accepts<\/td><\/tr><\/tbody><\/table><\/div><h4>b) i.<\/h4><div class=\"tw\"><table class=\"wt\"><thead><tr><th>Master key<\/th><th>Role<\/th><th>How it's distributed<\/th><\/tr><\/thead><tbody><tr><td>Client–KDC key (K<sub>c<\/sub>)<\/td><td>Authenticates the user to the AS; encrypts the AS reply containing K<sub>c,tgs<\/sub> and Ticket<sub>tgs<\/sub>.<\/td><td>Derived from the user's password (hash); stored in the KDC database at registration — the user just 'knows' it via the password, never sent over the network.<\/td><\/tr><tr><td>TGS key (K<sub>tgs<\/sub>)<\/td><td>Encrypts Ticket<sub>tgs<\/sub>, so the TGS trusts tickets issued by the AS.<\/td><td>Shared only between AS and TGS — both are parts of the KDC, configured by the administrator.<\/td><\/tr><tr><td>Server key (K<sub>v<\/sub>)<\/td><td>Encrypts Ticket<sub>v<\/sub>, so server V trusts tickets from the TGS.<\/td><td>Set up by the administrator when the server is registered (stored in the KDC and in the server's keytab).<\/td><\/tr><\/tbody><\/table><\/div><h4>b) ii.<\/h4><p>A ticket is only accepted between its timestamp and timestamp + lifetime, and each authenticator carries a fresh timestamp that must be within a few minutes of the server's clock. So a captured ticket expires, and an old authenticator is rejected as stale (servers also cache recent ones to stop instant replays).<\/p><h4>b) iii.<\/h4><p>Partly. Nonces prevent replay but need the server to send a fresh challenge first (an extra round trip) and keep state — Kerberos's one-shot ticket + authenticator design relies on timestamps. Kerberos v5 does use nonces in the AS/TGS requests to match replies, but authenticators to servers still use timestamps.<\/p><h4>b) iv.<\/h4><ol class=\"steps\"><li>The TGT is encrypted with K<sub>tgs<\/sub> and the TGS reply (with K<sub>c,v<\/sub> and Ticket<sub>v<\/sub>) is encrypted with the session key K<sub>c,tgs<\/sub> — which the attacker doesn't have (it was sent to the client under the password-derived key).<\/li><li>Without K<sub>c,tgs<\/sub> the attacker can't make a new valid authenticator, and replaying the captured one fails (timestamp/replay cache).<\/li><li>Even if replayed, the TGS reply goes back encrypted under K<sub>c,tgs<\/sub>, so the attacker can't extract K<sub>c,v<\/sub> to build Authenticator for S.<\/li><\/ol>", "k": "theory", "d": "kerberos", "id": 180}, {"t": "auth", "src": ["PX Q3(a)"], "m": 6, "q": "Kerberos is a protocol designed to protect user credentials from attackers by keeping passwords away from insecure networks. Briefly explain how Kerberos works.", "a": "<div class=\"ans\"><b>Answer:<\/b> A trusted third party (KDC = AS + TGS) issues encrypted tickets, so the client proves its identity to services without sending its password.<\/div><ol class=\"steps\"><li><b>AS exchange:<\/b> C → AS: ID<sub>C<\/sub>, ID<sub>tgs<\/sub>, TS. AS replies with K<sub>c,tgs<\/sub> and a ticket-granting ticket (TGT), encrypted with a key derived from the user's password — the password itself never crosses the network.<\/li><li><b>TGS exchange:<\/b> C → TGS: TGT + authenticator + ID<sub>V<\/sub>. TGS returns a service ticket Ticket<sub>v<\/sub> and session key K<sub>c,v<\/sub>.<\/li><li><b>Client/Server exchange:<\/b> C → V: Ticket<sub>v<\/sub> + authenticator; V optionally replies with TS + 1 (mutual authentication).<\/li><li>Single sign-on: the password is typed once per login session; tickets with lifetimes and timestamps handle the rest.<\/li><\/ol>", "k": "theory", "d": "kerberos", "id": 181}, {"t": "auth", "src": ["PX Q3(c)"], "m": 4, "q": "Mpho argues that it is not necessary to carry out password user education once an organisation has a password management policy. To what extent do you agree with Mpho?", "a": "<div class=\"ans\"><b>Answer:<\/b> Disagree largely — a policy only works if users understand and follow it.<\/div><ol class=\"steps\"><li>A policy sets rules (length, complexity, expiry, lockout) and some can be enforced technically — that part is true.<\/li><li>But users still reuse passwords across sites, write them down, share them, or fall for phishing/social engineering — no policy can technically stop that.<\/li><li>Education explains <i>why<\/i> the rules exist (better compliance, fewer workarounds like 'Password1!'), teaches passphrases, password managers and how to spot phishing.<\/li><li>So both are needed: policy + ongoing awareness training.<\/li><\/ol>", "k": "theory", "d": null, "id": 182}, {"t": "auth", "src": ["EX22 Q3"], "m": 10, "q": "Passwords can be used as effective access control mechanisms.<br>a) What are strong passwords? Advise a novice user on what to consider to generate a strong password. [2]<br>b) Some VPNs rely on only password-based logins. Is this ideal? [2]<br>c) What is \"salt\" in the context of password security? [2]<br>d) Kerberos, through use of strong encryption algorithms, provides password protection. i. What is Kerberos? [2] ii. Aside from strong encryption, how else does Kerberos provide password security? [2]", "a": "<div class=\"ans\"><b>Answer:<\/b> Strong = long, unpredictable, unique. Password-only VPN is not ideal (use MFA). Salt = random per-user value hashed with the password. Kerberos = ticket-based authentication service; it never sends the password.<\/div><ol class=\"steps\"><li><b>a)<\/b> Hard to guess or crack: long (12+ characters / passphrase), mix of character types, no dictionary words or personal info, unique per site; use a password manager.<\/li><li><b>b)<\/b> No — a single factor is open to phishing, guessing and credential stuffing; a stolen password gives access to the whole internal network. Add MFA (OTP, certificate).<\/li><li><b>c)<\/b> A random value stored per user and combined with the password before hashing, so identical passwords hash differently and rainbow tables fail.<\/li><li><b>d) i.<\/b> Kerberos is a trusted-third-party (KDC) authentication service using symmetric-key tickets, giving single sign-on in a network.<\/li><li><b>d) ii.<\/b> The password is never transmitted (only used locally to derive a key); tickets have limited lifetimes; authenticators with timestamps stop replay; users type the password once (single sign-on) so it's exposed less.<\/li><\/ol>", "k": "theory", "d": null, "id": 183}, {"t": "auth", "src": ["EX24 Q1(b)"], "m": 4, "q": "Briefly explain what you understand by multi-factor authentication (MFA). Assume Thuto, a learning management system used at NUL, was to implement MFA; suggest any two factors that could be used. [2,2]", "a": "<div class=\"ans\"><b>Answer:<\/b> MFA requires two or more different types of factor. Thuto: password (know) + OTP/authenticator app on the student's phone (have).<\/div><ol class=\"steps\"><li>MFA: the user must present evidence from at least two <i>different<\/i> categories — something you know, have, or are — so a stolen password alone isn't enough.<\/li><li>Factor 1 (knowledge): the student's Thuto password / PIN.<\/li><li>Factor 2 (possession): one-time code via an authenticator app or SMS to a registered phone (or inherence: fingerprint on the phone app).<\/li><\/ol>", "k": "theory", "d": null, "id": 184}, {"t": "auth", "src": ["EX24 Q6(b)"], "m": 7, "q": "Alice and Bob want to confirm they hold the same secret key. Alice creates a random bit string R<sub>A<\/sub> (key length), XORs it with her key K<sub>A<\/sub>, and sends the result to Bob. Bob XORs the received bits with his key K<sub>B<\/sub> and sends back the result. Alice compares it with R<sub>A<\/sub>. Neither transmits the key.<br>i. Prove that the scheme works (if K<sub>A<\/sub> = K<sub>B<\/sub>, Alice can confirm). [4]<br>ii. Show how an attacker can take advantage of this scheme to discover the secret key. [3]", "a": "<div class=\"ans\"><b>Answer:<\/b> i. Bob returns R<sub>A<\/sub> ⊕ K<sub>A<\/sub> ⊕ K<sub>B<\/sub> = R<sub>A<\/sub> when K<sub>A<\/sub> = K<sub>B<\/sub>. ii. An eavesdropper XORs the two messages: X ⊕ Y = K.<\/div><h4>i.<\/h4><ol class=\"steps\"><li>Alice sends X = R<sub>A<\/sub> ⊕ K<sub>A<\/sub>.<\/li><li>Bob sends Y = X ⊕ K<sub>B<\/sub> = R<sub>A<\/sub> ⊕ K<sub>A<\/sub> ⊕ K<sub>B<\/sub>.<\/li><li>If K<sub>A<\/sub> = K<sub>B<\/sub> = K then K ⊕ K = 0, so Y = R<sub>A<\/sub> ⊕ 0 = R<sub>A<\/sub> ⇒ Alice sees her random bits come back ✓<\/li><li>If the keys differ, Y = R<sub>A<\/sub> ⊕ (K<sub>A<\/sub> ⊕ K<sub>B<\/sub>) ≠ R<sub>A<\/sub>. ∎<\/li><li>Example: R<sub>A<\/sub> = 1010, K = 0110 ⇒ X = 1100, Y = 1100 ⊕ 0110 = 1010 = R<sub>A<\/sub>.<\/li><\/ol><h4>ii.<\/h4><ol class=\"steps\"><li>Eve passively records both messages X and Y.<\/li><li>X ⊕ Y = (R<sub>A<\/sub> ⊕ K<sub>A<\/sub>) ⊕ (R<sub>A<\/sub> ⊕ K<sub>A<\/sub> ⊕ K<sub>B<\/sub>) = K<sub>B<\/sub> (= the shared key).<\/li><li>With the example: 1100 ⊕ 1010 = 0110 = K. The key leaks completely — a known-plaintext style weakness of XOR.<\/li><\/ol>", "k": "calc", "d": null, "id": 185}, {"t": "net", "src": ["EX22 Q5(a)(b)(c)", "EXAB Q6(b)"], "m": 10, "q": "TLS is one of the popularly used security protocols on the internet.<br>a) What does TLS stand for and what does it replace? [2]<br>b) The use of TLS relies on both symmetric and asymmetric cryptography. Why was it deemed ideal to not simply use one type? [4]<br>c) Briefly outline the steps of the TLS handshake. [4]", "a": "<div class=\"ans\"><b>Answer:<\/b> a) Transport Layer Security; it replaces SSL (Secure Sockets Layer). b) Asymmetric solves key exchange/authentication, symmetric is fast for bulk data. c) Hello → server cert/key exchange → client key exchange → Finished.<\/div><h4>b)<\/h4><ol class=\"steps\"><li>Asymmetric (RSA/D-H, certificates): authenticates the server and lets strangers agree a secret over the open internet — but it's slow and costly per byte.<\/li><li>Symmetric (AES) with HMAC/AEAD: very fast for bulk data, but needs a shared key first.<\/li><li>Hybrid gets the best of both: public-key crypto only in the handshake to set up session keys, then symmetric crypto for all the data.<\/li><\/ol><h4>c)<\/h4><ol class=\"steps\"><li><b>Phase 1 – Hello:<\/b> Client → Server: ClientHello (TLS version, client random, session ID, supported cipher suites, compression). Server → Client: ServerHello (chosen version and cipher suite, server random).<\/li><li><b>Phase 2 – Server authentication &amp; key exchange:<\/b> Server sends its certificate (X.509 chain), ServerKeyExchange (e.g. its D-H parameters, signed) if needed, optional CertificateRequest, then ServerHelloDone.<\/li><li><b>Phase 3 – Client key exchange:<\/b> client verifies the certificate, sends ClientKeyExchange (pre-master secret encrypted with server's RSA public key, or its D-H value), and its certificate + CertificateVerify if asked.<\/li><li>Both compute the master secret from the pre-master secret + client random + server random, then derive session keys.<\/li><li><b>Phase 4 – Finish:<\/b> ChangeCipherSpec and Finished messages (a MAC over the whole handshake) in both directions — confirms both sides have the same keys and nothing was tampered with. Encrypted application data follows.<\/li><\/ol>", "k": "theory", "d": "tls", "id": 186}, {"t": "net", "src": ["EX24 Q6(c)"], "m": 8, "q": "SSL (now TLS) is an Internet security protocol that encrypts data to keep it safe.<br>i. Give one application layer protocol that runs over TLS. [1]<br>ii. Briefly explain how TLS offers: Authentication, Confidentiality and Data integrity. [4]<br>iii. Also explain how session keys are distributed in TLS. [3]", "a": "<div class=\"ans\"><b>Answer:<\/b> i. HTTPS (HTTP over TLS); also SMTPS, IMAPS, FTPS.<\/div><h4>ii.<\/h4><ol class=\"steps\"><li><b>Authentication:<\/b> the server (optionally the client) presents an X.509 certificate signed by a CA, and proves it owns the private key (decrypting the pre-master secret or signing the key exchange).<\/li><li><b>Confidentiality:<\/b> after the handshake all records are encrypted with a symmetric cipher (e.g. AES) using the session keys.<\/li><li><b>Integrity:<\/b> each record carries a MAC (HMAC-SHA256) or uses an AEAD mode (AES-GCM); the Finished messages also MAC the entire handshake.<\/li><\/ol><h4>iii.<\/h4><ol class=\"steps\"><li>Client and server exchange random values (client random, server random) in the Hellos.<\/li><li>The pre-master secret is either sent by the client encrypted under the server's RSA public key, or computed by both via (EC)Diffie-Hellman.<\/li><li>Both compute master secret = PRF(pre-master, \"master secret\", client random ‖ server random), then expand it into a key block: client/server write keys, MAC keys and IVs. Keys themselves never cross the network.<\/li><\/ol>", "k": "theory", "d": "tls", "id": 187}, {"t": "net", "src": ["EX25 Q7"], "m": 20, "q": "a) SSL was developed by Netscape to allow secure communication over the Web.<br>i. Give the role of the client random, server random, and pre-master key in the SSL/TLS handshake protocol and session key generation. [7]<br>ii. Explain how a Man-in-the-Middle attack can occur if certificate validation is not performed. Give one method used in TLS to prevent such attacks. [2,2]<br>b) When investigating the cipher suite used by Thuto, you discovered that it is configured as: TLS_DH_RSA_WITH_AES_128_CBC_HMAC_SHA256. Break down the meaning of the cipher suite and explain the role of each algorithm. [9]", "a": "<div class=\"ans\"><b>Answer:<\/b> Randoms give freshness/uniqueness; pre-master is the shared secret; all three feed the master secret. Without certificate checks an attacker presents his own key. Suite: DH key exchange, RSA-signed certificate, AES-128-CBC encryption, HMAC-SHA256 integrity.<\/div><h4>a) i.<\/h4><ol class=\"steps\"><li><b>Client random<\/b> (32 bytes, in ClientHello) and <b>server random<\/b> (in ServerHello): fresh unpredictable values from each side. They make every session's keys unique even if the pre-master secret repeated, and stop replay of an old handshake.<\/li><li><b>Pre-master secret:<\/b> the actual shared secret — generated by the client and sent encrypted with the server's public key (RSA), or computed by both via Diffie-Hellman. Only client and server know it.<\/li><li><b>Session key generation:<\/b> master secret = PRF(pre-master, \"master secret\", client random ‖ server random); key block = PRF(master, \"key expansion\", server random ‖ client random) → client write key, server write key, MAC keys, IVs.<\/li><li>So both randoms + the pre-master secret are needed: the attacker who replays old messages or knows only public values can't reproduce the keys.<\/li><\/ol><h4>a) ii.<\/h4><ol class=\"steps\"><li>If the client doesn't validate the certificate (signature chain to a trusted CA, hostname, expiry, revocation), an attacker can intercept the connection and present <b>his own<\/b> certificate/public key.<\/li><li>The client then sets up keys with the attacker, who opens a second TLS session to the real server and relays/reads/modifies everything (MITM).<\/li><li><b>Prevention:<\/b> proper certificate validation against trusted CAs (chain of trust + hostname check), certificate pinning / HSTS, and the signed handshake (Finished messages, signed ServerKeyExchange).<\/li><\/ol><h4>b)<\/h4><div class=\"tw\"><table class=\"wt\"><thead><tr><th>Part<\/th><th>Meaning / role<\/th><\/tr><\/thead><tbody><tr><td>TLS<\/td><td>The protocol<\/td><\/tr><tr><td>DH<\/td><td>Key exchange: Diffie–Hellman is used to agree the pre-master secret (static DH parameters in the certificate here; DHE would be ephemeral).<\/td><\/tr><tr><td>RSA<\/td><td>Authentication: the server's certificate is signed with RSA (by the CA), proving the DH key belongs to the server.<\/td><\/tr><tr><td>WITH<\/td><td>Separator: key exchange/authentication before, bulk encryption &amp; MAC after<\/td><\/tr><tr><td>AES_128<\/td><td>Bulk symmetric encryption of application data with a 128-bit AES key — confidentiality.<\/td><\/tr><tr><td>CBC<\/td><td>Block-cipher mode: Cipher Block Chaining (with IV) so identical blocks don't give identical ciphertext.<\/td><\/tr><tr><td>HMAC_SHA256<\/td><td>Message integrity &amp; authentication of each record: HMAC built on SHA-256 (also used in the PRF for key derivation).<\/td><\/tr><\/tbody><\/table><\/div>", "k": "theory", "d": "tls", "id": 188}, {"t": "net", "src": ["SUP26 Q7(c)"], "m": 9, "q": "Compare the TLS cipher suites TLS_RSA_WITH_AES_128_CBC_SHA256 and TLS_DHE_RSA_WITH_AES_128_GCM_SHA256.<br>i. Explain the meaning of each cipher suite. [6]<br>ii. An attacker captures encrypted network traffic today and compromises the server's private key one year later. For which cipher suite would the previously captured traffic remain protected? Explain. [3]", "a": "<div class=\"ans\"><b>Answer:<\/b> ii. TLS_DHE_RSA_WITH_AES_128_GCM_SHA256 — ephemeral DH gives forward secrecy.<\/div><h4>i.<\/h4><div class=\"tw\"><table class=\"wt\"><thead><tr><th><\/th><th>TLS_RSA_WITH_AES_128_CBC_SHA256<\/th><th>TLS_DHE_RSA_WITH_AES_128_GCM_SHA256<\/th><\/tr><\/thead><tbody><tr><td>Key exchange<\/td><td>RSA key transport: client encrypts the pre-master secret with the server's RSA public key<\/td><td>DHE: ephemeral Diffie–Hellman — fresh D-H keys each session<\/td><\/tr><tr><td>Authentication<\/td><td>RSA certificate (implicitly — only the server's private key can decrypt the pre-master)<\/td><td>RSA: server signs its DH parameters with its RSA private key<\/td><\/tr><tr><td>Encryption<\/td><td>AES-128 in CBC mode<\/td><td>AES-128 in GCM mode (authenticated encryption, AEAD)<\/td><\/tr><tr><td>Integrity<\/td><td>HMAC with SHA-256<\/td><td>Built into GCM; SHA-256 used in the PRF/key derivation<\/td><\/tr><\/tbody><\/table><\/div><h4>ii.<\/h4><ol class=\"steps\"><li>With <b>TLS_RSA<\/b>, the pre-master secret was encrypted with the server's long-term RSA key. Once that private key is stolen, the attacker decrypts every recorded handshake ⇒ all past traffic is exposed.<\/li><li>With <b>TLS_DHE_RSA<\/b>, the session key came from ephemeral D-H values that were thrown away after each session; the RSA key was only used to <i>sign<\/i>. Stealing it later doesn't reveal the old D-H secrets ⇒ past traffic stays protected: <b>perfect forward secrecy<\/b>.<\/li><\/ol>", "k": "theory", "d": "tls", "id": 189}, {"t": "net", "src": ["PY Q2"], "m": 8, "q": "A small business in Roma has been advised to get an intrusion detection system (IDS). The business believes it doesn't need it since it already has two firewalls used, in part, to implement a DMZ.<br>a) What is a DMZ? [2]<br>b) Briefly explain to management why an IDS and a firewall may both be needed to implement a highly secure network. [3]<br>c) Assuming management appreciates your explanation, where would you place the IDS? [3]", "a": "<div class=\"ans\"><b>Answer:<\/b> a) A buffer subnet between the Internet and the internal LAN for public-facing servers. b) Firewalls block by policy; an IDS detects attacks that pass through or start inside. c) Inside the DMZ and on the internal network (behind each firewall).<\/div><h4>a)<\/h4><p><b>DMZ (demilitarised zone):<\/b> a separate network segment between the outer firewall (Internet) and inner firewall (internal LAN) holding public servers (web, mail, DNS). If a DMZ server is hacked, the inner firewall still protects the internal network.<\/p><h4>b)<\/h4><ol class=\"steps\"><li>A <b>firewall<\/b> is a gatekeeper: allows/blocks traffic based on rules (IPs, ports, protocols). It can't see attacks hidden in <i>allowed<\/i> traffic (e.g. SQL injection over port 443) or attacks from inside.<\/li><li>An <b>IDS<\/b> is a burglar alarm: monitors traffic/host activity for signatures and anomalies, detects intrusions, malware, insider misuse and alerts (an IPS can also block).<\/li><li>Defence in depth: the firewall reduces the attack surface; the IDS catches what gets through and shows the firewall is working.<\/li><\/ol><h4>c)<\/h4><ol class=\"steps\"><li><b>In the DMZ<\/b> (just behind the outer firewall): sees attacks that passed the outer firewall and targets public servers.<\/li><li><b>On the internal network<\/b> (behind the inner firewall): detects anything that got further, plus insider attacks — the most valuable place.<\/li><li>Optionally one outside the outer firewall to see all attempted attacks (lots of noise). Host-based IDS on critical servers adds more.<\/li><\/ol>", "k": "theory", "d": "dmz", "id": 190}, {"t": "net", "src": ["EX24 Q7(c)"], "m": 10, "q": "Assume two processes in a Chat application communicating over TCP have already established a session. State your assumptions, if any, and using Java (or a programming language of your choice) write functions that perform the following: i. Encrypt a message using AES [5] ii. Sign a message digest using SHA-2 [5]", "a": "<div class=\"ans\"><b>Answer:<\/b> Use javax.crypto's Cipher(\"AES/GCM/NoPadding\") for encryption and Signature(\"SHA256withRSA\") for signing — code below.<\/div><ol class=\"steps\"><li><b>Assumptions:<\/b> the session already gives both sides a shared 128-bit AES key; each process has an RSA key pair and the peer's authentic public key; messages are text (UTF-8).<\/li><li>AES-GCM with a fresh random 12-byte IV per message; the IV is sent in front of the ciphertext (it doesn't need to be secret).<\/li><li>SHA256withRSA computes the SHA-256 digest and signs it with the private key; the receiver verifies with the public key.<\/li><\/ol><pre class=\"code\">import javax.crypto.*;\nimport javax.crypto.spec.*;\nimport java.security.*;\nimport java.util.Base64;\n\npublic class SecureChat {\n    // Assumptions: both processes already share a 128-bit AES session key\n    // (e.g. agreed with Diffie-Hellman) and each has its own RSA key pair\n    // whose public half the other side trusts (certificate).\n\n    // i. Encrypt a message using AES (GCM mode: confidentiality + integrity)\n    public static byte[] encryptAES(String message, SecretKey key) throws Exception {\n        byte[] iv = new byte[12];\n        new SecureRandom().nextBytes(iv);                 // fresh IV per message\n        Cipher cipher = Cipher.getInstance(\"AES/GCM/NoPadding\");\n        cipher.init(Cipher.ENCRYPT_MODE, key, new GCMParameterSpec(128, iv));\n        byte[] ct = cipher.doFinal(message.getBytes(\"UTF-8\"));\n        byte[] out = new byte[iv.length + ct.length];      // send IV || ciphertext\n        System.arraycopy(iv, 0, out, 0, iv.length);\n        System.arraycopy(ct, 0, out, iv.length, ct.length);\n        return out;\n    }\n\n    public static String decryptAES(byte[] data, SecretKey key) throws Exception {\n        Cipher cipher = Cipher.getInstance(\"AES/GCM/NoPadding\");\n        cipher.init(Cipher.DECRYPT_MODE, key, new GCMParameterSpec(128, data, 0, 12));\n        return new String(cipher.doFinal(data, 12, data.length - 12), \"UTF-8\");\n    }\n\n    // ii. Sign a message digest using SHA-2 (SHA-256 hash, signed with RSA private key)\n    public static byte[] signSHA256(String message, PrivateKey privateKey) throws Exception {\n        Signature signer = Signature.getInstance(\"SHA256withRSA\"); // hashes then signs\n        signer.initSign(privateKey);\n        signer.update(message.getBytes(\"UTF-8\"));\n        return signer.sign();\n    }\n\n    public static boolean verifySHA256(String message, byte[] sig, PublicKey publicKey) throws Exception {\n        Signature verifier = Signature.getInstance(\"SHA256withRSA\");\n        verifier.initVerify(publicKey);\n        verifier.update(message.getBytes(\"UTF-8\"));\n        return verifier.verify(sig);\n    }\n\n    public static void main(String[] args) throws Exception {\n        KeyGenerator kg = KeyGenerator.getInstance(\"AES\");\n        kg.init(128);\n        SecretKey sessionKey = kg.generateKey();\n        KeyPairGenerator kpg = KeyPairGenerator.getInstance(\"RSA\");\n        kpg.initialize(2048);\n        KeyPair alice = kpg.generateKeyPair();\n\n        String msg = \"Hello Bob\";\n        byte[] ct  = encryptAES(msg, sessionKey);\n        byte[] sig = signSHA256(msg, alice.getPrivate());\n        System.out.println(Base64.getEncoder().encodeToString(ct));\n        System.out.println(decryptAES(ct, sessionKey) + \" | signature valid: \"\n                           + verifySHA256(msg, sig, alice.getPublic()));\n    }\n}<\/pre>", "k": "calc", "d": null, "id": 191}, {"t": "net", "src": ["EX22 Q8"], "m": 20, "q": "You are interviewing to be a network security consultant for the Thaba-Bosiu heritage organisation (decolonial historians on the panel).<br>a) Thaba-Bosiu was called a fortress because men would put boulders at night, guard likely points of access, and call for reinforcement. How could your network security implementation include the wisdom of Basotho men in securing Thaba-Bosiu? Describe tools/devices you would use. [6]<br>b) Is there any network security concept that can explain the use of Sesotho idioms to communicate messages? [4]<br>c) Write brief notes on how you could design and deploy a security solution for the organisation that ensures core security services (confidentiality, authentication and data integrity). [10]", "a": "<div class=\"ans\"><b>Answer:<\/b> a) Defence in depth: firewalls (boulders), IDS/IPS & monitoring (guards), incident response/backups (reinforcement). b) Encryption/encoding — only insiders with the shared 'key' understand (also steganography). c) Layered design with TLS/VPN, AES, MFA, certificates, hashes/signatures.<\/div><h4>a) Mapping the fortress to the network<\/h4><div class=\"tw\"><table class=\"wt\"><thead><tr><th>Thaba-Bosiu practice<\/th><th>Network equivalent<\/th><\/tr><\/thead><tbody><tr><td>Natural mountain + boulders blocking paths at night<\/td><td>Perimeter <b>firewalls<\/b>, DMZ, closing unused ports, network segmentation<\/td><\/tr><tr><td>Guards at the likely access points<\/td><td><b>IDS/IPS<\/b>, logging and 24/7 monitoring (SIEM) on entry points; access control at each gate (authentication)<\/td><\/tr><tr><td>Calling for reinforcement<\/td><td>Alerting + <b>incident response<\/b> team, redundancy/failover, backups and disaster recovery<\/td><\/tr><tr><td>Only known passes used by insiders<\/td><td>VPN for remote staff, least privilege, MFA<\/td><\/tr><\/tbody><\/table><\/div><h4>b)<\/h4><p>Yes — <b>encryption / encoding with a shared secret<\/b>: an idiom's real meaning is only understood by people who share the cultural 'key'; outsiders hear words but not the message (confidentiality). It also resembles <b>steganography<\/b> — hiding a message inside an innocent-looking one — and code-books.<\/p><h4>c)<\/h4><ol class=\"steps\"><li><b>Assess:<\/b> identify assets (archives, membership data, website), threats and risks; write a security policy.<\/li><li><b>Confidentiality:<\/b> TLS (HTTPS) for web/email, VPN (IPsec) for remote access, AES encryption of stored data and backups, role-based access control.<\/li><li><b>Authentication:<\/b> unique accounts, strong passwords + MFA, central directory/Kerberos SSO, server certificates from a CA.<\/li><li><b>Integrity:<\/b> hashes/HMAC on data and backups, digital signatures on important documents, file-integrity monitoring, change control.<\/li><li><b>Perimeter &amp; monitoring:<\/b> firewalls with a DMZ for public servers, IDS/IPS, logging, regular patching, anti-malware.<\/li><li><b>Availability &amp; people:<\/b> off-site backups, UPS, staff awareness training, periodic audits and penetration tests.<\/li><\/ol>", "k": "theory", "d": "dmz", "id": 192}, {"t": "mcq", "src": ["T3A Q1.1"], "m": 1, "q": "For an organisation with multiple systems such as NUL, single-sign-on can be employed to ease user authentication and authorisation. Which implementation would be more suitable for Thuto, Student iEnabler (on ITS) and NUL Student Email?", "opts": ["Synchronisation", "Multi-factor authentication", "Cookies", "Trusted Authentication Server", "None of the above"], "c": 3, "a": "SSO across several systems uses one trusted authentication server (e.g. Kerberos-style KDC or an identity provider) that all systems trust.", "k": "mcq", "d": null, "id": 193}, {"t": "mcq", "src": ["T3A Q1.2"], "m": 1, "q": "Which of the following is more secure than the Public-key authority?", "opts": ["Public-key certificates", "Public announcements", "Publicly-available directories", "None of the above"], "c": 0, "a": "Certificates remove the need for the authority to be online for every lookup (no bottleneck/single target) while still being CA-signed. Announcements and directories are weaker than a PKA.", "k": "mcq", "d": null, "id": 194}, {"t": "mcq", "src": ["T3A Q1.3"], "m": 1, "q": "What is an advantage of ElGamal over DSA?", "opts": ["It uses fewer resources and encrypts faster because it uses symmetric keys", "It is a block cipher rather than a stream cipher", "It employs a one-time pad", "It can provide digital signature and encryption functionality"], "c": 3, "a": "DSA is signature-only; ElGamal has both an encryption scheme and a signature scheme.", "k": "mcq", "d": null, "id": 195}, {"t": "mcq", "src": ["T3A Q1.4"], "m": 1, "q": "The process of mutual authentication involves ____", "opts": ["A user authenticating to two systems at the same time", "A user authenticating to a system and the system authenticating to the user", "A user authenticating to a server and then to a process", "A user authenticating, receiving a ticket, and then authenticating to a service"], "c": 1, "a": "Mutual = both parties prove their identity to each other.", "k": "mcq", "d": null, "id": 196}, {"t": "mcq", "src": ["T3A Q1.5"], "m": 1, "q": "Which of the following is not part of a Kerberos authentication implementation?", "opts": ["Ticket granting service", "Digital signature service", "Users, programs, and services", "Master key"], "c": 1, "a": "Kerberos is built on symmetric keys (master and session keys) with an AS and TGS — it has no digital signature service.", "k": "mcq", "d": null, "id": 197}, {"t": "mcq", "src": ["T3A Q1.6"], "m": 1, "q": "What do we call a trusted entity that distributes asymmetric keys between two parties?", "opts": ["KDC", "CA", "Kerberos", "KDD", "None of the above"], "c": 1, "a": "A Certificate Authority certifies/distributes public keys. A KDC distributes symmetric (secret) keys.", "k": "mcq", "d": null, "id": 198}, {"t": "mcq", "src": ["T3A Q1.7"], "m": 1, "q": "Which of the following services is not provided by a digital signature?", "opts": ["message authentication", "integrity", "non-repudiation", "confidentiality", "none of the above"], "c": 3, "a": "A signature can be verified by anyone with the public key, so it doesn't hide the message — no confidentiality.", "k": "mcq", "d": null, "id": 199}, {"t": "mcq", "src": ["T3A Q1.8"], "m": 1, "q": "What is the purpose of an SSL/TLS certificate in the context of web security?", "opts": ["Generating a private key and providing information to request a certificate", "Actively blocking all incoming and outgoing traffic", "Authenticating the identity of a website and enabling secure communication", "Encrypting data in transit and ensuring secure communication"], "c": 2, "a": "The certificate binds the site's identity to its public key (authentication); encryption itself is done by the session keys, not the certificate.", "k": "mcq", "d": null, "id": 200}, {"t": "mcq", "src": ["T3A Q1.9"], "m": 1, "q": "What is the recommended protocol for secure communication in modern web applications?", "opts": ["HTTP", "SSL/TLS", "SSH", "SFTP"], "c": 1, "a": "Web apps use TLS (HTTPS). SSH/SFTP are for remote shells/file transfer.", "k": "mcq", "d": null, "id": 201}, {"t": "mcq", "src": ["T3A Q1.10"], "m": 1, "q": "Why is it recommended to disable outdated and insecure SSL/TLS versions?", "opts": ["Encrypting communication to prevent interception and tampering", "Providing secure and authenticated communication for users", "Enhancing server performance", "Mitigating vulnerabilities and ensuring the use of secure protocols", "None of above"], "c": 3, "a": "Old versions (SSL 2/3, TLS 1.0/1.1) have known attacks (POODLE, BEAST); disabling them prevents downgrade to weak protocols.", "k": "mcq", "d": null, "id": 202}, {"t": "mcq", "src": ["T3A Q1.11"], "m": 1, "q": "What is the impact of SSL/TLS encryption on the performance of web applications?", "opts": ["Disturbing website aesthetics", "Actively blocking all incoming and outgoing traffic", "Slight overhead due to encryption but significant security benefits", "None"], "c": 2, "a": "Handshake + encryption add a small cost; the security gain is far larger.", "k": "mcq", "d": null, "id": 203}, {"t": "mcq", "src": ["T3A Q1.12"], "m": 1, "q": "Which encryption method is commonly used in SSL/TLS to secure bulk data transmission?", "opts": ["RSA", "AES", "DES", "SHA-1"], "c": 1, "a": "Bulk data uses fast symmetric AES; RSA is only for key exchange/authentication; SHA-1 is a hash.", "k": "mcq", "d": null, "id": 204}, {"t": "mcq", "src": ["T3A Q1.13"], "m": 1, "q": "What is the primary purpose of the \"Issuer\" field in an SSL/TLS certificate?", "opts": ["To specify the certificate's public key", "To identify the Certificate Authority (CA) that issued the certificate", "To specify the server's domain name", "To define the certificate's expiration date"], "c": 1, "a": "Issuer = the CA that signed it; Subject = the server/domain.", "k": "mcq", "d": null, "id": 205}, {"t": "mcq", "src": ["T3A Q1.14"], "m": 1, "q": "Which cryptographic hash function is commonly used in SSL/TLS for certificate signatures?", "opts": ["SHA-1", "MD5", "SHA-256", "HMAC"], "c": 2, "a": "MD5 and SHA-1 are broken for certificates; SHA-256 is standard. HMAC is a MAC, not a hash.", "k": "mcq", "d": null, "id": 206}, {"t": "mcq", "src": ["T3A Q1.15"], "m": 1, "q": "Which of the following is not true about CA hierarchy?", "opts": ["If both users share a common CA then they are assumed to know its public key", "Each user trusts parents' certificates", "A user can have multiple parents in the CA hierarchy", "Hierarchy allows verification of any certificate from one CA by users of all other CAs in hierarchy", "None of the above"], "c": 2, "a": "In the X.509 hierarchy each CA/user has a single parent (a tree), with forward and reverse certificates linking parent and child.", "k": "mcq", "d": null, "id": 207}, {"t": "mcq", "src": ["T3A Q1.16"], "m": 1, "q": "Which of the following would not warrant certificate revocation?", "opts": ["Certificate has expired", "User's private key is compromised", "User is no longer certified by this CA", "CA's certificate is compromised", "None of the above"], "c": 0, "a": "An expired certificate is simply invalid — revocation is for certificates that are still within their validity period.", "k": "mcq", "d": null, "id": 208}, {"t": "mcq", "src": ["T3A Q1.17"], "m": 1, "q": "Presenting or generating authentication information that corroborates the binding between the entity and the identifier is known as?", "opts": ["Identification step", "Verification step", "Authentication step", "Corroboration step"], "c": 1, "a": "User authentication = identification step (present the identifier) + verification step (present/generate information that corroborates the binding).", "k": "mcq", "d": null, "id": 209}, {"t": "mcq", "src": ["T3A Q1.18"], "m": 1, "q": "Which of the following factors must be considered when implementing Kerberos authentication?", "opts": ["Kerberos can be susceptible to man in the middle attacks to gain unauthorized access", "Kerberos requires a centrally managed database of all user and resource passwords", "Kerberos tickets can be spoofed using replay attacks to network resources", "Kerberos uses clear text passwords"], "c": 1, "a": "The KDC keeps the secret (master) keys of all users and services — it must be centrally managed and protected.", "k": "mcq", "d": null, "id": 210}, {"t": "mcq", "src": ["T3A Q1.19"], "m": 1, "q": "Which of the following does Kerberos use to protect against replay attacks?", "opts": ["Authenticator", "Nonce", "Time stamp", "Password", "None of the above"], "c": 2, "a": "Kerberos v4 relies on timestamps (with lifetimes) — the authenticator carries a fresh timestamp.", "k": "mcq", "d": null, "id": 211}, {"t": "mcq", "src": ["T3A Q1.20"], "m": 1, "q": "One of the following protocols provides security at the network layer:", "opts": ["TLSv3", "S/MIME", "PGP", "IPSec", "None of the above"], "c": 3, "a": "IPSec works at the IP (network) layer; TLS at transport; S/MIME and PGP at application (email).", "k": "mcq", "d": null, "id": 212}, {"t": "mcq", "src": ["T3B Q1"], "m": 1, "q": "A digital signature ensures non-repudiation because:", "opts": ["Only the sender's private key can generate the signature, and others can verify it using the corresponding public key.", "Both sender and receiver use their private keys for encryption.", "The message is encrypted with a shared symmetric key.", "Hashing guarantees confidentiality."], "c": 0, "a": "Only the private-key holder can sign, anyone can verify ⇒ signer can't deny it.", "k": "mcq", "d": null, "id": 213}, {"t": "mcq", "src": ["T3B Q2"], "m": 1, "q": "During a hybrid encryption session, a symmetric key is used for data encryption, while an asymmetric key pair is used for:", "opts": ["Hashing the message.", "Encrypting the symmetric session key.", "Establishing a checksum.", "Generating one-time passwords."], "c": 1, "a": "Public-key crypto protects (transports) the session key; AES encrypts the data.", "k": "mcq", "d": null, "id": 214}, {"t": "mcq", "src": ["T3B Q3"], "m": 1, "q": "In Diffie-Hellman, which two key

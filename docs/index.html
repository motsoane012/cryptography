s form a key pair used for data encryption and decryption?", "opts": ["Public and Private keys", "Master and Session keys", "Symmetric and Asymmetric keys", "Encryption and Hash keys", "None of the above"], "c": 0, "a": "Each party has a private X and public Y = g<sup>X<\/sup> mod p. (Strictly, D-H itself doesn't encrypt — the pair is used to derive the shared key.)", "k": "mcq", "d": null, "id": 215}, {"t": "mcq", "src": ["T3B Q4"], "m": 1, "q": "An organization uses Kerberos for single sign-on. If the Ticket-Granting Ticket (TGT) is compromised, what must be done immediately?", "opts": ["Disable the Ticket Granting Server.", "Revoke all user certificates.", "Replace the public keys for all users.", "Force a password reset and purge cached tickets."], "c": 3, "a": "Kerberos has no certificates/public keys; invalidate the stolen tickets and the credentials behind them.", "k": "mcq", "d": null, "id": 216}, {"t": "mcq", "src": ["T3B Q5"], "m": 1, "q": "In ElGamal encryption, which value is kept private by the receiver?", "opts": ["The random number k", "The public key (y)", "The private key (x)", "The prime modulus (p)"], "c": 2, "a": "x is the receiver's private key; k is the sender's one-time random number.", "k": "mcq", "d": null, "id": 217}, {"t": "mcq", "src": ["T3B Q6"], "m": 1, "q": "Given n = p × q and φ(n) = (p−1)(q−1), what must be true for the chosen public exponent e?", "opts": ["e must be coprime to φ(n)", "e must equal p + q", "e must divide φ(n)", "e must be smaller than both p and q"], "c": 0, "a": "gcd(e, φ(n)) = 1 so that d = e<sup>−1<\/sup> mod φ(n) exists.", "k": "mcq", "d": null, "id": 218}, {"t": "mcq", "src": ["T3B Q7"], "m": 1, "q": "In RSA, which condition must p and q satisfy when generating the modulus n = p × q?", "opts": ["Both must be distinct large prime numbers", "Both must be even", "One must be prime and the other composite", "Both must be perfect squares"], "c": 0, "a": "Distinct large primes make n hard to factor.", "k": "mcq", "d": null, "id": 219}, {"t": "mcq", "src": ["T3B Q8"], "m": 1, "q": "If a user encrypts data with their private key, and another decrypts it using the public key, the primary security service achieved is:", "opts": ["Availability", "Integrity", "Authentication", "Confidentiality"], "c": 2, "a": "Anyone can decrypt (no confidentiality), but only the owner could have encrypted ⇒ origin authentication (signature).", "k": "mcq", "d": null, "id": 220}, {"t": "mcq", "src": ["T3B Q9"], "m": 1, "q": "Which of the following best explains why Diffie-Hellman alone cannot ensure authentication?", "opts": ["It requires pre-shared keys.", "It uses outdated modulus parameters.", "It does not use hashing.", "It is vulnerable to man-in-the-middle attacks without digital signatures."], "c": 3, "a": "Public values aren't authenticated ⇒ MITM.", "k": "mcq", "d": null, "id": 221}, {"t": "mcq", "src": ["T3B Q10"], "m": 1, "q": "When should a digital certificate be revoked?", "opts": ["If the private key of the certificate owner or issuing CA is leaked or suspected compromised.", "If the certificate is used for unauthorized or fraudulent purposes (e.g. spoofing or MITM attacks).", "If the subject's organization, domain, or identifying information changes.", "If a certificate was issued incorrectly, in violation of policy, or through a compromised subordinate CA.", "All of the above"], "c": 4, "a": "Every listed situation is a valid revocation reason.", "k": "mcq", "d": null, "id": 222}, {"t": "mcq", "src": ["T3B Q11"], "m": 1, "q": "Which property distinguishes strong collision resistance from weak collision resistance?", "opts": ["Strong collision resistance prevents finding any two messages with the same hash; weak prevents finding one with the same hash as a given message.", "They differ only in digest size.", "Strong collision resistance ensures pre-image resistance.", "Weak collision resistance resists brute-force attacks."], "c": 0, "a": "Strong: attacker picks both messages. Weak (second preimage): one message is fixed.", "k": "mcq", "d": null, "id": 223}, {"t": "mcq", "src": ["T3B Q12"], "m": 1, "q": "What is the primary purpose of the initialization vector (IV) in AES-CBC mode?", "opts": ["To strengthen key entropy during generation", "To ensure identical plaintext blocks produce different ciphertexts", "To verify message integrity", "To reduce block size overhead"], "c": 1, "a": "The IV randomises encryption so repeated messages don't give repeated ciphertext.", "k": "mcq", "d": null, "id": 224}, {"t": "mcq", "src": ["T3B Q13"], "m": 1, "q": "A system employs mutual TLS authentication. Which statement best describes its security benefit?", "opts": ["Only the server provides a certificate.", "It replaces the need for a public key infrastructure.", "Both client and server prove their identities using digital certificates.", "The client authenticates via password."], "c": 2, "a": "mTLS = certificates on both sides.", "k": "mcq", "d": null, "id": 225}, {"t": "mcq", "src": ["T3B Q14"], "m": 1, "q": "Given a 256-bit hash output, what is the approximate complexity of a birthday attack to find a collision?", "opts": ["2<sup>80<\/sup> operations", "2<sup>128<\/sup> operations", "2<sup>40<\/sup> operations", "2<sup>256<\/sup> operations"], "c": 1, "a": "Birthday bound = 2<sup>n/2<\/sup> = 2<sup>128<\/sup>.", "k": "mcq", "d": null, "id": 226}, {"t": "mcq", "src": ["T3B Q15"], "m": 1, "q": "Which attack can occur if session keys are reused across multiple sessions?", "opts": ["Replay attack", "Brute-force attack", "Side-channel attack", "Man-in-the-middle attack"], "c": 0, "a": "Messages recorded in an old session are still valid under the same key and can be replayed.", "k": "mcq", "d": null, "id": 227}, {"t": "mcq", "src": ["T3B Q16"], "m": 1, "q": "What key management flaw could render a perfectly secure algorithm vulnerable in practice?", "opts": ["Long key size.", "Low randomness in key generation.", "Algorithmic transparency.", "Key reuse for non-overlapping sessions.", "None of the above"], "c": 1, "a": "Predictable keys can be guessed regardless of the algorithm's strength. (Transparency is Kerckhoff's principle — good.)", "k": "mcq", "d": null, "id": 228}, {"t": "mcq", "src": ["T3B Q17"], "m": 1, "q": "Why does salting strengthen password hashing?", "opts": ["It reduces CPU workload.", "It increases the digest length.", "It forces each identical password to yield a unique hash.", "It enables symmetric decryption of hashes."], "c": 2, "a": "Unique salts defeat rainbow tables and hide identical passwords.", "k": "mcq", "d": null, "id": 229}, {"t": "mcq", "src": ["T3B Q18"], "m": 1, "q": "Kerberos permits only minimal deviation between system clocks because:", "opts": ["Tickets depend on time stamps for replay protection.", "Sessions expire every 60 seconds.", "Passwords are time-dependent.", "The TGS uses a nonce instead of timestamps."], "c": 0, "a": "Authenticators/tickets are validated against timestamps.", "k": "mcq", "d": null, "id": 230}, {"t": "mcq", "src": ["T3B Q19"], "m": 1, "q": "What is the main purpose of including a nonce in a key exchange or authentication protocol?", "opts": ["To increase encryption speed", "To hide the session key from the user", "To prevent replay attacks by ensuring message freshness", "To simplify digital signature generation"], "c": 2, "a": "A nonce is used once ⇒ proves freshness.", "k": "mcq", "d": null, "id": 231}, {"t": "mcq", "src": ["T3B Q20"], "m": 1, "q": "A developer mistakenly uses ECB mode for encrypting image files. The result still reveals structural patterns. Why?", "opts": ["The key size was too small.", "The IV was reused.", "The padding scheme was incorrect.", "ECB encrypts identical plaintext blocks into identical ciphertext blocks."], "c": 3, "a": "The famous 'ECB penguin'.", "k": "mcq", "d": null, "id": 232}, {"t": "mcq", "src": ["T3B Q21"], "m": 1, "q": "If an attacker alters an encrypted message in transit and the recipient decrypts it successfully but the content is incorrect, which principle of security is violated?", "opts": ["Auditing", "Confidentiality", "Authentication", "Availability", "Integrity"], "c": 4, "a": "The data was modified ⇒ integrity.", "k": "mcq", "d": null, "id": 233}, {"t": "mcq", "src": ["T3B Q22"], "m": 1, "q": "Which technique best prevents replay attacks in authentication protocols?", "opts": ["Token caching.", "Hash salting.", "Key stretching.", "Nonce or timestamp verification."], "c": 3, "a": "Freshness checks stop replays.", "k": "mcq", "d": null, "id": 234}, {"t": "mcq", "src": ["T3B Q23"], "m": 1, "q": "A block cipher with a 128-bit block size and 256-bit key operates in CTR mode. Which statement is true?", "opts": ["IV reuse does not affect security.", "Encryption and decryption are parallelizable.", "Padding is required.", "It uses feedback from previous ciphertext blocks."], "c": 1, "a": "CTR blocks are independent; no padding; nonce reuse is fatal; no feedback.", "k": "mcq", "d": null, "id": 235}, {"t": "mcq", "src": ["T3B Q24"], "m": 1, "q": "A server uses an expired TLS certificate but a strong cipher suite. Which property is primarily violated?", "opts": ["Confidentiality", "Integrity", "Forward secrecy", "Trust and authentication", "None of above"], "c": 3, "a": "Encryption is still strong, but the server's identity can no longer be trusted.", "k": "mcq", "d": null, "id": 236}, {"t": "mcq", "src": ["T3B Q25"], "m": 1, "q": "The primary weakness of one-time pad (OTP) encryption in practice is:", "opts": ["Limited key space.", "Short key lifetime.", "Difficulty of securely generating and distributing truly random keys", "Predictable ciphertext patterns."], "c": 2, "a": "Keys as long as all messages, truly random, never reused — hard to manage.", "k": "mcq", "d": null, "id": 237}, {"t": "mcq", "src": ["T3B Q26"], "m": 1, "q": "A cipher uses both substitution and transposition operations to obscure data. This design approach provides:", "opts": ["Avalanche effect.", "Forward secrecy.", "One-time pad properties.", "Confusion and diffusion as defined by Shannon."], "c": 3, "a": "Substitution → confusion, transposition → diffusion.", "k": "mcq", "d": null, "id": 238}, {"t": "mcq", "src": ["T3B Q27"], "m": 1, "q": "Which of the following ensures that an encrypted message cannot be modified without detection?", "opts": ["One-way hashing only", "Ciphertext-only encryption", "Stream cipher reinitialization", "Signed hash codes"], "c": 3, "a": "A signed hash (or MAC) detects modification; a plain hash can be recomputed by the attacker.", "k": "mcq", "d": null, "id": 239}, {"t": "mcq", "src": ["T3B Q28"], "m": 1, "q": "In Kerberos, which ticket allows access to network services (from Server)?", "opts": ["Ticket Granting Ticket (TGT)", "Authentication Ticket", "Service Ticket (ST)", "Session Key Ticket"], "c": 2, "a": "The TGT gets you service tickets; the service ticket (Ticket<sub>v<\/sub>) gets you into the server.", "k": "mcq", "d": null, "id": 240}, {"t": "mcq", "src": ["T3B Q29"], "m": 1, "q": "Which cryptographic protocol replaced SSL and offers stronger security for Internet/Web communications?", "opts": ["TLS", "SSH", "IPsec", "HTTPS"], "c": 0, "a": "TLS is SSL's successor; HTTPS is HTTP over TLS.", "k": "mcq", "d": null, "id": 241}, {"t": "mcq", "src": ["T3B Q30"], "m": 1, "q": "Which logical components form the Key Distribution Center (KDC) in Kerberos?", "opts": ["Client, Authentication Server and Ticket Granting Server", "Authentication Server and Ticket-Granting Server", "Certificate Authority and Registration Authority", "Directory Server and LDAP Agent"], "c": 1, "a": "KDC = AS + TGS; the client isn't part of it.", "k": "mcq", "d": null, "id": 242}, {"t": "mcq", "src": ["T3B Q31"], "m": 1, "q": "The primary purpose of the TLS handshake is to:", "opts": ["Compress application data before encryption", "Exchange MAC algorithms", "Provide digital signatures for all packets", "Establish a shared session key and authenticate endpoints"], "c": 3, "a": "Negotiate, authenticate, and derive session keys. (Printed as a second 'A' on the paper.)", "k": "mcq", "d": null, "id": 243}, {"t": "mcq", "src": ["T3B Q32"], "m": 1, "q": "Which cryptographic algorithms are used together in TLS to achieve confidentiality of bulk data and authentication? Choose two.", "opts": ["Symmetric encryption", "Digital certificates", "Hash functions", "Compression", "Public-key encryption"], "c": [0, 4], "a": "Symmetric encryption (AES) for bulk confidentiality + public-key crypto (RSA/ECDHE + signatures) for authentication/key exchange. (The paper prints two options as 'D'.)", "k": "mcq", "d": null, "id": 244}, {"t": "mcq", "src": ["T3B Q33"], "m": 1, "q": "In Diffie-Hellman, if an attacker intercepts all public values but cannot compute the private ones, this illustrates which principle?", "opts": ["Computational infeasibility of discrete logarithm", "Prime number factorization", "Perfect secrecy", "Hash resistance"], "c": 0, "a": "Recovering X from g<sup>X<\/sup> mod p is the discrete log problem.", "k": "mcq", "d": null, "id": 245}, {"t": "mcq", "src": ["T3B Q34"], "m": 1, "q": "During digital signature verification, which key does the receiver use?", "opts": ["Sender's public key", "Sender's private key", "Receiver's private key", "Shared session key"], "c": 0, "a": "Sign with sender's private, verify with sender's public.", "k": "mcq", "d": null, "id": 246}, {"t": "mcq", "src": ["T3B Q35"], "m": 1, "q": "Each round of AES (except the last) includes which sequence?", "opts": ["SubBytes → ShiftRows → MixColumns → AddRoundKey", "AddRoundKey → SubBytes → ShiftRows → MixColumns", "ShiftRows → SubBytes → AddRoundKey", "MixColumns → AddRoundKey → ShiftRows"], "c": 0, "a": "The last round drops MixColumns.", "k": "mcq", "d": null, "id": 247}, {"t": "fund", "src": ["T1E Q1(a)"], "m": 7, "q": "A company experiences the following incidents:<br>i. An attacker reads confidential wireless traffic without changing it.<br>ii. Malware modifies records stored in a database.<br>iii. A denial-of-service attack prevents legitimate users from accessing a server.<br>For each incident: identify the main security service affected; classify the attack as active or passive where applicable; and state one suitable security mechanism or countermeasure.", "a": "<div class=\"ans\"><b>Answer:<\/b> i. Confidentiality, passive, encryption (WPA3/TLS) &nbsp; ii. Integrity, active, hashes/integrity checks + anti-malware &nbsp; iii. Availability, active, firewall/rate limiting/redundancy<\/div><div class=\"tw\"><table class=\"wt\"><thead><tr><th>Incident<\/th><th>Service affected<\/th><th>Active / passive<\/th><th>Countermeasure<\/th><\/tr><\/thead><tbody><tr><td>i. Reading wireless traffic<\/td><td>Confidentiality<\/td><td>Passive (eavesdropping — nothing is changed)<\/td><td>Encrypt the traffic: WPA3 on Wi-Fi, TLS/VPN on top<\/td><\/tr><tr><td>ii. Malware modifying database records<\/td><td>Integrity<\/td><td>Active (data is modified)<\/td><td>Anti-malware + least-privilege access control; detect changes with hashes/HMAC or file-integrity monitoring; restore from backups<\/td><\/tr><tr><td>iii. Denial of service<\/td><td>Availability<\/td><td>Active (service is disrupted)<\/td><td>Firewall/IPS filtering, rate limiting, DDoS protection (CDN), redundant servers/load balancing<\/td><\/tr><\/tbody><\/table><\/div>", "k": "theory", "d": null, "id": 248}, {"t": "block", "src": ["T1E Q1(b)(c)(d)"], "m": 5, "q": "b) Explain the roles of confusion and diffusion in a modern block cipher. [2]<br>c) Explain why a strong block cipher should exhibit the avalanche effect. [2]<br>d) iii. State one reason why increasing key length generally increases resistance to brute-force attack. [1]", "a": "<div class=\"ans\"><b>Answer:<\/b> b) Confusion hides the key–ciphertext link (S-boxes); diffusion spreads each plaintext bit over the whole block (permutations/mixing). c) So small changes give unpredictable, large output changes. d) Each extra bit doubles the key space.<\/div><ol class=\"steps\"><li><b>b) Confusion:<\/b> makes the relationship between the key and the ciphertext as complex as possible — done by non-linear substitution (S-boxes, SubBytes). <b>Diffusion:<\/b> spreads the influence of each plaintext bit over many ciphertext bits, hiding statistical patterns — done by permutations and mixing (ShiftRows, MixColumns, P-boxes).<\/li><li><b>c)<\/b> Flipping one plaintext or key bit should change about half the ciphertext bits. Then the attacker can't learn anything by making small changes and comparing outputs, and can't recover the key bit by bit — similar inputs give unrelated outputs.<\/li><li><b>d)<\/b> Brute force tries every key; an n-bit key gives 2<sup>n<\/sup> keys, so every extra bit <b>doubles<\/b> the work (56-bit DES ≈ days; 128-bit AES ≈ longer than the age of the universe).<\/li><\/ol>", "k": "theory", "d": null, "id": 249}, {"t": "classical", "src": ["T1E Q1(e)"], "m": 4, "q": "Alice uses a one-time pad correctly to encrypt one message. She then makes the mistake of using the same key again to encrypt a second message. Explain why key reuse creates a serious vulnerability. Hint: refer to what happens when the two ciphertexts are XORed together.", "a": "<div class=\"ans\"><b>Answer:<\/b> C<sub>1<\/sub> ⊕ C<sub>2<\/sub> = P<sub>1<\/sub> ⊕ P<sub>2<\/sub> — the key cancels out, so the attacker gets the XOR of the two plaintexts without needing the key.<\/div><ol class=\"steps\"><li>C<sub>1<\/sub> = P<sub>1<\/sub> ⊕ K and C<sub>2<\/sub> = P<sub>2<\/sub> ⊕ K.<\/li><li>C<sub>1<\/sub> ⊕ C<sub>2<\/sub> = P<sub>1<\/sub> ⊕ K ⊕ P<sub>2<\/sub> ⊕ K = P<sub>1<\/sub> ⊕ P<sub>2<\/sub> (since K ⊕ K = 0).<\/li><li>P<sub>1<\/sub> ⊕ P<sub>2<\/sub> keeps the redundancy of language, so 'crib dragging' (guessing common words in one message) reveals the other message.<\/li><li>If the attacker knows or guesses either plaintext, the key is recovered at once (K = P<sub>1<\/sub> ⊕ C<sub>1<\/sub>) and the other message falls too. Perfect secrecy only holds when the key is used <b>once<\/b>.<\/li><\/ol>", "k": "theory", "d": null, "id": 250}, {"t": "classical", "src": ["T1E Q1(f)"], "m": 4, "q": "Using the Vigenère cipher with A = 0, …, Z = 25, encrypt the plaintext DATA using the key KEY. Show your workings.", "a": "<div class=\"ans\"><b>Answer:<\/b> Ciphertext = <b>NERK<\/b><\/div><ol class=\"steps\"><li>Repeat the key under the plaintext: D A T A / K E Y K.<\/li><li>C<sub>i<\/sub> = (P<sub>i<\/sub> + K<sub>i<\/sub>) mod 26:<\/li><\/ol><div class=\"tw\"><table class=\"wt\"><thead><tr><th>letter<\/th><th>value<\/th><th>key<\/th><th>value<\/th><th>sum<\/th><th>mod 26<\/th><th>result<\/th><\/tr><\/thead><tbody><tr><td>d<\/td><td>3<\/td><td>k<\/td><td>10<\/td><td>3+10 = 13<\/td><td>13<\/td><td>n<\/td><\/tr><tr><td>a<\/td><td>0<\/td><td>e<\/td><td>4<\/td><td>0+4 = 4<\/td><td>4<\/td><td>e<\/td><\/tr><tr><td>t<\/td><td>19<\/td><td>y<\/td><td>24<\/td><td>19+24 = 43<\/td><td>17<\/td><td>r<\/td><\/tr><tr><td>a<\/td><td>0<\/td><td>k<\/td><td>10<\/td><td>0+10 = 10<\/td><td>10<\/td><td>k<\/td><\/tr><\/tbody><\/table><\/div>", "k": "calc", "d": null, "id": 251}, {"t": "nt", "src": ["T1E Q2(a)"], "m": 5, "q": "Determine the multiplicative inverse of 19 (mod 43) using the Extended Euclidean Algorithm. Your answer must show the Euclidean steps and the back-substitution used to obtain the inverse.", "a": "<div class=\"ans\"><b>Answer:<\/b> 19<sup>−1<\/sup> ≡ 34 (mod 43)<\/div><h4>Euclidean steps<\/h4><ol class=\"steps\"><li>43 = 2 × 19 + 5<\/li><li>19 = 3 × 5 + 4<\/li><li>5 = 1 × 4 + 1<\/li><li>4 = 4 × 1 + 0 ⇒ gcd = 1, so the inverse exists<\/li><\/ol><h4>Back-substitution<\/h4><ol class=\"steps\"><li>1 = 5 − 1 × 4<\/li><li>&nbsp;&nbsp;= 5 − (19 − 3 × 5) = 4 × 5 − 19<\/li><li>&nbsp;&nbsp;= 4 × (43 − 2 × 19) − 19 = 4 × 43 − 9 × 19<\/li><li>So −9 × 19 ≡ 1 (mod 43) ⇒ 19<sup>−1<\/sup> ≡ −9 ≡ <b>34<\/b> (mod 43)<\/li><li>Check: 19 × 34 = 646 = 15 × 43 + 1 ✓<\/li><\/ol>", "k": "calc", "d": null, "id": 252}, {"t": "nt", "src": ["T1E Q2(b)"], "m": 4, "q": "Compute 7<sup>23<\/sup> (mod 19).", "a": "<div class=\"ans\"><b>Answer:<\/b> 7<sup>23<\/sup> ≡ 11 (mod 19)<\/div><ol class=\"steps\"><li>19 is prime and gcd(7, 19) = 1 ⇒ Fermat: 7<sup>18<\/sup> ≡ 1 (mod 19).<\/li><li>23 = 1 × 18 + 5 ⇒ 7<sup>23<\/sup> = 7<sup>18<\/sup> × 7<sup>5<\/sup> ≡ 7<sup>5<\/sup> (mod 19).<\/li><li>7<sup>2<\/sup> = 49 = 2 × 19 + 11 ≡ 11<\/li><li>7<sup>4<\/sup> ≡ 11<sup>2<\/sup> = 121 = 6 × 19 + 7 ≡ 7<\/li><li>7<sup>5<\/sup> = 7<sup>4<\/sup> × 7 ≡ 7 × 7 = 49 ≡ <b>11<\/b> (mod 19)<\/li><li>(Shortcut: 7<sup>3<\/sup> = 343 = 18 × 19 + 1 ≡ 1, so 7<sup>23<\/sup> = (7<sup>3<\/sup>)<sup>7<\/sup> × 7<sup>2<\/sup> ≡ 11 too.)<\/li><\/ol>", "k": "calc", "d": null, "id": 253}, {"t": "nt", "src": ["T1E Q2(c)"], "m": 6, "q": "Consider the set G = {1, 3, 5, 7} under multiplication modulo 8.<br>i. Construct the multiplication table for G. [3]<br>ii. Using your table, determine whether G forms an Abelian group under multiplication modulo 8. Justify your answer by referring to the appropriate group properties. [3]", "a": "<div class=\"ans\"><b>Answer:<\/b> Yes — G is an Abelian group (every element is its own inverse).<\/div><h4>i.<\/h4><div class=\"tw\"><table class=\"wt\"><thead><tr><th>× mod 8<\/th><th>1<\/th><th>3<\/th><th>5<\/th><th>7<\/th><\/tr><\/thead><tbody><tr><td><b>1<\/b><\/td><td>1<\/td><td>3<\/td><td>5<\/td><td>7<\/td><\/tr><tr><td><b>3<\/b><\/td><td>3<\/td><td>1<\/td><td>7<\/td><td>5<\/td><\/tr><tr><td><b>5<\/b><\/td><td>5<\/td><td>7<\/td><td>1<\/td><td>3<\/td><\/tr><tr><td><b>7<\/b><\/td><td>7<\/td><td>5<\/td><td>3<\/td><td>1<\/td><\/tr><\/tbody><\/table><\/div><p>e.g. 3 × 5 = 15 = 8 + 7 ≡ 7; 5 × 7 = 35 = 4 × 8 + 3 ≡ 3; 7 × 7 = 49 = 6 × 8 + 1 ≡ 1.<\/p><h4>ii.<\/h4><ol class=\"steps\"><li><b>Closure:<\/b> every entry in the table is in {1, 3, 5, 7} ✓<\/li><li><b>Associativity:<\/b> inherited from ordinary integer multiplication ✓<\/li><li><b>Identity:<\/b> 1 — its row and column copy the headings ✓<\/li><li><b>Inverses:<\/b> 1 appears in every row; each element is its own inverse (1·1 = 3·3 = 5·5 = 7·7 ≡ 1) ✓<\/li><li><b>Commutative:<\/b> the table is symmetric about the main diagonal (a·b = b·a) ✓<\/li><li>⇒ (G, × mod 8) is an <b>Abelian group<\/b>.<\/li><\/ol>", "k": "calc", "d": null, "id": 254}, {"t": "nt", "src": ["T1E Q2(d)(e)"], "m": 9, "q": "d) Let m(x) = x<sup>4<\/sup> + x + 1 be the irreducible polynomial used to define GF(2<sup>4<\/sup>). Compute (x<sup>3<\/sup> + x + 1)(x<sup>2<\/sup> + 1) mod m(x). Express your final answer as a polynomial and as a 4-bit binary value. [6]<br>e) Explain why the polynomial used as the modulus in constructing GF(2<sup>n<\/sup>) must be irreducible. What problem would arise if a reducible polynomial were used instead? [3]", "a": "<div class=\"ans\"><b>Answer:<\/b> d) = 1 (polynomial 1, binary 0001) &nbsp; e) Otherwise some elements have no inverse (zero divisors), so it isn't a field.<\/div><h4>d)<\/h4><ol class=\"steps\"><li>Multiply: (x<sup>3<\/sup> + x + 1)(x<sup>2<\/sup> + 1) = x<sup>5<\/sup> + x<sup>3<\/sup> + x<sup>3<\/sup> + x + x<sup>2<\/sup> + 1<\/li><li>Coefficients mod 2: x<sup>3<\/sup> + x<sup>3<\/sup> = 0 ⇒ x<sup>5<\/sup> + x<sup>2<\/sup> + x + 1<\/li><li>Reduce with x<sup>4<\/sup> ≡ x + 1: x<sup>5<\/sup> = x · x<sup>4<\/sup> ≡ x(x + 1) = x<sup>2<\/sup> + x<\/li><li>⇒ (x<sup>2<\/sup> + x) + x<sup>2<\/sup> + x + 1 = <b>1<\/b><\/li><li>Answer: polynomial <b>1<\/b>, binary <b>0001<\/b>. (So x<sup>3<\/sup> + x + 1 and x<sup>2<\/sup> + 1 are inverses of each other in GF(2<sup>4<\/sup>).)<\/li><\/ol><h4>e)<\/h4><ol class=\"steps\"><li>An irreducible polynomial plays the role of a prime: it can't be factored, so every non-zero polynomial of lower degree has a multiplicative inverse ⇒ we get a field.<\/li><li>With a reducible modulus, e.g. m(x) = a(x)·b(x), we get a(x)·b(x) ≡ 0 although neither is 0 — <b>zero divisors<\/b> — and a(x), b(x) have no inverses.<\/li><li>Then division fails: AES/S-AES operations like the S-box (which uses inverses) and InvMixColumns couldn't be computed or undone, so decryption would break. It's like working mod 6 instead of mod 7.<\/li><\/ol>", "k": "calc", "d": null, "id": 255}, {"t": "block", "src": ["T1E Q3(a)"], "m": 4, "q": "In S-DES, use P10 = (3,5,2,7,4,10,1,9,8,6) and P8 = (6,3,7,4,8,5,10,9). For the key K = 1101010011, derive K1. Show all permutation, splitting and circular-shift steps.", "a": "<div class=\"ans\"><b>Answer:<\/b> K1 = <b>10110011<\/b><\/div><ol class=\"steps\"><li>Key bits k1…k10 = 1 1 0 1 0 1 0 0 1 1<\/li><li>P10 = (k3, k5, k2, k7, k4, k10, k1, k9, k8, k6) = (0, 0, 1, 0, 1, 1, 1, 1, 0, 1) = <b>0010111101<\/b><\/li><li>Split: left = 00101, right = 11101<\/li><li>LS-1 on each half: 00101 → 01010; 11101 → 11011 ⇒ 0101011011<\/li><li>P8 = (bit6, 3, 7, 4, 8, 5, 10, 9) of 0101011011 = (1, 0, 1, 1, 0, 0, 1, 1) ⇒ <b>K1 = 10110011<\/b><\/li><\/ol>", "k": "calc", "d": "sdeskey", "id": 256}, {"t": "block", "src": ["T1E Q3(b)"], "m": 7, "q": "Suppose the output from the initial permutation of an S-DES plaintext is IP(P) = 10110110 and the first subkey is K1 = 10100100. Use E/P = (4,1,2,3,2,3,4,1) and P4 = (2,4,3,1), and the S-boxes S0 = [1 0 3 2; 3 2 1 0; 0 2 1 3; 3 1 3 2], S1 = [0 1 2 3; 2 0 1 3; 3 0 1 0; 2 1 0 3]. Determine the output of the first f<sub>K<\/sub> operation.", "a": "<div class=\"ans\"><b>Answer:<\/b> f<sub>K<\/sub> output = <b>0100 0110<\/b><\/div><ol class=\"steps\"><li>f<sub>K<\/sub>(L, R) = (L ⊕ F(R, K1), R). Split IP(P): L = 1011, R = 0110.<\/li><li>E/P on R (bits n1 n2 n3 n4 = 0 1 1 0): take n4, n1, n2, n3, n2, n3, n4, n1 = 0 0 1 1 1 1 0 0 ⇒ <b>00111100<\/b><\/li><li>XOR with K1: 00111100 ⊕ 10100100 = <b>10011000<\/b><\/li><li>Left 4 bits 1001 → S0: row = bits 1 & 4 = 11 = 3, column = bits 2 & 3 = 00 = 0 ⇒ S0[3][0] = 3 = <b>11<\/b><\/li><li>Right 4 bits 1000 → S1: row = 10 = 2, column = 00 = 0 ⇒ S1[2][0] = 3 = <b>11<\/b><\/li><li>S-box output = 1111; P4 = (2,4,3,1) ⇒ 1111 ⇒ F(R, K1) = <b>1111<\/b><\/li><li>L ⊕ F = 1011 ⊕ 1111 = <b>0100<\/b>; R stays 0110<\/li><li>f<sub>K<\/sub> output = <b>0100 0110<\/b> (next step SW would swap the halves).<\/li><\/ol>", "k": "calc", "d": null, "id": 257}, {"t": "aes", "src": ["T1E Q3(c)"], "m": 13, "q": "Consider the S-AES state after the SubNib transformation: [9 4 ; A 7].<br>i. Apply the ShiftRow transformation and give the resulting state. [2]<br>ii. Using the MixColumns matrix [1 4 ; 4 1] and the irreducible polynomial m(x) = x<sup>4<\/sup> + x + 1, compute the transformed first column of the state. Show the finite-field arithmetic. [5]<br>iii. Explain the purpose of AddRoundKey in S-AES. [2]<br>iv. Which transformation is not performed in the final AES round, and why? [2]<br>v. Give the rationale behind multiple versions of AES. [2]", "a": "<div class=\"ans\"><b>Answer:<\/b> i. [9 4 ; 7 A] &nbsp; ii. first column = (6, 5)<\/div><h4>i. ShiftRows (row 0 unchanged, row 1 swaps its nibbles)<\/h4><table class=\"st\"><tr><td>9<br><small>1001<\/small><\/td><td>4<br><small>0100<\/small><\/td><\/tr><tr><td>7<br><small>0111<\/small><\/td><td>A<br><small>1010<\/small><\/td><\/tr><\/table><h4>ii. MixColumns on column (9, 7)<\/h4><ol class=\"steps\"><li>S′<sub>0,0<\/sub> = 1·9 ⊕ 4·7, &nbsp; S′<sub>1,0<\/sub> = 4·9 ⊕ 1·7<\/li><li><b>4·7<\/b> (x<sup>2<\/sup> × (x<sup>2<\/sup> + x + 1)):<\/li><li>(x<sup>2<\/sup>) × (x<sup>2<\/sup> + x + 1)<\/li><li>(x<sup>2<\/sup>) + (x<sup>3<\/sup>) + (x<sup>4<\/sup>) &nbsp;(add = XOR, coefficients mod 2)<\/li><li>= x<sup>4<\/sup> + x<sup>3<\/sup> + x<sup>2<\/sup> &nbsp; (degree ≥ 4, reduce mod x<sup>4<\/sup> + x + 1)<\/li><li>Using x<sup>4<\/sup> + x + 1 = 0 ⇒ x<sup>4<\/sup> = x + 1<\/li><li>x<sup>4<\/sup> term: XOR with x<sup>0<\/sup>·(x<sup>4<\/sup> + x + 1) = x<sup>4<\/sup> + x + 1 ⇒ x<sup>3<\/sup> + x<sup>2<\/sup> + x + 1<\/li><li>Result = x<sup>3<\/sup> + x<sup>2<\/sup> + x + 1 = 1111<sub>2<\/sub> = F<sub>16<\/sub><\/li><li><b>4·9<\/b> (x<sup>2<\/sup> × (x<sup>3<\/sup> + 1)):<\/li><li>(x<sup>2<\/sup>) × (x<sup>3<\/sup> + 1)<\/li><li>(x<sup>2<\/sup>) + (x<sup>5<\/sup>) &nbsp;(add = XOR, coefficients mod 2)<\/li><li>= x<sup>5<\/sup> + x<sup>2<\/sup> &nbsp; (degree ≥ 4, reduce mod x<sup>4<\/sup> + x + 1)<\/li><li>Using x<sup>4<\/sup> + x + 1 = 0 ⇒ x<sup>4<\/sup> = x + 1<\/li><li>x<sup>5<\/sup> term: XOR with x<sup>1<\/sup>·(x<sup>4<\/sup> + x + 1) = x<sup>5<\/sup> + x<sup>2<\/sup> + x ⇒ x<\/li><li>Result = x = 0010<sub>2<\/sub> = 2<sub>16<\/sub><\/li><li>S′<sub>0,0<\/sub> = 1001 ⊕ 1111 = <b>0110 = 6<\/b><\/li><li>S′<sub>1,0<\/sub> = 0010 ⊕ 0111 = <b>0101 = 5<\/b><\/li><li>Transformed first column = (6, 5)<\/li><\/ol><h4>iii.<\/h4><p>AddRoundKey XORs the state with the round key — it's the only step that uses the key, so it makes the output depend on the secret key. All other steps are fixed and public; without it anyone could reverse them.<\/p><h4>iv.<\/h4><p><b>MixColumns<\/b> is left out of the final round. Being linear, a final MixColumns could be undone by anyone without the key (it adds no security), and dropping it makes encryption and decryption structurally symmetric/simpler.<\/p><h4>v.<\/h4><p>AES-128/192/256 let users trade speed for security margin: 128 is fast and secure for most uses; 192/256 (with 12/14 rounds) give extra protection for long-term or highly sensitive data and future threats.<\/p>", "k": "calc", "d": "saesround", "id": 258}, {"t": "modes", "src": ["T2C Q1(a)(b)"], "m": 5, "q": "a) A database contains many records with identical 128-bit plaintext blocks. Explain why encrypting the records using ECB mode could reveal information about the data, even if AES itself is secure. [2]<br>b) Two AES-CTR files are encrypted with the same key and initial counter. Would CTR mode provide better security compared to (a)? Explain. [3]", "a": "<div class=\"ans\"><b>Answer:<\/b> a) ECB maps equal plaintext blocks to equal ciphertext blocks. b) No — reusing key + counter reuses the key-stream, so C<sub>1<\/sub> ⊕ C<sub>2<\/sub> = P<sub>1<\/sub> ⊕ P<sub>2<\/sub>; that's worse.<\/div><h4>a)<\/h4><p>ECB encrypts each block independently with the same key: C = E(K, P). Identical records give identical ciphertext blocks, so an attacker sees which records are the same, how often values repeat, and patterns — without breaking AES.<\/p><h4>b)<\/h4><ol class=\"steps\"><li>CTR is only secure if each (key, counter) pair is used once. Same key + same starting counter ⇒ same key-stream O<sub>i<\/sub> for both files.<\/li><li>C<sub>1<\/sub> ⊕ C<sub>2<\/sub> = (P<sub>1<\/sub> ⊕ O) ⊕ (P<sub>2<\/sub> ⊕ O) = P<sub>1<\/sub> ⊕ P<sub>2<\/sub> — like a reused one-time pad.<\/li><li>If any part of one file is known, the same part of the other is revealed. So it's <b>not<\/b> better than ECB here — it's arguably worse; use a fresh nonce/IV per file.<\/li><\/ol>", "k": "theory", "d": "ctr", "id": 259}, {"t": "modes", "src": ["T2C Q1(c)"], "m": 6, "q": "Consider a simplified CBC encryption scheme using 8-bit blocks. The block cipher E<sub>K<\/sub>(M) performs LS-2 (same as in S-DES) on the entire block. IV = 10101101, P<sub>1<\/sub> = 10001010, P<sub>2<\/sub> = 11100101. Using C<sub>i<\/sub> = E<sub>K<\/sub>(P<sub>i<\/sub> ⊕ C<sub>i−1<\/sub>), calculate C<sub>1<\/sub> and C<sub>2<\/sub>.", "a": "<div class=\"ans\"><b>Answer:<\/b> C<sub>1<\/sub> = <b>10011100<\/b>, C<sub>2<\/sub> = <b>11100101<\/b><\/div><ol class=\"steps\"><li><b>C<sub>1<\/sub>:<\/b> P<sub>1<\/sub> ⊕ IV = 10001010 ⊕ 10101101 = <b>00100111<\/b><\/li><li>LS-2 (rotate the whole 8 bits left by 2): 00100111 → 10011100 ⇒ <b>C<sub>1<\/sub> = 10011100<\/b><\/li><li><b>C<sub>2<\/sub>:<\/b> P<sub>2<\/sub> ⊕ C<sub>1<\/sub> = 11100101 ⊕ 10011100 = <b>01111001<\/b><\/li><li>LS-2: 01111001 → 11100101 ⇒ <b>C<sub>2<\/sub> = 11100101<\/b><\/li><li>(Coincidence: C<sub>2<\/sub> equals P<sub>2<\/sub> here — fine, just how these numbers fall.)<\/li><\/ol>", "k": "calc", "d": "cbc", "id": 260}, {"t": "pk", "src": ["T2C Q2(a)"], "m": 14, "q": "A student generates an RSA key pair using p = 17, q = 19 and chooses e = 5.<br>i. Verify that e is a valid public exponent and determine the public key. [3]<br>ii. Determine the private exponent d. [5]<br>iii. Encrypt the message m = 7 using RSA. Show the modular calculations. [4]<br>iv. Explain why RSA encryption should use a secure encoding scheme such as OAEP rather than directly applying the RSA operation to a short message. [2]", "a": "<div class=\"ans\"><b>Answer:<\/b> i. PU = {5, 323} &nbsp; ii. d = 173 &nbsp; iii. c = 11<\/div><h4>i.<\/h4><ol class=\"steps\"><li>n = 17 × 19 = <b>323<\/b>; φ(n) = 16 × 18 = <b>288<\/b> = 2<sup>5<\/sup> × 3<sup>2<\/sup>.<\/li><li>1 &lt; 5 &lt; 288 and gcd(5, 288) = 1 (5 isn't a factor of 288) ⇒ e = 5 is valid.<\/li><li>Public key PU = {e, n} = <b>{5, 323}<\/b>.<\/li><\/ol><h4>ii. d = 5<sup>−1<\/sup> mod 288<\/h4><ol class=\"steps\"><li>288 = 57 × 5 + 3<\/li><li>5 = 1 × 3 + 2<\/li><li>3 = 1 × 2 + 1<\/li><li>1 = 3 − 2 = 3 − (5 − 3) = 2 × 3 − 5 = 2(288 − 57 × 5) − 5 = 2 × 288 − 115 × 5<\/li><li>⇒ d ≡ −115 ≡ <b>173<\/b> (mod 288). Check: 5 × 173 = 865 = 3 × 288 + 1 ✓<\/li><li>Private key PR = {173, 323}<\/li><\/ol><h4>iii. c = 7<sup>5<\/sup> mod 323<\/h4><ol class=\"steps\"><li>7<sup>2<\/sup> = 49<\/li><li>7<sup>4<\/sup> = 49<sup>2<\/sup> = 2401 = 7 × 323 + 140 ≡ 140<\/li><li>7<sup>5<\/sup> = 140 × 7 = 980 = 3 × 323 + 11 ≡ <b>11<\/b><\/li><li>Ciphertext <b>c = 11<\/b><\/li><\/ol><h4>iv.<\/h4><p>Textbook RSA is deterministic (same m ⇒ same c, so short guessable messages can be found by encrypting every guess), and for tiny m with small e, m<sup>e<\/sup> may be smaller than n so c is just m<sup>e<\/sup> (take the e-th root). It's also malleable. OAEP adds randomness and padding so each encryption is different and these attacks fail.<\/p>", "k": "calc", "d": null, "id": 261}, {"t": "hash", "src": ["T2C Q2(b)"], "m": 8, "q": "A university signs an official examination timetable digitally and uploads it to its website. The university public key is distributed through a certificate signed by DigiCert (trusted CA).<br>i. Explain how a student can verify the timetable's authenticity and integrity using the signature and certificate. [4]<br>ii. The timetable has a valid signature, but its examination dates are wrong due to an administrative mistake. Will the signature help establish the accuracy of the information? Explain. [2]<br>iii. An attacker replaces the certificate with one containing the attacker's public key and signs a forged timetable. Would the forgery be detected? Explain. [2]", "a": "<div class=\"ans\"><b>Answer:<\/b> i. Check the certificate with DigiCert's public key, then verify the signature with the university's public key. ii. No. iii. Yes — the fake certificate won't verify against DigiCert.<\/div><h4>i.<\/h4><ol class=\"steps\"><li>Verify the certificate: check DigiCert's signature on it using DigiCert's public key (already trusted in the browser/OS), plus validity dates and revocation ⇒ the public key really belongs to the university.<\/li><li>Hash the downloaded timetable: h<sub>1<\/sub> = H(timetable).<\/li><li>Decrypt/verify the signature with the university's public key: h<sub>2<\/sub> = s<sup>e<\/sup> mod n (or the scheme's verify).<\/li><li>h<sub>1<\/sub> = h<sub>2<\/sub> ⇒ authentic (only the university's private key could sign) and unchanged (integrity).<\/li><\/ol><h4>ii.<\/h4><p><b>No.<\/b> A signature only proves <i>who<\/i> signed and that the document hasn't changed since signing. It says nothing about whether the content is correct — the university signed the wrong dates, and the signature faithfully confirms that.<\/p><h4>iii.<\/h4><p><b>Yes.<\/b> The attacker can't get DigiCert to sign a certificate binding the university's name to his key, so his certificate fails verification against DigiCert's public key (or isn't issued by a trusted CA). The student rejects it, so the forged timetable is detected.<\/p>", "k": "theory", "d": "sigconf", "id": 262}, {"t": "pk", "src": ["T2C Q2(c)"], "m": 5, "q": "Alice and Bob use unauthenticated Diffie–Hellman on a network monitored by an active attacker. Explain one attack the adversary can mount. State how a Schnorr proof of knowledge tied to a trusted identity could help authenticate a participant. [2,3]", "a": "<div class=\"ans\"><b>Answer:<\/b> Man-in-the-middle: the attacker swaps in his own D-H values and shares a key with each side. A Schnorr proof lets a participant prove they know the private key behind their certified public key, without revealing it.<\/div><h4>Attack<\/h4><p><b>Man-in-the-middle:<\/b> Darth intercepts Y<sub>A<\/sub> and Y<sub>B<\/sub>, sends his own Y<sub>D<\/sub> to each, and ends up with K<sub>AD<\/sub> with Alice and K<sub>BD<\/sub> with Bob. He decrypts, reads/alters and re-encrypts all traffic.<\/p><h4>Schnorr proof of knowledge<\/h4><ol class=\"steps\"><li>Each participant has a long-term key pair y = g<sup>x<\/sup> mod p whose public key y is bound to their identity by a trusted certificate.<\/li><li>Proof: prover picks random r, sends commitment t = g<sup>r<\/sup>; verifier sends a random challenge c (or c = H(t, D-H values, IDs)); prover replies s = r + c·x mod q.<\/li><li>Verifier checks g<sup>s<\/sup> ≡ t · y<sup>c<\/sup> (mod p). Only someone who knows x can answer, but x is never revealed (zero-knowledge).<\/li><li>Binding the challenge to the exchanged D-H values ties the proof to <i>this<\/i> session, so Darth can't substitute his own values without failing the proof ⇒ the participant is authenticated and MITM is blocked.<\/li><\/ol>", "k": "theory", "d": "dhmitm", "id": 263}, {"t": "hash", "src": ["T2C Q3(a)"], "m": 7, "q": "A security engineer proposes using a 128-bit cryptographic hash instead of a 512-bit hash for identifying large numbers of archived files.<br>i. Estimate the number of randomly generated files needed for a roughly 50% chance of at least one hash collision. Explain the rationale. [3]<br>ii. Distinguish collision resistance from second-preimage resistance in the context of this application. [2]<br>iii. An attacker can modify both a downloaded file and the SHA-256 digest displayed beside it on the same compromised website. Explain why the matching digest does not ensure the integrity of the download. [2]", "a": "<div class=\"ans\"><b>Answer:<\/b> i. About 2<sup>64<\/sup> ≈ 1.8 × 10<sup>19<\/sup> files (≈ 1.18 × 2<sup>64<\/sup> ≈ 2.2 × 10<sup>19<\/sup> for exactly 50%). iii. The attacker controls both, so he just publishes the hash of his modified file.<\/div><h4>i.<\/h4><ol class=\"steps\"><li>Birthday paradox: with N = 2<sup>n<\/sup> possible hash values, a collision becomes ~50% likely after about √N = 2<sup>n/2<\/sup> items (more precisely ≈ 1.18√N).<\/li><li>n = 128 ⇒ 2<sup>64<\/sup> ≈ 1.8 × 10<sup>19<\/sup> files (≈ 2.2 × 10<sup>19<\/sup> for 50%).<\/li><li>For a 512-bit hash it would be 2<sup>256<\/sup> — so 128 bits gives only 64-bit collision security, much weaker than it looks.<\/li><\/ol><h4>ii.<\/h4><ol class=\"steps\"><li><b>Collision resistance:<\/b> hard to find <i>any<\/i> two different files with the same hash — e.g. an attacker crafting two files (one harmless, one malicious) that get the same archive ID. Costs ~2<sup>n/2<\/sup>.<\/li><li><b>Second-preimage resistance:<\/b> given a <i>specific existing<\/i> archived file, hard to find another file with the same hash (to replace it). Costs ~2<sup>n<\/sup>.<\/li><\/ol><h4>iii.<\/h4><p>A hash has no key: the attacker modifies the file, computes SHA-256 of his version and puts that digest on the site. The download matches the displayed digest perfectly. The digest only helps if it comes from a separate trusted channel, or is <b>signed<\/b> by the publisher (or protected with a MAC).<\/p>", "k": "theory", "d": null, "id": 264}, {"t": "keys", "src": ["T2C Q3(b)"], "m": 8, "q": "The MACS department has 36 staff who must securely exchange sensitive data. Two designs: (A) a different symmetric key for every pair of employees; (B) a trusted KDC that shares one long-term secret key with each employee and issues temporary session keys.<br>i. Calculate the number of long-term symmetric keys required by design A and design B. [3]<br>ii. Explain how design B can establish a fresh session key for two employees without transmitting the long-term keys. [3]<br>iii. Identify two security or operational risks of relying on a KDC, and propose one mitigation for either risk. [2]", "a": "<div class=\"ans\"><b>Answer:<\/b> i. A: 36 × 35 / 2 = 630 keys; B: 36 keys<\/div><h4>i.<\/h4><ol class=\"steps\"><li>Design A: one key per pair = n(n − 1)/2 = 36 × 35 / 2 = 1260 / 2 = <b>630<\/b>.<\/li><li>Design B: one master key per employee = <b>36<\/b>.<\/li><\/ol><h4>ii.<\/h4><ol class=\"steps\"><li>A → KDC: ID<sub>A<\/sub> ‖ ID<sub>B<\/sub> ‖ N<sub>1<\/sub> (request with a nonce).<\/li><li>KDC generates a fresh session key K<sub>s<\/sub> and replies E(K<sub>A<\/sub>, [K<sub>s<\/sub> ‖ ID<sub>B<\/sub> ‖ N<sub>1<\/sub> ‖ E(K<sub>B<\/sub>, [K<sub>s<\/sub> ‖ ID<sub>A<\/sub>])]).<\/li><li>A decrypts with its master key K<sub>A<\/sub>, gets K<sub>s<\/sub>, and forwards the inner ticket E(K<sub>B<\/sub>, [K<sub>s<\/sub> ‖ ID<sub>A<\/sub>]) to B, who decrypts it with K<sub>B<\/sub>.<\/li><li>Optional handshake (B sends E(K<sub>s<\/sub>, N<sub>2<\/sub>), A returns E(K<sub>s<\/sub>, f(N<sub>2<\/sub>))) confirms the key and stops replays. The master keys are only ever used for encryption, never sent.<\/li><\/ol><h4>iii.<\/h4><ol class=\"steps\"><li><b>Single point of failure:<\/b> if the KDC is down, nobody can get session keys → mitigate with replicated/backup KDCs.<\/li><li><b>High-value target:<\/b> compromise of the KDC exposes all 36 master keys → harden it (HSM, strict access control, monitoring).<\/li><li>(Also: bottleneck under load; must be fully trusted.)<\/li><\/ol>", "k": "calc", "d": "kdc", "id": 265}, {"t": "keys", "src": ["T2C Q3(c)(d)"], "m": 11, "q": "c) Consider the CA key distribution figure (messages 1–6).<br>i. Explain the purpose of message 5 and how B can verify that the certificate C<sub>A<\/sub> was issued by the trusted CA. [3]<br>ii. Explain the role of a Certificate Revocation List in a CA. [2]<br>d) A website has a digital certificate issued by Intermediate CA X. X was certified by Intermediate CA Y, which was certified by Root CA R.<br>i. Draw the certificate hierarchy, showing the chain of trust from the website to Root CA R. [2]<br>ii. Explain how a web browser uses this certificate chain to establish trust in the website's public key. [2]<br>iii. Would the browser automatically trust Root CA R simply because its certificate is self-signed? Explain.", "a": "<div class=\"ans\"><b>Answer:<\/b> c) i. A sends its certificate to B; B verifies it with the CA's public key PU<sub>auth<\/sub>. d) iii. No — only if R is already in the browser's trusted root store.<\/div><h4>c) i.<\/h4><ol class=\"steps\"><li>Message 5: A sends its certificate C<sub>A<\/sub> straight to B, so B gets A's public key without asking the CA (CA can be offline).<\/li><li>B computes D(PU<sub>auth<\/sub>, C<sub>A<\/sub>) → [Time<sub>1<\/sub> ‖ ID<sub>A<\/sub> ‖ PU<sub>A<\/sub>]. Only the CA's private key PR<sub>auth<\/sub> could produce something that verifies under PU<sub>auth<\/sub> ⇒ issued by the CA.<\/li><li>B also checks ID<sub>A<\/sub>, that Time/validity is current, and that the certificate isn't revoked.<\/li><\/ol><h4>c) ii.<\/h4><p>A <b>CRL<\/b> is a list, signed and published regularly by the CA, of serial numbers of certificates revoked before their expiry (key compromised, details changed, issued in error). Users check it (or OCSP) before trusting a certificate.<\/p><h4>d) i.<\/h4><div class=\"tw\"><table class=\"wt\"><thead><tr><th>Level<\/th><th>Certificate<\/th><th>Signed by<\/th><\/tr><\/thead><tbody><tr><td>1 (trust anchor)<\/td><td>Root CA R (self-signed)<\/td><td>R itself<\/td><\/tr><tr><td>2<\/td><td>Intermediate CA Y<\/td><td>R<\/td><\/tr><tr><td>3<\/td><td>Intermediate CA X<\/td><td>Y<\/td><\/tr><tr><td>4 (leaf)<\/td><td>Website<\/td><td>X<\/td><\/tr><\/tbody><\/table><\/div><h4>d) ii.<\/h4><ol class=\"steps\"><li>The site sends its certificate plus the intermediates (X, Y).<\/li><li>The browser verifies each signature upward: website cert with X's public key, X's cert with Y's key, Y's cert with R's key — checking names, validity dates, revocation and that each issuer is allowed to be a CA.<\/li><li>The chain ends at R, which is in the browser's trusted root store ⇒ the website's public key is trusted (and the hostname must match).<\/li><\/ol><h4>d) iii.<\/h4><p><b>No.<\/b> Anyone can make a self-signed certificate, so self-signing proves nothing. The browser trusts R only because R's certificate was <i>pre-installed<\/i> in its trusted root store (by the OS/browser vendor after audits). A self-signed root not in the store triggers a warning.<\/p>", "k": "theory", "d": "chain", "id": 266}]};

/* ---------------- diagrams (small drawing DSL) ---------------- */
function esc(s){return String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;")}
function B(x,y,w,h,t,c){return `<rect x="${x}" y="${y}" width="${w}" height="${h}" rx="6" class="${c||'bx'}"/><text x="${x+w/2}" y="${y+h/2+4.5}" text-anchor="middle" class="tx">${t}</text>`}
function A(x1,y1,x2,y2,lab,dx,dy,dash){return `<line x1="${x1}" y1="${y1}" x2="${x2}" y2="${y2}" class="ln" ${dash?'stroke-dasharray="4 3"':''} marker-end="url(#ah)"/>`+(lab?`<text x="${(x1+x2)/2+(dx||0)}" y="${(y1+y2)/2+(dy||-4)}" text-anchor="middle" class="lb">${lab}</text>`:"")}
function L(pts,arrow){return `<polyline points="${pts}" class="ln" fill="none" ${arrow?'marker-end="url(#ah)"':''}/>`}
function X(x,y){return `<circle cx="${x}" cy="${y}" r="10" class="xo"/><text x="${x}" y="${y+5}" text-anchor="middle" class="tx" style="font-size:16px">⊕</text>`}
function T(x,y,t,anchor,cls){return `<text x="${x}" y="${y}" text-anchor="${anchor||'middle'}" class="${cls||'lb'}">${t}</text>`}
function vchain(x,y,w,labs,step,cls){let s="";labs.forEach((l,i)=>{const c=Array.isArray(l)?l[1]:cls; const t=Array.isArray(l)?l[0]:l; s+=B(x,y+i*step,w,24,t,c); if(i<labs.length-1) s+=A(x+w/2,y+i*step+24,x+w/2,y+(i+1)*step);});return s}
function seq(actors,msgs,y0,step,w){let s="";const H=y0+msgs.length*step+10;actors.forEach(a=>{s+=B(a.x-55,8,110,26,a.n,"hd");s+=`<line x1="${a.x}" y1="34" x2="${a.x}" y2="${H}" class="ll"/>`});
  msgs.forEach((m,i)=>{const f=actors[m[0]].x,t=actors[m[1]].x,y=y0+i*step;s+=A(f,y,t+(t>f?-2:2),y);s+=T((f+t)/2,y-5,m[2]);});return s}

/* ---------------- rendering ---------------- */
const main = document.getElementById("main");
function filtered(list){
  const s=state.q.trim().toLowerCase();
  return list.filter(q=>(!state.calcOnly||q.k==="calc")&&(!state.hideDone||!done[q.id])&&(!s||s.split(/\s+/).every(w=>q.text.includes(w))));
}
function cardHTML(q,n){
  const chips=q.src.map(s=>{const c=s.split(" ")[0];return `<button class="chip" data-paper="${c}" title="${esc(PAP[c].name)}">${esc(s)}</button>`}).join("");
  const kind=q.k==="calc"?"calculation":q.k==="mcq"?"multiple choice":"theory";
  let body=`<div class="q">${q.q}</div>`;
  if(q.k==="mcq"){
    const multi=Array.isArray(q.c);
    body+=`<div class="opts">${q.opts.map((o,i)=>`<button class="opt" data-i="${i}"><span class="L">${"ABCDE"[i]}</span><span>${o}</span></button>`).join("")}</div><div class="feedback" aria-live="polite"></div>`;
    if(multi) body=body.replace('<div class="opts">','<div class="note">Choose two.</div><div class="opts">');
  }
  const diag=q.d&&DIAG[q.d]?DIAG[q.d]():"";
  const sol=q.k==="mcq"?`<div class="sol" hidden><div class="ans"><b>Answer:</b> ${(Array.isArray(q.c)?q.c:[q.c]).map(i=>"ABCDE"[i]).join(" and ")}</div><p>${q.a}</p></div>`
    :`<div class="sol" hidden>${q.a}${diag}</div>`;
  return `<article class="card ${q.k}${done[q.id]?" done":""}" data-id="${q.id}">
    <div class="meta"><span class="qnum">${n}</span>${chips}<span class="tag">${kind}</span><span class="marks">${q.m?`[${q.m} mark${q.m>1?"s":""}]`:""}</span></div>
    ${body}
    <div class="actions"><button class="btn tog">${q.k==="mcq"?"Show answer":"Show solution"}</button>
    <button class="btn dn" aria-pressed="${!!done[q.id]}">${done[q.id]?"✓ Done":"Mark as done"}</button></div>
    ${sol}</article>`;
}
function progress(list){const n=list.length,d=list.filter(q=>done[q.id]).length;return {n,d,p:n?Math.round(100*d/n):0}}
function renderNav(){
  const nl=document.getElementById("navlist");let h="";
  if(state.navMode==="topic"){
    h+=`<button class="ni ${state.view==="home"?"on":""}" data-home="1"><b>Overview</b><small>All topics and papers</small></button>`;
    DATA.topics.forEach(t=>{const qs=DATA.qs.filter(q=>q.t===t.id),p=progress(qs);
      h+=`<button class="ni ${state.view==="topic"&&state.key===t.id?"on":""}" data-topic="${t.id}"><b>${t.name}</b><span class="cnt">${p.d}/${p.n}</span><small>${t.sub}</small><span class="bar"><i style="width:${p.p}%"></i></span></button>`});
  } else {
    [["test","Tests"],["exam","Exams & other papers"],["exercise","Exercises"]].forEach(([k,lab])=>{
      h+=`<div class="navgroup">${lab}</div>`;
      DATA.papers.filter(p=>p.kind===k).forEach(p=>{const qs=DATA.qs.filter(q=>q.papers.includes(p.id)),pr=progress(qs);
        h+=`<button class="ni ${state.view==="paper"&&state.key===p.id?"on":""}" data-paper="${p.id}"><b>${p.name}</b><span class="cnt">${pr.d}/${pr.n}</span><span class="bar"><i style="width:${pr.p}%"></i></span></button>`})});
  }
  nl.innerHTML=h;
}
function qOrder(src){const m=src.match(/Q(\d+)(?:\.(\d+))?(?:\(([a-z]))?/);return m?(+m[1])*10000+(+(m[2]||0))*100+(m[3]?m[3].charCodeAt(0)-96:0):0}
function render(){
  renderNav();
  let h="";
  if(state.view==="tools"){main.innerHTML=toolsHTML();bindTools();return;}
  if(state.view==="home"){
    const all=DATA.qs,p=progress(all);
    h+=`<div class="vhead"><h2>CS4542 Cryptography question bank</h2><p>Every question from your tests, exams and exercises, with worked solutions.</p></div>
    <div class="stats"><span><b>${all.length}</b>questions</span><span><b>${all.filter(q=>q.k==="calc").length}</b>with calculations</span><span><b>${DATA.papers.length}</b>papers &amp; exercises</span><span><b>${p.p}%</b>marked done</span></div>
    <div class="home">${DATA.topics.map(t=>{const qs=all.filter(q=>q.t===t.id),pr=progress(qs);return `<button class="tile" data-topic="${t.id}"><b>${t.name}</b><span>${t.sub}</span><em>${qs.length} questions · ${pr.p}% done</em></button>`}).join("")}</div>`;
    const s=state.q.trim();
    if(s||state.calcOnly){const list=filtered(all);h+=`<h3>${list.length} matching questions</h3><div class="cards">${list.map((q,i)=>cardHTML(q,i+1)).join("")||'<p class="empty">Nothing matches. Try a shorter search.</p>'}</div>`;}
    main.innerHTML=h;bindCards();return;
  }
  let list,title,sub;
  if(state.view==="topic"){const t=TOP[state.key];list=DATA.qs.filter(q=>q.t===t.id);title=t.name;sub=t.sub;}
  else {const p=PAP[state.key];list=DATA.qs.filter(q=>q.papers.includes(p.id));title=p.name;sub="Questions in paper order. Shared questions show every paper they appear in.";
    list=list.slice().sort((a,b)=>qOrder(a.src.find(s=>s.startsWith(p.id+" "))||"")-qOrder(b.src.find(s=>s.startsWith(p.id+" "))||""));}
  const f=filtered(list),pr=progress(list);
  h+=`<div class="vhead"><div><h2>${title}</h2><p>${sub} · ${list.length} questions · ${pr.d} done</p></div></div>`;
  h+=`<div class="cards">${f.map((q,i)=>cardHTML(q,i+1)).join("")||'<p class="empty">No questions match the current filters.</p>'}</div>`;
  main.innerHTML=h;bindCards();
}
function bindCards(){
  main.querySelectorAll("[data-topic]").forEach(b=>b.onclick=()=>go("topic",b.dataset.topic));
  main.querySelectorAll(".chip").forEach(b=>b.onclick=()=>{state.navMode="paper";setTabs();go("paper",b.dataset.paper)});
  main.querySelectorAll(".card").forEach(c=>{
    const id=+c.dataset.id,q=DATA.qs[id],sol=c.querySelector(".sol"),tog=c.querySelector(".tog");
    tog.onclick=()=>{sol.hidden=!sol.hidden;tog.textContent=sol.hidden?(q.k==="mcq"?"Show answer":"Show solution"):"Hide";};
    c.querySelector(".dn").onclick=e=>{done[id]=!done[id];if(!done[id])delete done[id];saveDone();e.target.textContent=done[id]?"✓ Done":"Mark as done";e.target.setAttribute("aria-pressed",!!done[id]);c.classList.toggle("done",!!done[id]);renderNav();};
    if(q.k==="mcq"){const corr=Array.isArray(q.c)?q.c:[q.c];let picked=[];
      c.querySelectorAll(".opt").forEach(o=>o.onclick=()=>{const i=+o.dataset.i;if(picked.includes(i)||picked.length>=corr.length)return;picked.push(i);
        o.classList.add(corr.includes(i)?"right":"wrong");
        if(picked.length===corr.length){const ok=picked.every(p=>corr.includes(p));c.querySelectorAll(".opt").forEach(x=>{if(corr.includes(+x.dataset.i))x.classList.add("right")});
          c.querySelector(".feedback").innerHTML=(ok?'<b class="g">Correct.</b> ':'<b class="r">Not quite.</b> ')+q.a;}});}
  });
}
function go(view,key){state.view=view;state.key=key||null;const h=view==="home"?"":view==="tools"?"tools":view+"-"+key;try{history.replaceState(null,"",h?"#"+h:location.pathname)}catch(e){}render();window.scrollTo(0,0);}
function fromHash(){const h=location.hash.slice(1);if(h==="tools")return go("tools");const m=h.match(/^(topic|paper)-(.+)$/);if(m&&((m[1]==="topic"&&TOP[m[2]])||(m[1]==="paper"&&PAP[m[2]]))){state.navMode=m[1];setTabs();return go(m[1],m[2]);}go("home");}
function setTabs(){document.getElementById("tabTopic").classList.toggle("on",state.navMode==="topic");document.getElementById("tabPaper").classList.toggle("on",state.navMode==="paper");}
document.getElementById("tabTopic").onclick=()=>{state.navMode="topic";setTabs();renderNav();};
document.getElementById("tabPaper").onclick=()=>{state.navMode="paper";setTabs();renderNav();};
document.getElementById("navlist").onclick=e=>{const b=e.target.closest(".ni");if(!b)return;if(b.dataset.home)go("home");else if(b.dataset.topic)go("topic",b.dataset.topic);else if(b.dataset.paper)go("paper",b.dataset.paper);};
document.getElementById("search").oninput=e=>{state.q=e.target.value;if(state.view==="tools")state.view="home";render();};
function toggleBtn(id,key){const b=document.getElementById(id);b.onclick=()=>{state[key]=!state[key];b.classList.toggle("on",state[key]);b.setAttribute("aria-pressed",state[key]);render();};}
toggleBtn("calcOnly","calcOnly");toggleBtn("hideDone","hideDone");
document.getElementById("showAll").onclick=e=>{const sols=[...main.querySelectorAll(".sol")];const open=sols.some(s=>s.hidden);sols.forEach(s=>s.hidden=!open);main.querySelectorAll(".tog").forEach(t=>t.textContent=open?"Hide":"Show solution");e.target.textContent=open?"Close all solutions":"Open all solutions";};
document.getElementById("goTools").onclick=()=>go("tools");
window.addEventListener("hashchange",fromHash);

/* ---------------- calculators (show workings) ---------------- */
const mod=(a,m)=>((a%m)+m)%m;
function egcd(a,b){let r0=a,r1=b,x0=1,x1=0,y0=0,y1=1,rows=[[ "–",a,1,0],["–",b,0,1]];while(r1!==0){const q=Math.floor(r0/r1);[r0,r1]=[r1,r0-q*r1];[x0,x1]=[x1,x0-q*x1];[y0,y1]=[y1,y0-q*y1];rows.push([q,r1,x1,y1]);}return {g:r0,x:x0,y:y0,rows}}
function tbl(head,rows){return `<div class="tw"><table class="wt"><thead><tr>${head.map(h=>`<th>${h}</th>`).join("")}</tr></thead><tbody>${rows.map(r=>`<tr>${r.map(c=>`<td>${c}</td>`).join("")}</tr>`).join("")}</tbody></table></div>`}
function bigpow(b,e,m){b=BigInt(b);e=BigInt(e);m=BigInt(m);let r=1n;b%=m;while(e>0n){if(e&1n)r=r*b%m;b=b*b%m;e>>=1n;}return r}
function toolsHTML(){return `<div class="vhead"><h2>Calculators</h2><p>Check your own workings. Each tool shows its steps.</p></div>
<section class="tool"><h3>Modular exponentiation (square-and-multiply)</h3><div class="row"><label for="pa">base a<input id="pa" value="4"></label><label for="pe">exponent e<input id="pe" value="38"></label><label for="pm">modulus n<input id="pm" value="19"></label><button class="btn" id="pgo">Compute aᵉ mod n</button></div><div class="out" id="pout"></div></section>
<section class="tool"><h3>Extended Euclid / modular inverse</h3><div class="row"><label for="ea">a<input id="ea" value="17"></label><label for="eb">b<input id="eb" value="101"></label><button class="btn" id="ego">Solve ax + by = gcd</button></div><div class="out" id="eout"></div></section>
<section class="tool"><h3>Chinese Remainder Theorem</h3><div class="row"><label for="cr">pairs "a mod m", comma separated<input id="cr" class="wide" value="4 mod 5, 6 mod 8, 8 mod 9"></label><button class="btn" id="cgo">Solve</button></div><div class="out" id="cout"></div></section>
<section class="tool"><h3>Affine cipher (mod 26)</h3><div class="row"><label for="aa">a<input id="aa" value="9"></label><label for="ab">b<input id="ab" value="2"></label><label for="at">text<input id="at" class="wide" value="UCR"></label><button class="btn" id="aenc">Encrypt</button><button class="btn" id="adec">Decrypt</button></div><div class="out" id="aout"></div></section>
<section class="tool"><h3>Playfair (I/J share a cell, X filler)</h3><div class="row"><label for="pk">keyword<input id="pk" class="wide" value="SECRETIVE"></label><label for="pt">plaintext<input id="pt" class="wide" value="Bob"></label><button class="btn" id="pfgo">Encrypt</button></div><div class="out" id="pfout"></div></section>
<section class="tool"><h3>GF(2ⁿ) multiply</h3><div class="row"><label for="ga">a (hex)<input id="ga" value="A"></label><label for="gb">b (hex)<input id="gb" value="4"></label><label for="gp">field<select id="gp"><option value="19,4">GF(2⁴), x⁴+x+1 (S-AES)</option><option value="283,8">GF(2⁸), x⁸+x⁴+x³+x+1 (AES)</option></select></label><button class="btn" id="ggo">Multiply</button></div><div class="out" id="gout"></div></section>`}
function bindTools(){
  const $=id=>document.getElementById(id);
  $("pgo").onclick=()=>{try{const a=BigInt($("pa").value),e=BigInt($("pe").value),m=BigInt($("pm").value);if(m<2n||e<0n)throw 0;const bits=e.toString(2);let rows=[],cur=a%m,used=[];
    for(let i=0;i<bits.length;i++){if(i>0)cur=cur*cur%m;rows.push([`a^${2n**BigInt(i)}`,cur.toString()]);if((e>>BigInt(i))&1n)used.push(cur);}
    $("pout").innerHTML=`<p>${e} = ${bits}₂</p>`+tbl(["power","mod "+m],rows)+`<p>Multiply the rows for the 1-bits: ${used.join(" × ")} ≡ <b>${bigpow(a,e,m)}</b> (mod ${m})</p>`;}catch(_){$("pout").textContent="Enter whole numbers with n ≥ 2 and e ≥ 0.";}};
  $("ego").onclick=()=>{const a=parseInt($("ea").value),b=parseInt($("eb").value);if(!(a>0&&b>0)){$("eout").textContent="Enter two positive whole numbers.";return;}const r=egcd(a,b);
    $("eout").innerHTML=tbl(["q","r","x","y"],r.rows)+`<p>gcd = <b>${r.g}</b>, x = ${r.x}, y = ${r.y} &nbsp;(check ${a}·${r.x} + ${b}·${r.y} = ${a*r.x+b*r.y})</p>`+(r.g===1?`<p>${a}⁻¹ mod ${b} = <b>${mod(r.x,b)}</b>; ${b}⁻¹ mod ${a} = <b>${mod(r.y,a)}</b></p>`:`<p>gcd ≠ 1, so no inverse.</p>`);};
  $("cgo").onclick=()=>{const pairs=$("cr").value.split(",").map(s=>s.match(/(-?\d+)\s*mod\s*(\d+)/i)).filter(Boolean).map(m=>[+m[1],+m[2]]);if(pairs.length<2){$("cout").textContent='Write pairs like "4 mod 5, 6 mod 8".';return;}
    let M=pairs.reduce((p,[,m])=>p*m,1),rows=[],tot=0;for(const [a,m] of pairs){const Mi=M/m,r=egcd(mod(Mi,m),m);if(r.g!==1){$("cout").textContent="Moduli must be pairwise coprime.";return;}const y=mod(r.x,m);rows.push([m,a,Mi,y,a*Mi*y]);tot+=a*Mi*y;}
    $("cout").innerHTML=`<p>M = ${M}</p>`+tbl(["mᵢ","aᵢ","Mᵢ","yᵢ = Mᵢ⁻¹ mod mᵢ","aᵢMᵢyᵢ"],rows)+`<p>x = ${tot} ≡ <b>${mod(tot,M)}</b> (mod ${M})</p>`;};
  const aff=dec=>{const a=parseInt($("aa").value),b=parseInt($("ab").value),t=$("at").value.toLowerCase().replace(/[^a-z]/g,"");const r=egcd(mod(a,26),26);if(r.g!==1){$("aout").textContent=`gcd(${a}, 26) = ${r.g}, so a has no inverse — not a valid key.`;return;}const ai=mod(r.x,26);let rows=[],o="";
    for(const ch of t){const x=ch.charCodeAt(0)-97,y=dec?mod(ai*(x-b),26):mod(a*x+b,26);rows.push([ch,x,dec?`${ai}(${x}−${b})`:`${a}·${x}+${b}`,y,String.fromCharCode(65+y)]);o+=String.fromCharCode(65+y);}
    $("aout").innerHTML=(dec?`<p>a⁻¹ = ${ai}</p>`:"")+tbl(["in","value","working","mod 26","out"],rows)+`<p>Result: <b class="mono">${o}</b></p>`;};
  $("aenc").onclick=()=>aff(false);$("adec").onclick=()=>aff(true);
  $("pfgo").onclick=()=>{let seen="";for(const c of ($("pk").value+"abcdefghiklmnopqrstuvwxyz").toLowerCase().replace(/j/g,"i"))if(/[a-z]/.test(c)&&!seen.includes(c))seen+=c;
    const pos=c=>{const i=seen.indexOf(c);return [Math.floor(i/5),i%5]};const p=$("pt").value.toLowerCase().replace(/j/g,"i").replace(/[^a-z]/g,"");let dg=[],i=0;
    while(i<p.length){const a=p[i],b=p[i+1];if(!b){dg.push(a+"x");i++}else if(a===b){dg.push(a+"x");i++}else{dg.push(a+b);i+=2}}
    let out="",rows=[];for(const d of dg){const [r1,c1]=pos(d[0]),[r2,c2]=pos(d[1]);let e,rule;if(r1===r2){e=seen[r1*5+(c1+1)%5]+seen[r2*5+(c2+1)%5];rule="same row → right"}else if(c1===c2){e=seen[((r1+1)%5)*5+c1]+seen[((r2+1)%5)*5+c2];rule="same column → below"}else{e=seen[r1*5+c2]+seen[r2*5+c1];rule="rectangle → swap columns"}rows.push([d.toUpperCase(),rule,e.toUpperCase()]);out+=e;}
    $("pfout").innerHTML=`<table class="pf">${[0,1,2,3,4].map(r=>`<tr>${[0,1,2,3,4].map(c=>`<td>${seen[r*5+c]==="i"?"I/J":seen[r*5+c].toUpperCase()}</td>`).join("")}</tr>`).join("")}</table>`+tbl(["digram","rule","cipher"],rows)+`<p>Ciphertext: <b class="mono">${out.toUpperCase()}</b></p>`;};
  $("ggo").onclick=()=>{const [md,n]=$("gp").value.split(",").map(Number),a=parseInt($("ga").value,16),b=parseInt($("gb").value,16);if(isNaN(a)||isNaN(b)||a>=1<<n||b>=1<<n){$("gout").textContent=`Enter hex values below ${(1<<n).toString(16).toUpperCase()}.`;return;}
    let r=0;for(let i=0;i<n;i++)if(b>>i&1)r^=a<<i;const raw=r;for(let i=2*n;i>=n;i--)if(r>>i&1)r^=md<<(i-n);
    const bin=v=>v.toString(2).padStart(n,"0");$("gout").innerHTML=`<p>${bin(a)} × ${bin(b)}: shifted-XOR product = ${raw.toString(2)}₂; reduce mod ${md.toString(2)}₂ ⇒ <b class="mono">${bin(r)} = ${r.toString(16).toUpperCase()}</b></p>`;};
  ["pgo","ego","cgo","aenc","pfgo","ggo"].forEach(id=>$(id).click());
}
fromHash();
</script>

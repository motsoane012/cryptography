>C2 = 1100<\/td><td>D(C2) = 1110<\/td><td>C1 = 1010<\/td><td>P2 = 1110 ⊕ 1010 = <b>0100<\/b><\/td><\/tr><tr><td>C3 = 0000<\/td><td>D(C3) = 1001<\/td><td>C2 = 1100<\/td><td>P3 = 1001 ⊕ 1100 = <b>0101<\/b><\/td><\/tr><tr><td>C4 = 1010<\/td><td>D(C4) = 1111<\/td><td>C3 = 0000<\/td><td>P4 = 1111 ⊕ 0000 = <b>1111<\/b><\/td><\/tr><\/tbody><\/table><\/div><b>CTR<\/b><div class=\"tw\"><table class=\"wt\"><thead><tr><th>block<\/th><th>counter<\/th><th>key-stream E(ctr)<\/th><th>plaintext<\/th><\/tr><\/thead><tbody><tr><td>C1 = 1010<\/td><td>ctr = 0001<\/td><td>E(ctr) = 1111<\/td><td>P1 = 1010 ⊕ 1111 = <b>0101<\/b><\/td><\/tr><tr><td>C2 = 1100<\/td><td>ctr = 0010<\/td><td>E(ctr) = 0111<\/td><td>P2 = 1100 ⊕ 0111 = <b>1011<\/b><\/td><\/tr><tr><td>C3 = 0000<\/td><td>ctr = 0011<\/td><td>E(ctr) = 1110<\/td><td>P3 = 0000 ⊕ 1110 = <b>1110<\/b><\/td><\/tr><tr><td>C4 = 1010<\/td><td>ctr = 0100<\/td><td>E(ctr) = 1011<\/td><td>P4 = 1010 ⊕ 1011 = <b>0001<\/b><\/td><\/tr><\/tbody><\/table><\/div>", "k": "calc", "d": "ctr", "id": 109}, {"t": "modes", "src": ["T1B Q3(d)"], "m": 3, "q": "During the transmission of the 3rd block, an error occurred in the 1st bit. Determine the number of plaintext blocks that will be affected if 8-bit CFB mode is being used in AES.", "a": "<div class=\"ans\"><b>Answer:<\/b> 17 plaintext (8-bit) blocks are affected: block 3 itself plus the next 16.<\/div><ol class=\"steps\"><li>In CFB-8 each 8-bit ciphertext unit is fed back into a 128-bit shift register that is encrypted to make the next key-stream byte.<\/li><li>P<sub>3<\/sub> = C<sub>3<\/sub> ⊕ key-stream: the flipped bit flips the same bit of P<sub>3<\/sub> (1 block, bit error only).<\/li><li>The corrupted C<sub>3<\/sub> then sits in the shift register for 128 / 8 = <b>16<\/b> more steps, garbling P<sub>4<\/sub> … P<sub>19<\/sub> completely.<\/li><li>After 16 shifts it falls out and decryption recovers ⇒ total = 1 + 16 = <b>17 blocks<\/b> (P<sub>3<\/sub> to P<sub>19<\/sub>).<\/li><\/ol>", "k": "calc", "d": "cfb", "id": 110}, {"t": "modes", "src": ["EX25 Q2(d)"], "m": 4, "q": "CTR mode is often described as a stream cipher that is parallelizable. Provide a detailed explanation of how bit-flip attacks on DES ciphertext blocks affect plaintexts in CTR, CBC and CFB-8 modes.", "a": "<div class=\"ans\"><b>Answer:<\/b> CTR: only the same bit flips (perfectly controllable). CBC: the block is garbled and the same bit flips in the next block. CFB-8: same bit flips in that byte, then the next 8 bytes are garbled (DES 64-bit register).<\/div><ol class=\"steps\"><li><b>CTR:<\/b> P<sub>i<\/sub> = C<sub>i<\/sub> ⊕ E(ctr<sub>i<\/sub>). Flipping bit j of C<sub>i<\/sub> flips exactly bit j of P<sub>i<\/sub>; nothing else changes. The attacker can make precise, predictable changes ⇒ needs a MAC.<\/li><li><b>CBC:<\/b> P<sub>i<\/sub> = D(C<sub>i<\/sub>) ⊕ C<sub>i−1<\/sub>. Flipping bit j of C<sub>i<\/sub> makes D(C<sub>i<\/sub>) random ⇒ P<sub>i<\/sub> is completely garbled, and since C<sub>i<\/sub> is XORed into P<sub>i+1<\/sub>, bit j of P<sub>i+1<\/sub> flips exactly. Later blocks are fine (self-recovering after 2 blocks).<\/li><li><b>CFB-8 (DES):<\/b> P<sub>i<\/sub> = C<sub>i<\/sub> ⊕ MSB<sub>8<\/sub>(E(shift register)). The flipped bit flips the same bit in that plaintext byte; the bad byte then stays in the 64-bit shift register for 64/8 = 8 more steps ⇒ the next 8 bytes decrypt to garbage, then it recovers.<\/li><\/ol>", "k": "theory", "d": "ctr", "id": 111}, {"t": "modes", "src": ["EX24 Q3(c)"], "m": 3, "q": "Briefly explain Output Feedback (OFB) mode of operation.", "a": "<div class=\"ans\"><b>Answer:<\/b> OFB turns a block cipher into a synchronous stream cipher: the cipher's output is fed back to make a key-stream that is XORed with the plaintext.<\/div><ol class=\"steps\"><li>O<sub>1<\/sub> = E(K, IV), O<sub>i<\/sub> = E(K, O<sub>i−1<\/sub>); C<sub>i<\/sub> = P<sub>i<\/sub> ⊕ O<sub>i<\/sub>; decryption P<sub>i<\/sub> = C<sub>i<\/sub> ⊕ O<sub>i<\/sub> (uses E, never D).<\/li><li>Key-stream doesn't depend on the plaintext/ciphertext, so it can be pre-computed, and a bit error in C<sub>i<\/sub> affects only that bit of P<sub>i<\/sub> (no error propagation).<\/li><li>IV must be a nonce (never reused with the same key); like CTR, it's malleable — bit flips pass straight through.<\/li><\/ol>", "k": "theory", "d": "ofb", "id": 112}, {"t": "modes", "src": ["T1C Q3(e)", "SUP26 Q2(b)"], "m": 3, "q": "Describe the purpose of the initialization vector (IV) in block cipher modes of operation. Also, explain why the IV is not needed (unnecessary) in ECB. [2,1]", "a": "<div class=\"ans\"><b>Answer:<\/b> The IV randomises the first block so identical messages encrypt differently; ECB has no chaining, so there's nothing for an IV to feed into.<\/div><ol class=\"steps\"><li>The <b>IV<\/b> is a random/unique starting block that is combined with the first plaintext block (CBC, CFB, OFB) or used as the counter start (CTR).<\/li><li>Purpose: make encryption randomised — the same plaintext under the same key gives a different ciphertext each time, so patterns and repeated messages are hidden.<\/li><li>It need not be secret, but it must be unpredictable (CBC) or never reused (CTR/OFB).<\/li><li><b>ECB doesn't need an IV<\/b> because each block is encrypted independently with only the key: C<sub>i<\/sub> = E(K, P<sub>i<\/sub>) — there is no chaining or feedback for an IV to start (which is exactly why ECB leaks patterns).<\/li><\/ol>", "k": "theory", "d": "cbc", "id": 113}, {"t": "modes", "src": ["T1C Q3(f)"], "m": 5, "q": "Briefly explain Counter (CTR) mode of operation. Explain an advantage of CTR when compared to CBC. [3,2]", "a": "<div class=\"ans\"><b>Answer:<\/b> CTR encrypts successive counter values and XORs them with the plaintext; advantage: blocks can be encrypted/decrypted in parallel (and randomly accessed).<\/div><ol class=\"steps\"><li>A counter value (nonce + counter) is encrypted for each block: O<sub>i<\/sub> = E(K, ctr + i − 1).<\/li><li>C<sub>i<\/sub> = P<sub>i<\/sub> ⊕ O<sub>i<\/sub>; decryption P<sub>i<\/sub> = C<sub>i<\/sub> ⊕ O<sub>i<\/sub> (only the encryption function is needed).<\/li><li>The counter must never repeat under the same key.<\/li><\/ol><p><b>Advantage over CBC:<\/b> CBC encryption is sequential (each block needs the previous ciphertext), but CTR blocks are independent ⇒ parallel processing, pre-computation of the key-stream, random access to any block, and no padding needed.<\/p>", "k": "theory", "d": "ctr", "id": 114}, {"t": "modes", "src": ["SUP26 Q2(d)"], "m": 3, "q": "Explain why CTR mode is often considered a stream cipher.", "a": "<div class=\"ans\"><b>Answer:<\/b> Because CTR uses the block cipher only to generate a key-stream which is XORed with the plaintext — exactly how a stream cipher works.<\/div><ol class=\"steps\"><li>Key-stream O<sub>i<\/sub> = E(K, counter<sub>i<\/sub>) is independent of the data; C = P ⊕ key-stream.<\/li><li>So messages of any length can be encrypted bit/byte by byte with no padding; the last block just uses as many key-stream bits as needed.<\/li><li>Like any stream cipher, reusing a counter (key-stream) is fatal, and bit flips in C flip the same bits in P.<\/li><\/ol>", "k": "theory", "d": "ctr", "id": 115}, {"t": "modes", "src": ["SUP26 Q2(c)"], "m": 8, "q": "Compare ECB, CBC and CTR modes with respect to pattern leakage, error propagation and parallelization.", "a": "<div class=\"ans\"><b>Answer:<\/b> ECB leaks patterns; CBC and CTR hide them. CBC spreads a 1-block error to the next block; ECB/CTR keep errors local. ECB and CTR are fully parallel; CBC encryption is sequential.<\/div><div class=\"tw\"><table class=\"wt\"><thead><tr><th><\/th><th>ECB<\/th><th>CBC<\/th><th>CTR<\/th><\/tr><\/thead><tbody><tr><td>Pattern leakage<\/td><td>Yes — identical P blocks ⇒ identical C blocks<\/td><td>No — chaining with IV/previous C hides repeats<\/td><td>No — every block uses a different counter<\/td><\/tr><tr><td>Error propagation (1 bit error in C<sub>i<\/sub>)<\/td><td>Only P<sub>i<\/sub> garbled<\/td><td>P<sub>i<\/sub> garbled + same bit flipped in P<sub>i+1<\/sub><\/td><td>Only the same bit of P<sub>i<\/sub> flips<\/td><\/tr><tr><td>Parallel encryption<\/td><td>Yes<\/td><td>No (needs C<sub>i−1<\/sub>)<\/td><td>Yes<\/td><\/tr><tr><td>Parallel decryption<\/td><td>Yes<\/td><td>Yes (all C known)<\/td><td>Yes<\/td><\/tr><tr><td>IV / padding<\/td><td>No IV; padding needed<\/td><td>Unpredictable IV; padding needed<\/td><td>Unique nonce/counter; no padding<\/td><\/tr><\/tbody><\/table><\/div>", "k": "theory", "d": "ecb", "id": 116}, {"t": "pk", "src": ["T1B Q2(d)"], "m": 10, "q": "Suppose your RSA modulus is n = 5 × 11 and your encryption exponent e = 3.<br>i. Find the decryption exponent d. [3]<br>ii. Assuming that gcd(n, m) = 1, show that if c ≡ m<sup>3<\/sup> (mod 55) is the ciphertext, then the plaintext is m ≡ c<sup>d<\/sup> (mod 55). [4]<br>iii. Explain how an adversary with unlimited computing resources could retrieve the message m from the ciphertext. [3]", "a": "<div class=\"ans\"><b>Answer:<\/b> i. d = 27<\/div><h4>i.<\/h4><ol class=\"steps\"><li>n = p × q = 5 × 11 = <b>55<\/b><\/li><li>φ(n) = (p − 1)(q − 1) = 4 × 10 = <b>40<\/b><\/li><li>e = 3: gcd(3, 40) = 1 ✓ (e must be coprime to φ(n))<\/li><li>d = e<sup>−1<\/sup> mod φ(n) (solve 3d ≡ 1 mod 40) using extended Euclid:<\/li><\/ol><ol class=\"steps\"><li>40 = 13 × 3 + 1<\/li><li>3 = 3 × 1 + 0<\/li><\/ol><p>Back-substitute:<\/p><ol class=\"steps\"><li>1 = 40 − 13 × 3<\/li><\/ol><p>⇒ d = 3<sup>−1<\/sup> mod 40 = <b>27<\/b>. Check: 3 × 27 = 81 = 2 × 40 + 1 ✓<\/p><h4>ii. Proof<\/h4><ol class=\"steps\"><li>ed = 3 × 27 = 81 = 2 × 40 + 1, i.e. ed = 1 + kφ(n) with k = 2.<\/li><li>c<sup>d<\/sup> ≡ (m<sup>3<\/sup>)<sup>27<\/sup> = m<sup>81<\/sup> = m<sup>2·40 + 1<\/sup> = (m<sup>φ(55)<\/sup>)<sup>2<\/sup> · m (mod 55).<\/li><li>Because gcd(m, 55) = 1, Euler's theorem gives m<sup>φ(55)<\/sup> = m<sup>40<\/sup> ≡ 1 (mod 55).<\/li><li>⇒ c<sup>d<\/sup> ≡ 1<sup>2<\/sup> · m = m (mod 55). ∎<\/li><\/ol><h4>iii.<\/h4><ol class=\"steps\"><li>The public key (e, n) is known. With unlimited computing the adversary <b>factorises n<\/b> into p and q (here trivially 55 = 5 × 11).<\/li><li>Then computes φ(n) = (p − 1)(q − 1) and the private key d = e<sup>−1<\/sup> mod φ(n), exactly as the owner did.<\/li><li>Finally m = c<sup>d<\/sup> mod n. (Alternatively brute-force all m: compute m<sup>e<\/sup> mod n until it equals c.) RSA is only <i>computationally<\/i> secure.<\/li><\/ol>", "k": "calc", "d": null, "id": 117}, {"t": "pk", "src": ["T1C Q2(a)"], "m": 8, "q": "In RSA, the encryption exponent e and decryption exponent d are given by ed ≡ 1 (mod φ(n)). Given e = 17 and n = p × q = 11 × 7, find the decryption exponent d.", "a": "<div class=\"ans\"><b>Answer:<\/b> d = 53<\/div><ol class=\"steps\"><li>n = p × q = 11 × 7 = <b>77<\/b><\/li><li>φ(n) = (p − 1)(q − 1) = 10 × 6 = <b>60<\/b><\/li><li>e = 17: gcd(17, 60) = 1 ✓ (e must be coprime to φ(n))<\/li><li>d = e<sup>−1<\/sup> mod φ(n) (solve 17d ≡ 1 mod 60) using extended Euclid:<\/li><\/ol><ol class=\"steps\"><li>60 = 3 × 17 + 9<\/li><li>17 = 1 × 9 + 8<\/li><li>9 = 1 × 8 + 1<\/li><li>8 = 8 × 1 + 0<\/li><\/ol><p>Back-substitute:<\/p><ol class=\"steps\"><li>1 = 9 − 1 × 8<\/li><li>1 = −1 × 17 + (2) × 9<\/li><li>1 = 2 × 60 − (7) × 17<\/li><\/ol><p>⇒ d = 17<sup>−1<\/sup> mod 60 = <b>53<\/b>. Check: 17 × 53 = 901 = 15 × 60 + 1 ✓<\/p>", "k": "calc", "d": null, "id": 118}, {"t": "pk", "src": ["T1D Q3(d)"], "m": 9, "q": "In the RSA public key cryptosystem, a message intended for another principal is encrypted with that principal's public-key material [e, n] to produce c = m<sup>e<\/sup> (mod n).<br>i. Explain in detail how the intended recipient will decrypt the ciphertext to retrieve the message. [5]<br>ii. Explain how an adversary with unlimited computing resources could retrieve the message. [4]", "a": "<div class=\"ans\"><b>Answer:<\/b> i. The recipient computes m = c<sup>d<\/sup> mod n with their private d (ed ≡ 1 mod φ(n)). ii. Factor n ⇒ φ(n) ⇒ d ⇒ m.<\/div><h4>i.<\/h4><ol class=\"steps\"><li>The recipient generated the keys: chose primes p, q; n = pq; φ(n) = (p − 1)(q − 1); public e with gcd(e, φ(n)) = 1; private d = e<sup>−1<\/sup> mod φ(n) (extended Euclid).<\/li><li>On receiving c, they compute <b>m = c<sup>d<\/sup> mod n<\/b> (efficiently with square-and-multiply; optionally faster using CRT with p and q).<\/li><li>Why it works: ed = 1 + kφ(n) so c<sup>d<\/sup> = m<sup>ed<\/sup> = m · (m<sup>φ(n)<\/sup>)<sup>k<\/sup> ≡ m · 1<sup>k<\/sup> = m (mod n) by Euler's theorem.<\/li><li>Only the recipient knows d (equivalently p, q), so only they can decrypt.<\/li><\/ol><h4>ii.<\/h4><ol class=\"steps\"><li>Factor the public n into p × q (feasible with unlimited computing).<\/li><li>Compute φ(n) = (p − 1)(q − 1) and then d = e<sup>−1<\/sup> mod φ(n).<\/li><li>Decrypt m = c<sup>d<\/sup> mod n. (Or: try every m until m<sup>e<\/sup> ≡ c.)<\/li><\/ol>", "k": "calc", "d": null, "id": 119}, {"t": "pk", "src": ["T2A Q2(b)"], "m": 7, "q": "Consider a public-key system using RSA. An adversary intercepts the ciphertext C = 10 sent to a user whose public key is e = 13, n = 91. Determine the plaintext.", "a": "<div class=\"ans\"><b>Answer:<\/b> M = 10<\/div><ol class=\"steps\"><li>n is small, so factor it: 91 = 7 × 13 ⇒ p = 7, q = 13.<\/li><li>φ(n) = 6 × 12 = 72; gcd(13, 72) = 1.<\/li><li>d = 13<sup>−1<\/sup> mod 72: 72 = 5×13 + 7; 13 = 1×7 + 6; 7 = 1×6 + 1 ⇒ 1 = 7 − 6 = 7 − (13 − 7) = 2×7 − 13 = 2(72 − 5×13) − 13 = 2×72 − 11×13 ⇒ d ≡ −11 ≡ <b>61<\/b>. Check 13×61 = 793 = 11×72 + 1 ✓<\/li><li>M = C<sup>d<\/sup> mod n = 10<sup>61<\/sup> mod 91:<\/li><\/ol><p>61 in binary = 111101<sub>2<\/sub>, so 61 = 32 + 16 + 8 + 4 + 1.<\/p><div class=\"tw\"><table class=\"wt\"><thead><tr><th>power<\/th><th>working<\/th><th>value mod 91<\/th><\/tr><\/thead><tbody><tr><td>10<sup>1<\/sup><\/td><td>10 mod 91<\/td><td>10<\/td><\/tr><tr><td>10<sup>2<\/sup><\/td><td>10<sup>2<\/sup> = 100 mod 91<\/td><td>9<\/td><\/tr><tr><td>10<sup>4<\/sup><\/td><td>9<sup>2<\/sup> = 81 mod 91<\/td><td>81<\/td><\/tr><tr><td>10<sup>8<\/sup><\/td><td>81<sup>2<\/sup> = 6561 mod 91<\/td><td>9<\/td><\/tr><tr><td>10<sup>16<\/sup><\/td><td>9<sup>2<\/sup> = 81 mod 91<\/td><td>81<\/td><\/tr><tr><td>10<sup>32<\/sup><\/td><td>81<sup>2<\/sup> = 6561 mod 91<\/td><td>9<\/td><\/tr><\/tbody><\/table><\/div><p>10<sup>61<\/sup> = 10<sup>32<\/sup> × 10<sup>16<\/sup> × 10<sup>8<\/sup> × 10<sup>4<\/sup> × 10<sup>1<\/sup> ≡ 9 × 81 × 9 × 81 × 10 (mod 91)<\/p><ol class=\"steps\"><li>9 × 81 = 729 ≡ 1<\/li><li>1 × 9 = 9 ≡ 9<\/li><li>9 × 81 = 729 ≡ 1<\/li><li>1 × 10 = 10 ≡ 10<\/li><\/ol><p>⇒ 10<sup>61<\/sup> mod 91 = <b>10<\/b><\/p><p>Check: 10<sup>13<\/sup> mod 91 = 10 ✓ — interesting: 10 is a <i>fixed point<\/i> of this key (it encrypts to itself), which RSA allows for a few messages.<\/p>", "k": "calc", "d": null, "id": 120}, {"t": "pk", "src": ["EXAB Q4(a)"], "m": 9, "q": "Rivest, Shamir and Adleman are known for the RSA algorithm.<br>i. If n = 2747 and it is revealed that φ(n) = 2640, what are the factors of n? [4]<br>ii. Based on the above parameters, what is d if the encryption exponent is 17? [3]<br>iii. What will you get when you encrypt the message m = 2? [2]", "a": "<div class=\"ans\"><b>Answer:<\/b> i. n = 67 × 41 &nbsp; ii. d = 1553 &nbsp; iii. c = 1963<\/div><h4>i.<\/h4><ol class=\"steps\"><li>n = pq and φ(n) = (p − 1)(q − 1) = pq − (p + q) + 1 ⇒ p + q = n − φ(n) + 1.<\/li><li>p + q = 2747 − 2640 + 1 = <b>108<\/b>, pq = 2747.<\/li><li>p, q are roots of t² − 108t + 2747 = 0: discriminant = 108² − 4(2747) = 11664 − 10988 = 676 = 26²<\/li><li>t = (108 ± 26) / 2 ⇒ p = 67, q = 41. Check 67 × 41 = 2747 ✓<\/li><\/ol><h4>ii.<\/h4><ol class=\"steps\"><li>2640 = 155 × 17 + 5<\/li><li>17 = 3 × 5 + 2<\/li><li>5 = 2 × 2 + 1<\/li><li>2 = 2 × 1 + 0<\/li><\/ol><p>Back-substitute:<\/p><ol class=\"steps\"><li>1 = 5 − 2 × 2<\/li><li>1 = −2 × 17 + (7) × 5<\/li><li>1 = 7 × 2640 − (1087) × 17<\/li><\/ol><p>⇒ d = 17<sup>−1<\/sup> mod 2640 = <b>1553<\/b>. Check: 17 × 1553 = 26401 = 10 × 2640 + 1 ✓<\/p><h4>iii.<\/h4><p>c = m<sup>e<\/sup> mod n = 2<sup>17<\/sup> mod 2747 = 131072 mod 2747. 131072 = 47 × 2747 + 1963 ⇒ <b>c = 1963<\/b><\/p>", "k": "calc", "d": null, "id": 121}, {"t": "pk", "src": ["PZ Q4(b)"], "m": 8, "q": "In RSA, Euler's totient function is used as the modulus in the key generation process.<br>i. Given p = 19, q = 17 and e = 11, find the keys to be able to use the RSA algorithm. [5]<br>ii. Suppose an IT administrator leaks the private key generated for RSA. Instead of generating a new modulus, he decides to generate a new key pair. Is this safe? [3]", "a": "<div class=\"ans\"><b>Answer:<\/b> i. PU = {e, n} = {11, 323}, PR = {d, n} = {131, 323} &nbsp; ii. Not safe.<\/div><h4>i.<\/h4><ol class=\"steps\"><li>n = p × q = 19 × 17 = <b>323<\/b><\/li><li>φ(n) = (p − 1)(q − 1) = 18 × 16 = <b>288<\/b><\/li><li>e = 11: gcd(11, 288) = 1 ✓ (e must be coprime to φ(n))<\/li><li>d = e<sup>−1<\/sup> mod φ(n) (solve 11d ≡ 1 mod 288) using extended Euclid:<\/li><\/ol><ol class=\"steps\"><li>288 = 26 × 11 + 2<\/li><li>11 = 5 × 2 + 1<\/li><li>2 = 2 × 1 + 0<\/li><\/ol><p>Back-substitute:<\/p><ol class=\"steps\"><li>1 = 11 − 5 × 2<\/li><li>1 = −5 × 288 + (131) × 11<\/li><\/ol><p>⇒ d = 11<sup>−1<\/sup> mod 288 = <b>131<\/b>. Check: 11 × 131 = 1441 = 5 × 288 + 1 ✓<\/p><h4>ii.<\/h4><ol class=\"steps\"><li>No. Knowing one matching pair (e, d) for n lets anyone factor n: ed − 1 is a multiple of φ(n), and there is an efficient probabilistic method to recover p and q from it.<\/li><li>Once p, q are known, any new key pair (e′, d′) on the same n is instantly broken: d′ = e′<sup>−1<\/sup> mod φ(n).<\/li><li>⇒ Must generate fresh primes p, q (a new modulus).<\/li><\/ol>", "k": "calc", "d": null, "id": 122}, {"t": "pk", "src": ["E5 B(b)"], "m": null, "q": "Given p = 47, q = 17 and e = 5. i. Find the keys to be able to use the RSA algorithm. ii. Decrypt ciphertext c = 687.", "a": "<div class=\"ans\"><b>Answer:<\/b> PU = {5, 799}, PR = {589, 799}; m = 669<\/div><h4>i.<\/h4><ol class=\"steps\"><li>n = p × q = 47 × 17 = <b>799<\/b><\/li><li>φ(n) = (p − 1)(q − 1) = 46 × 16 = <b>736<\/b><\/li><li>e = 5: gcd(5, 736) = 1 ✓ (e must be coprime to φ(n))<\/li><li>d = e<sup>−1<\/sup> mod φ(n) (solve 5d ≡ 1 mod 736) using extended Euclid:<\/li><\/ol><ol class=\"steps\"><li>736 = 147 × 5 + 1<\/li><li>5 = 5 × 1 + 0<\/li><\/ol><p>Back-substitute:<\/p><ol class=\"steps\"><li>1 = 736 − 147 × 5<\/li><\/ol><p>⇒ d = 5<sup>−1<\/sup> mod 736 = <b>589<\/b>. Check: 5 × 589 = 2945 = 4 × 736 + 1 ✓<\/p><h4>ii. m = 687<sup>589<\/sup> mod 799<\/h4><p>589 in binary = 1001001101<sub>2<\/sub>, so 589 = 512 + 64 + 8 + 4 + 1.<\/p><div class=\"tw\"><table class=\"wt\"><thead><tr><th>power<\/th><th>working<\/th><th>value mod 799<\/th><\/tr><\/thead><tbody><tr><td>687<sup>1<\/sup><\/td><td>687 mod 799<\/td><td>687<\/td><\/tr><tr><td>687<sup>2<\/sup><\/td><td>687<sup>2<\/sup> = 471969 mod 799<\/td><td>559<\/td><\/tr><tr><td>687<sup>4<\/sup><\/td><td>559<sup>2<\/sup> = 312481 mod 799<\/td><td>72<\/td><\/tr><tr><td>687<sup>8<\/sup><\/td><td>72<sup>2<\/sup> = 5184 mod 799<\/td><td>390<\/td><\/tr><tr><td>687<sup>16<\/sup><\/td><td>390<sup>2<\/sup> = 152100 mod 799<\/td><td>290<\/td><\/tr><tr><td>687<sup>32<\/sup><\/td><td>290<sup>2<\/sup> = 84100 mod 799<\/td><td>205<\/td><\/tr><tr><td>687<sup>64<\/sup><\/td><td>205<sup>2<\/sup> = 42025 mod 799<\/td><td>477<\/td><\/tr><tr><td>687<sup>128<\/sup><\/td><td>477<sup>2<\/sup> = 227529 mod 799<\/td><td>613<\/td><\/tr><tr><td>687<sup>256<\/sup><\/td><td>613<sup>2<\/sup> = 375769 mod 799<\/td><td>239<\/td><\/tr><tr><td>687<sup>512<\/sup><\/td><td>239<sup>2<\/sup> = 57121 mod 799<\/td><td>392<\/td><\/tr><\/tbody><\/table><\/div><p>687<sup>589<\/sup> = 687<sup>512<\/sup> × 687<sup>64<\/sup> × 687<sup>8<\/sup> × 687<sup>4<\/sup> × 687<sup>1<\/sup> ≡ 392 × 477 × 390 × 72 × 687 (mod 799)<\/p><ol class=\"steps\"><li>392 × 477 = 186984 ≡ 18<\/li><li>18 × 390 = 7020 ≡ 628<\/li><li>628 × 72 = 45216 ≡ 472<\/li><li>472 × 687 = 324264 ≡ 669<\/li><\/ol><p>⇒ 687<sup>589<\/sup> mod 799 = <b>669<\/b><\/p><p>Check: 669<sup>5<\/sup> mod 799 = 687 ✓<\/p>", "k": "calc", "d": null, "id": 123}, {"t": "pk", "src": ["E5 B(c)"], "m": null, "q": "Given an RSA cryptosystem with p = 79, q = 43 and d = 257: i. Determine the encryption exponent. ii. Encrypt the plaintext 123456 (hint: the message must be less than n).", "a": "<div class=\"ans\"><b>Answer:<\/b> i. e = 1109 &nbsp; ii. split into blocks 123 | 456 ⇒ C = 2759, 2385<\/div><ol class=\"steps\"><li>n = 79 × 43 = 3397, φ(n) = 78 × 42 = 3276.<\/li><li>e = d<sup>−1<\/sup> mod φ(n):<\/li><\/ol><ol class=\"steps\"><li>3276 = 12 × 257 + 192<\/li><li>257 = 1 × 192 + 65<\/li><li>192 = 2 × 65 + 62<\/li><li>65 = 1 × 62 + 3<\/li><li>62 = 20 × 3 + 2<\/li><li>3 = 1 × 2 + 1<\/li><li>2 = 2 × 1 + 0<\/li><\/ol><p>Back-substitute:<\/p><ol class=\"steps\"><li>1 = 3 − 1 × 2<\/li><li>1 = −1 × 62 + (21) × 3<\/li><li>1 = 21 × 65 − (22) × 62<\/li><li>1 = −22 × 192 + (65) × 65<\/li><li>1 = 65 × 257 − (87) × 192<\/li><li>1 = −87 × 3276 + (1109) × 257<\/li><\/ol><p>⇒ d = 257<sup>−1<\/sup> mod 3276 = <b>1109<\/b>. Check: 257 × 1109 = 285013 = 87 × 3276 + 1 ✓<\/p><ol class=\"steps cont\"><li>123456 &gt; n = 3397, so split it into blocks smaller than n, e.g. 123 and 456.<\/li><li>C<sub>1<\/sub> = 123<sup>1109<\/sup> mod 3397 = <b>2759<\/b><\/li><li>C<sub>2<\/sub> = 456<sup>1109<\/sup> mod 3397 = <b>2385<\/b><\/li><li>Check: 2759<sup>257<\/sup> mod 3397 = 123 ✓, 2385<sup>257<\/sup> mod 3397 = 456 ✓<\/li><\/ol><details><summary>Square-and-multiply for C<sub>1<\/sub><\/summary><p>1109 in binary = 10001010101<sub>2<\/sub>, so 1109 = 1024 + 64 + 16 + 4 + 1.<\/p><div class=\"tw\"><table class=\"wt\"><thead><tr><th>power<\/th><th>working<\/th><th>value mod 3397<\/th><\/tr><\/thead><tbody><tr><td>123<sup>1<\/sup><\/td><td>123 mod 3397<\/td><td>123<\/td><\/tr><tr><td>123<sup>2<\/sup><\/td><td>123<sup>2<\/sup> = 15129 mod 3397<\/td><td>1541<\/td><\/tr><tr><td>123<sup>4<\/sup><\/td><td>1541<sup>2<\/sup> = 2374681 mod 3397<\/td><td>178<\/td><\/tr><tr><td>123<sup>8<\/sup><\/td><td>178<sup>2<\/sup> = 31684 mod 3397<\/td><td>1111<\/td><\/tr><tr><td>123<sup>16<\/sup><\/td><td>1111<sup>2<\/sup> = 1234321 mod 3397<\/td><td>1210<\/td><\/tr><tr><td>123<sup>32<\/sup><\/td><td>1210<sup>2<\/sup> = 1464100 mod 3397<\/td><td>3390<\/td><\/tr><tr><td>123<sup>64<\/sup><\/td><td>3390<sup>2<\/sup> = 11492100 mod 3397<\/td><td>49<\/td><\/tr><tr><td>123<sup>128<\/sup><\/td><td>49<sup>2<\/sup> = 2401 mod 3397<\/td><td>2401<\/td><\/tr><tr><td>123<sup>256<\/sup><\/td><td>2401<sup>2<\/sup> = 5764801 mod 3397<\/td><td>92<\/td><\/tr><tr><td>123<sup>512<\/sup><\/td><td>92<sup>2<\/sup> = 8464 mod 3397<\/td><td>1670<\/td><\/tr><tr><td>123<sup>1024<\/sup><\/td><td>1670<sup>2<\/sup> = 2788900 mod 3397<\/td><td>3360<\/td><\/tr><\/tbody><\/table><\/div><p>123<sup>1109<\/sup> = 123<sup>1024<\/sup> × 123<sup>64<\/sup> × 123<sup>16<\/sup> × 123<sup>4<\/sup> × 123<sup>1<\/sup> ≡ 3360 × 49 × 1210 × 178 × 123 (mod 3397)<\/p><ol class=\"steps\"><li>3360 × 49 = 164640 ≡ 1584<\/li><li>1584 × 1210 = 1916640 ≡ 732<\/li><li>732 × 178 = 130296 ≡ 1210<\/li><li>1210 × 123 = 148830 ≡ 2759<\/li><\/ol><p>⇒ 123<sup>1109<\/sup> mod 3397 = <b>2759<\/b><\/p><\/details>", "k": "calc", "d": null, "id": 124}, {"t": "pk", "src": ["E5 B(d)"], "m": null, "q": "For an RSA cryptosystem with n = 3463, it is revealed that φ(n) = 3640. Use this information to find the factors of n.", "a": "<div class=\"ans\"><b>Answer:<\/b> As printed it's impossible (φ(n) &lt; n always). With the intended n = 3763: n = 71 × 53.<\/div><ol class=\"steps\"><li>Always φ(n) &lt; n, so φ(n) = 3640 can't belong to n = 3463 — there's a typo. 3763 works:<\/li><li>p + q = n − φ(n) + 1 = 3763 − 3640 + 1 = 124; pq = 3763.<\/li><li>t² − 124t + 3763 = 0: discriminant = 124² − 4×3763 = 15376 − 15052 = 324 = 18².<\/li><li>t = (124 ± 18)/2 ⇒ p = 71, q = 53. Check 71 × 53 = 3763 ✓ and 70 × 52 = 3640 ✓<\/li><\/ol>", "k": "calc", "d": null, "id": 125}, {"t": "pk", "src": ["EX22 Q6(c)", "E5 B(a)", "EX24 Q5(b)(i)"], "m": 4, "q": "Explain why the encryption exponents e = 1 and e = 2 should not be used in RSA.", "a": "<div class=\"ans\"><b>Answer:<\/b> e = 1 leaves the message unencrypted; e = 2 is not coprime to φ(n) (always even), so there's no decryption exponent.<\/div><ol class=\"steps\"><li><b>e = 1:<\/b> c = m<sup>1<\/sup> mod n = m — the 'ciphertext' is just the plaintext. No encryption at all.<\/li><li><b>e = 2:<\/b> φ(n) = (p − 1)(q − 1) is always even, so gcd(2, φ(n)) = 2 ≠ 1 ⇒ no inverse d exists, decryption is impossible (and it becomes the Rabin system, not RSA).<\/li><li>Also, a small e on a small m gives m<sup>e<\/sup> &lt; n, so no modular reduction happens and m is just the e-th root of c.<\/li><\/ol>", "k": "theory", "d": null, "id": 126}, {"t": "pk", "src": ["EX22 Q6"], "m": 20, "q": "The RSA algorithm is one of the most widely used encryption tools.<br>a) What is the basis for regarding RSA secure? [2]<br>b) RSA can be used to sign messages. What key is used for this purpose and why? [3]<br>c) (see the separate e = 1, 2 question) [4]<br>d) Given p = 13, q = 17 and e = 5: i. Find the keys to be able to use RSA. [6] ii. Decrypt ciphertext c = 171. [5]", "a": "<div class=\"ans\"><b>Answer:<\/b> a) difficulty of factoring n; b) the signer's private key; d) PU = {5, 221}, PR = {77, 221}, m = 188<\/div><h4>a)<\/h4><p>Security rests on the <b>integer factorisation problem<\/b>: computing d needs φ(n), which needs p and q; factoring a large n (2048+ bits) is computationally infeasible.<\/p><h4>b)<\/h4><p>The sender's <b>private key<\/b> d: s = H(m)<sup>d<\/sup> mod n. Only the owner has d, so only they can produce s; anyone can verify with the public key (s<sup>e<\/sup> ≡ H(m)). This gives authentication, integrity and non-repudiation.<\/p><h4>d) i.<\/h4><ol class=\"steps\"><li>n = p × q = 13 × 17 = <b>221<\/b><\/li><li>φ(n) = (p − 1)(q − 1) = 12 × 16 = <b>192<\/b><\/li><li>e = 5: gcd(5, 192) = 1 ✓ (e must be coprime to φ(n))<\/li><li>d = e<sup>−1<\/sup> mod φ(n) (solve 5d ≡ 1 mod 192) using extended Euclid:<\/li><\/ol><ol class=\"steps\"><li>192 = 38 × 5 + 2<\/li><li>5 = 2 × 2 + 1<\/li><li>2 = 2 × 1 + 0<\/li><\/ol><p>Back-substitute:<\/p><ol class=\"steps\"><li>1 = 5 − 2 × 2<\/li><li>1 = −2 × 192 + (77) × 5<\/li><\/ol><p>⇒ d = 5<sup>−1<\/sup> mod 192 = <b>77<\/b>. Check: 5 × 77 = 385 = 2 × 192 + 1 ✓<\/p><h4>d) ii.<\/h4><p>77 in binary = 1001101<sub>2<\/sub>, so 77 = 64 + 8 + 4 + 1.<\/p><div class=\"tw\"><table class=\"wt\"><thead><tr><th>power<\/th><th>working<\/th><th>value mod 221<\/th><\/tr><\/thead><tbody><tr><td>171<sup>1<\/sup><\/td><td>171 mod 221<\/td><td>171<\/td><\/tr><tr><td>171<sup>2<\/sup><\/td><td>171<sup>2<\/sup> = 29241 mod 221<\/td><td>69<\/td><\/tr><tr><td>171<sup>4<\/sup><\/td><td>69<sup>2<\/sup> = 4761 mod 221<\/td><td>120<\/td><\/tr><tr><td>171<sup>8<\/sup><\/td><td>120<sup>2<\/sup> = 14400 mod 221<\/td><td>35<\/td><\/tr><tr><td>171<sup>16<\/sup><\/td><td>35<sup>2<\/sup> = 1225 mod 221<\/td><td>120<\/td><\/tr><tr><td>171<sup>32<\/sup><\/td><td>120<sup>2<\/sup> = 14400 mod 221<\/td><td>35<\/td><\/tr><tr><td>171<sup>64<\/sup><\/td><td>35<sup>2<\/sup> = 1225 mod 221<\/td><td>120<\/td><\/tr><\/tbody><\/table><\/div><p>171<sup>77<\/sup> = 171<sup>64<\/sup> × 171<sup>8<\/sup> × 171<sup>4<\/sup> × 171<sup>1<\/sup> ≡ 120 × 35 × 120 × 171 (mod 221)<\/p><ol class=\"steps\"><li>120 × 35 = 4200 ≡ 1<\/li><li>1 × 120 = 120 ≡ 120<\/li><li>120 × 171 = 20520 ≡ 188<\/li><\/ol><p>⇒ 171<sup>77<\/sup> mod 221 = <b>188<\/b><\/p><p>Check: 188<sup>5<\/sup> mod 221 = 171 ✓<\/p>", "k": "calc", "d": null, "id": 127}, {"t": "pk", "src": ["EX25 Q4(a)", "SUP26 Q4(a)"], "m": 2, "q": "Explain why RSA decryption requires the modular inverse of the public exponent e modulo φ(n). What property guarantees the existence of this inverse? [1,1]", "a": "<div class=\"ans\"><b>Answer:<\/b> Because ed ≡ 1 (mod φ(n)) is what makes m<sup>ed<\/sup> ≡ m; the inverse exists iff gcd(e, φ(n)) = 1.<\/div><ol class=\"steps\"><li>Decryption must undo encryption: (m<sup>e<\/sup>)<sup>d<\/sup> ≡ m (mod n). By Euler, this holds when ed ≡ 1 (mod φ(n)), because then m<sup>ed<\/sup> = m<sup>1 + kφ(n)<\/sup> = m·(m<sup>φ(n)<\/sup>)<sup>k<\/sup> ≡ m. So d must be the modular inverse of e mod φ(n).<\/li><li>The inverse exists exactly when <b>gcd(e, φ(n)) = 1<\/b> (e relatively prime to φ(n)) — that's why e is chosen that way.<\/li><\/ol>", "k": "theory", "d": null, "id": 128}, {"t": "pk", "src": ["EX25 Q4(b)"], "m": 8, "q": "Given the public key (n = 221, e = 35), where 221 = 13 × 17:<br>i. Encrypt the message m = 10 [3]<br>ii. If the ciphertext is c = 27, decrypt it using the appropriate value of d [5]", "a": "<div class=\"ans\"><b>Answer:<\/b> i. c = 82 &nbsp; ii. d = 11, m = 105<\/div><h4>i. c = 10<sup>35<\/sup> mod 221<\/h4><p>35 in binary = 100011<sub>2<\/sub>, so 35 = 32 + 2 + 1.<\/p><div class=\"tw\"><table class=\"wt\"><thead><tr><th>power<\/th><th>working<\/th><th>value mod 221<\/th><\/tr><\/thead><tbody><tr><td>10<sup>1<\/sup><\/td><td>10 mod 221<\/td><td>10<\/td><\/tr><tr><td>10<sup>2<\/sup><\/td><td>10<sup>2<\/sup> = 100 mod 221<\/td><td>100<\/td><\/tr><tr><td>10<sup>4<\/sup><\/td><td>100<sup>2<\/sup> = 10000 mod 221<\/td><td>55<\/td><\/tr><tr><td>10<sup>8<\/sup><\/td><td>55<sup>2<\/sup> = 3025 mod 221<\/td><td>152<\/td><\/tr><tr><td>10<sup>16<\/sup><\/td><td>152<sup>2<\/sup> = 23104 mod 221<\/td><td>120<\/td><\/tr><tr><td>10<sup>32<\/sup><\/td><td>120<sup>2<\/sup> = 14400 mod 221<\/td><td>35<\/td><\/tr><\/tbody><\/table><\/div><p>10<sup>35<\/sup> = 10<sup>32<\/sup> × 10<sup>2<\/sup> × 10<sup>1<\/sup> ≡ 35 × 100 × 10 (mod 221)<\/p><ol class=\"steps\"><li>35 × 100 = 3500 ≡ 185<\/li><li>185 × 10 = 1850 ≡ 82<\/li><\/ol><p>⇒ 10<sup>35<\/sup> mod 221 = <b>82<\/b><\/p><h4>ii.<\/h4><ol class=\"steps\"><li>n = p × q = 13 × 17 = <b>221<\/b><\/li><li>φ(n) = (p − 1)(q − 1) = 12 × 16 = <b>192<\/b><\/li><li>e = 35: gcd(35, 192) = 1 ✓ (e must be coprime to φ(n))<\/li><li>d = e<sup>−1<\/sup> mod φ(n) (solve 35d ≡ 1 mod 192) using extended Euclid:<\/li><\/ol><ol class=\"steps\"><li>192 = 5 × 35 + 17<\/li><li>35 = 2 × 17 + 1<\/li><li>17 = 17 × 1 + 0<\/li><\/ol><p>Back-substitute:<\/p><ol class=\"steps\"><li>1 = 35 − 2 × 17<\/li><li>1 = −2 × 192 + (11) × 35<\/li><\/ol><p>⇒ d = 35<sup>−1<\/sup> mod 192 = <b>11<\/b>. Check: 35 × 11 = 385 = 2 × 192 + 1 ✓<\/p><p>m = 27<sup>11<\/sup> mod 221:<\/p><p>11 in binary = 1011<sub>2<\/sub>, so 11 = 8 + 2 + 1.<\/p><div class=\"tw\"><table class=\"wt\"><thead><tr><th>power<\/th><th>working<\/th><th>value mod 221<\/th><\/tr><\/thead><tbody><tr><td>27<sup>1<\/sup><\/td><td>27 mod 221<\/td><td>27<\/td><\/tr><tr><td>27<sup>2<\/sup><\/td><td>27<sup>2<\/sup> = 729 mod 221<\/td><td>66<\/td><\/tr><tr><td>27<sup>4<\/sup><\/td><td>66<sup>2<\/sup> = 4356 mod 221<\/td><td>157<\/td><\/tr><tr><td>27<sup>8<\/sup><\/td><td>157<sup>2<\/sup> = 24649 mod 221<\/td><td>118<\/td><\/tr><\/tbody><\/table><\/div><p>27<sup>11<\/sup> = 27<sup>8<\/sup> × 27<sup>2<\/sup> × 27<sup>1<\/sup> ≡ 118 × 66 × 27 (mod 221)<\/p><ol class=\"steps\"><li>118 × 66 = 7788 ≡ 53<\/li><li>53 × 27 = 1431 ≡ 105<\/li><\/ol><p>⇒ 27<sup>11<\/sup> mod 221 = <b>105<\/b><\/p><p>Check: 105<sup>35<\/sup> mod 221 = 27 ✓<\/p>", "k": "calc", "d": null, "id": 129}, {"t": "pk", "src": ["SUP26 Q4(b)"], "m": 2, "q": "Explain why RSA security depends on the difficulty of integer factorisation.", "a": "<div class=\"ans\"><b>Answer:<\/b> Because the private key d can be computed from the public (e, n) as soon as n is factored.<\/div><ol class=\"steps\"><li>d = e<sup>−1<\/sup> mod φ(n) and φ(n) = (p − 1)(q − 1) — needs p and q.<\/li><li>Only n is public; for large n (2048 bits) no known classical algorithm factors it in feasible time, so d stays secret.<\/li><li>If factoring became easy, RSA would be broken immediately.<\/li><\/ol>", "k": "theory", "d": null, "id": 130}, {"t": "pk", "src": ["SUP26 Q4(c)"], "m": 10, "q": "Given p = 11, q = 23, e = 3: compute n and φ(n), determine d, encrypt m = 8 and decrypt the resulting ciphertext.", "a": "<div class=\"ans\"><b>Answer:<\/b> n = 253, φ(n) = 220, d = 147, c = 6, decrypts back to m = 8<\/div><ol class=\"steps\"><li>n = p × q = 11 × 23 = <b>253<\/b><\/li><li>φ(n) = (p − 1)(q − 1) = 10 × 22 = <b>220<\/b><\/li><li>e = 3: gcd(3, 220) = 1 ✓ (e must be coprime to φ(n))<\/li><li>d = e<sup>−1<\/sup> mod φ(n) (solve 3d ≡ 1 mod 220) using extended Euclid:<\/li><\/ol><ol class=\"steps\"><li>220 = 73 × 3 + 1<\/li><li>3 = 3 × 1 + 0<\/li><\/ol><p>Back-substitute:<\/p><ol class=\"steps\"><li>1 = 220 − 73 × 3<\/li><\/ol><p>⇒ d = 3<sup>−1<\/sup> mod 220 = <b>147<\/b>. Check: 3 × 147 = 441 = 2 × 220 + 1 ✓<\/p><p><b>Encrypt:<\/b> c = 8<sup>3<\/sup> mod 253 = 512 mod 253 = 512 − 2×253 = <b>6<\/b><\/p><p><b>Decrypt:<\/b> m = 6<sup>147<\/sup> mod 253:<\/p><p>147 in binary = 10010011<sub>2<\/sub>, so 147 = 128 + 16 + 2 + 1.<\/p><div class=\"tw\"><table class=\"wt\"><thead><tr><th>power<\/th><th>working<\/th><th>value mod 253<\/th><\/tr><\/thead><tbody><tr><td>6<sup>1<\/sup><\/td><td>6 mod 253<\/td><td>6<\/td><\/tr><tr><td>6<sup>2<\/sup><\/td><td>6<sup>2<\/sup> = 36 mod 253<\/td><td>36<\/td><\/tr><tr><td>6<sup>4<\/sup><\/td><td>36<sup>2<\/sup> = 1296 mod 253<\/td><td>31<\/td><\/tr><tr><td>6<sup>8<\/sup><\/td><td>31<sup>2<\/sup> = 961 mod 253<\/td><td>202<\/td><\/tr><tr><td>6<sup>16<\/sup><\/td><td>202<sup>2<\/sup> = 40804 mod 253<\/td><td>71<\/td><\/tr><tr><td>6<sup>32<\/sup><\/td><td>71<sup>2<\/sup> = 5041 mod 253<\/td><td>234<\/td><\/tr><tr><td>6<sup>64<\/sup><\/td><td>234<sup>2<\/sup> = 54756 mod 253<\/td><td>108<\/td><\/tr><tr><td>6<sup>128<\/sup><\/td><td>108<sup>2<\/sup> = 11664 mod 253<\/td><td>26<\/td><\/tr><\/tbody><\/table><\/div><p>6<sup>147<\/sup> = 6<sup>128<\/sup> × 6<sup>16<\/sup> × 6<sup>2<\/sup> × 6<sup>1<\/sup> ≡ 26 × 71 × 36 × 6 (mod 253)<\/p><ol class=\"steps\"><li>26 × 71 = 1846 ≡ 75<\/li><li>75 × 36 = 2700 ≡ 170<\/li><li>170 × 6 = 1020 ≡ 8<\/li><\/ol><p>⇒ 6<sup>147<\/sup> mod 253 = <b>8<\/b><\/p>", "k": "calc", "d": null, "id": 131}, {"t": "pk", "src": ["T2A Q2(c)"], "m": 8, "q": "Suppose Alice and Bob wish to do Diffie-Hellman key exchange. They agreed upon a prime p = 11 and a generator g = 3. Alice has chosen her private exponent X<sub>A<\/sub> = 7, while Bob has chosen X<sub>B<\/sub> = 5.<br>i. Determine the shared key. [6]<br>ii. D-H is susceptible to a man-in-the-middle attack in which the adversary generates two public-private key pairs. Could the same attack be accomplished with one pair? Briefly explain. [2]", "a": "<div class=\"ans\"><b>Answer:<\/b> Y<sub>A<\/sub> = 9, Y<sub>B<\/sub> = 1, shared key K = 1<\/div><ol class=\"steps\"><li>Alice: Y<sub>A<\/sub> = g<sup>X<sub>A<\/sub><\/sup> mod p = 3<sup>7<\/sup> mod 11 = <b>9<\/b><\/li><li>Bob: Y<sub>B<\/sub> = g<sup>X<sub>B<\/sub><\/sup> mod p = 3<sup>5<\/sup> mod 11 = <b>1<\/b><\/li><li>They swap Y<sub>A<\/sub>, Y<sub>B<\/sub> in public.<\/li><li>Alice: K = Y<sub>B<\/sub><sup>X<sub>A<\/sub><\/sup> mod p = 1<sup>7<\/sup> mod 11 = <b>1<\/b><\/li><li>Bob: K = Y<sub>A<\/sub><sup>X<sub>B<\/sub><\/sup> mod p = 9<sup>5<\/sup> mod 11 = <b>1<\/b> ✓ same<\/li><\/ol><details><summary>Square-and-multiply workings<\/summary><p><b>Y<sub>A<\/sub><\/b><\/p><p>7 in binary = 111<sub>2<\/sub>, so 7 = 4 + 2 + 1.<\/p><div class=\"tw\"><table class=\"wt\"><thead><tr><th>power<\/th><th>working<\/th><th>value mod 11<\/th><\/tr><\/thead><tbody><tr><td>3<sup>1<\/sup><\/td><td>3 mod 11<\/td><td>3<\/td><\/tr><tr><td>3<sup>2<\/sup><\/td><td>3<sup>2<\/sup> = 9 mod 11<\/td><td>9<\/td><\/tr><tr><td>3<sup>4<\/sup><\/td><td>9<sup>2<\/sup> = 81 mod 11<\/td><td>4<\/td><\/tr><\/tbody><\/table><\/div><p>3<sup>7<\/sup> = 3<sup>4<\/sup> × 3<sup>2<\/sup> × 3<sup>1<\/sup> ≡ 4 × 9 × 3 (mod 11)<\/p><ol class=\"steps\"><li>4 × 9 = 36 ≡ 3<\/li><li>3 × 3 = 9 ≡ 9<\/li><\/ol><p>⇒ 3<sup>7<\/sup> mod 11 = <b>9<\/b><\/p><p><b>Y<sub>B<\/sub><\/b><\/p><p>5 in binary = 101<sub>2<\/sub>, so 5 = 4 + 1.<\/p><div class=\"tw\"><table class=\"wt\"><thead><tr><th>power<\/th><th>working<\/th><th>value mod 11<\/th><\/tr><\/thead><tbody><tr><td>3<sup>1<\/sup><\/td><td>3 mod 11<\/td><td>3<\/td><\/tr><tr><td>3<sup>2<\/sup><\/td><td>3<sup>2<\/sup> = 9 mod 11<\/td><td>9<\/td><\/tr><tr><td>3<sup>4<\/sup><\/td><td>9<sup>2<\/sup> = 81 mod 11<\/td><td>4<\/td><\/tr><\/tbody><\/table><\/div><p>3<sup>5<\/sup> = 3<sup>4<\/sup> × 3<sup>1<\/sup> ≡ 4 × 3 (mod 11)<\/p><ol class=\"steps\"><li>4 × 3 = 12 ≡ 1<\/li><\/ol><p>⇒ 3<sup>5<\/sup> mod 11 = <b>1<\/b><\/p><p><b>K (Alice)<\/b><\/p><p>7 in binary = 111<sub>2<\/sub>, so 7 = 4 + 2 + 1.<\/p><div class=\"tw\"><table class=\"wt\"><thead><tr><th>power<\/th><th>working<\/th><th>value mod 11<\/th><\/tr><\/thead><tbody><tr><td>1<sup>1<\/sup><\/td><td>1 mod 11<\/td><td>1<\/td><\/tr><tr><td>1<sup>2<\/sup><\/td><td>1<sup>2<\/sup> = 1 mod 11<\/td><td>1<\/td><\/tr><tr><td>1<sup>4<\/sup><\/td><td>1<sup>2<\/sup> = 1 mod 11<\/td><td>1<\/td><\/tr><\/tbody><\/table><\/div><p>1<sup>7<\/sup> = 1<sup>4<\/sup> × 1<sup>2<\/sup> × 1<sup>1<\/sup> ≡ 1 × 1 × 1 (mod 11)<\/p><ol class=\"steps\"><\/ol><p>⇒ 1<sup>7<\/sup> mod 11 = <b>1<\/b><\/p><p><b>K (Bob)<\/b><\/p><p>5 in binary = 101<sub>2<\/sub>, so 5 = 4 + 1.<\/p><div class=\"tw\"><table class=\"wt\"><thead><tr><th>power<\/th><th>working<\/th><th>value mod 11<\/th><\/tr><\/thead><tbody><tr><td>9<sup>1<\/sup><\/td><td>9 mod 11<\/td><td>9<\/td><\/tr><tr><td>9<sup>2<\/sup><\/td><td>9<sup>2<\/sup> = 81 mod 11<\/td><td>4<\/td><\/tr><tr><td>9<sup>4<\/sup><\/td><td>4<sup>2<\/sup> = 16 mod 11<\/td><td>5<\/td><\/tr><\/tbody><\/table><\/div><p>9<sup>5<\/sup> = 9<sup>4<\/sup> × 9<sup>1<\/sup> ≡ 5 × 9 (mod 11)<\/p><ol class=\"steps\"><li>5 × 9 = 45 ≡ 1<\/li><\/ol><p>⇒ 9<sup>5<\/sup> mod 11 = <b>1<\/b><\/p><\/details><p class='note'>Heads-up: 3 is <b>not<\/b> a primitive root mod 11 (3⁵ = 243 = 22×11 + 1 ≡ 1, order 5), so Bob's public value is 1 and the shared key collapses to 1. That's the correct arithmetic for the numbers given — and a nice point to mention: g must be a primitive root, otherwise the key space shrinks (here to a trivial key).<\/p><h4>ii.<\/h4><p><b>Yes.<\/b> Darth can use a single private key X<sub>D<\/sub> (public Y<sub>D<\/sub>) and send the same Y<sub>D<\/sub> to both Alice and Bob. He then computes K<sub>AD<\/sub> = Y<sub>A<\/sub><sup>X<sub>D<\/sub><\/sup> and K<sub>BD<\/sub> = Y<sub>B<\/sub><sup>X<sub>D<\/sub><\/sup> — still two different keys, so he can decrypt/re-encrypt in the middle. Two pairs are just the textbook description; one is enough.<\/p>", "k": "calc", "d": "dh", "id": 132}, {"t": "pk", "src": ["E5 C(a)"], "m": null, "q": "Consider a cryptosystem that uses the Diffie-Hellman protocol with g = 5 and p = 359. Alice chooses a = 97 and Bob chooses b = 223. Compute A, B, and the key.", "a": "<div class=\"ans\"><b>Answer:<\/b> Y<sub>A<\/sub> = 187, Y<sub>B<\/sub> = 352, shared key K = 306<\/div><ol class=\"steps\"><li>Alice: Y<sub>A<\/sub> = g<sup>X<sub>A<\/sub><\/sup> mod p = 5<sup>97<\/sup> mod 359 = <b>187<\/b><\/li><li>Bob: Y<sub>B<\/sub> = g<sup>X<sub>B<\/sub><\/sup> mod p = 5<sup>223<\/sup> mod 359 = <b>352<\/b><\/li><li>They swap Y<sub>A<\/sub>, Y<sub>B<\/sub> in public.<\/li><li>Alice: K = Y<sub>B<\/sub><sup>X<sub>A<\/sub><\/sup> mod p = 352<sup>97<\/sup> mod 359 = <b>306<\/b><\/li><li>Bob: K = Y<sub>A<\/sub><sup>X<sub>B<\/sub><\/sup> mod p = 187<sup>223<\/sup> mod 359 = <b>306<\/b> ✓ same<\/li><\/ol><details><summary>Square-and-multiply workings<\/summary><p><b>Y<sub>A<\/sub><\/b><\/p><p>97 in binary = 1100001<sub>2<\/sub>, so 97 = 64 + 32 + 1.<\/p><div class=\"tw\"><table class=\"wt\"><thead><tr><th>power<\/th><th>working<\/th><th>value mod 359<\/th><\/tr><\/thead><tbody><tr><td>5<sup>1<\/sup><\/td><td>5 mod 359<\/td><td>5<\/td><\/tr><tr><td>5<sup>2<\/sup><\/td><td>5<sup>2<\/sup> = 25 mod 359<\/td><td>25<\/td><\/tr><tr><td>5<sup>4<\/sup><\/td><td>25<sup>2<\/sup> = 625 mod 359<\/td><td>266<\/td><\/tr><tr><td>5<sup>8<\/sup><\/td><td>266<sup>2<\/sup> = 70756 mod 359<\/td><td>33<\/td><\/tr><tr><td>5<sup>16<\/sup><\/td><td>33<sup>2<\/sup> = 1089 mod 359<\/td><td>12<\/td><\/tr><tr><td>5<sup>32<\/sup><\/td><td>12<sup>2<\/sup> = 144 mod 359<\/td><td>144<\/td><\/tr><tr><td>5<sup>64<\/sup><\/td><td>144<sup>2<\/sup> = 20736 mod 359<\/td><td>273<\/td><\/tr><\/tbody><\/table><\/div><p>5<sup>97<\/sup> = 5<sup>64<\/sup> × 5<sup>32<\/sup> × 5<sup>1<\/sup> ≡ 273 × 144 × 5 (mod 359)<\/p><ol class=\"steps\"><li>273 × 144 = 39312 ≡ 181<\/li><li>181 × 5 = 905 ≡ 187<\/li><\/ol><p>⇒ 5<sup>97<\/sup> mod 359 = <b>187<\/b><\/p><p><b>Y<sub>B<\/sub><\/b><\/p><p>223 in binary = 11011111<sub>2<\/sub>, so 223 = 128 + 64 + 16 + 8 + 4 + 2 + 1.<\/p><div class=\"tw\"><table class=\"wt\"><thead><tr><th>power<\/th><th>working<\/th><th>value mod 359<\/th><\/tr><\/thead><tbody><tr><td>5<sup>1<\/sup><\/td><td>5 mod 359<\/td><td>5<\/td><\/tr><tr><td>5<sup>2<\/sup><\/td><td>5<sup>2<\/sup> = 25 mod 359<\/td><td>25<\/td><\/tr><tr><td>5<sup>4<\/sup><\/td><td>25<sup>2<\/sup> = 625 mod 359<\/td><td>266<\/td><\/tr><tr><td>5<sup>8<\/sup><\/td><td>266<sup>2<\/sup> = 70756 mod 359<\/td><td>33<\/td><\/tr><tr><td>5<sup>16<\/sup><\/td><td>33<sup>2<\/sup> = 1089 mod 359<\/td><td>12<\/td><\/tr><tr><td>5<sup>32<\/sup><\/td><td>12<sup>2<\/sup> = 144 mod 359<\/td><td>144<\/td><\/tr><tr><td>5<sup>64<\/sup><\/td><td>144<sup>2<\/sup> = 20736 mod 359<\/td><td>273<\/td><\/tr><tr><td>5<sup>128<\/sup><\/td><td>273<sup>2<\/sup> = 74529 mod 359<\/td><td>216<\/td><\/tr><\/tbody><\/table><\/div><p>5<sup>223<\/sup> = 5<sup>128<\/sup> × 5<sup>64<\/sup> × 5<sup>16<\/sup> × 5<sup>8<\/sup> × 5<sup>4<\/sup> × 5<sup>2<\/sup> × 5<sup>1<\/sup> ≡ 216 × 273 × 12 × 33 × 266 × 25 × 5 (mod 359)<\/p><ol class=\"steps\"><li>216 × 273 = 58968 ≡ 92<\/li><li>92 × 12 = 1104 ≡ 27<\/li><li>27 × 33 = 891 ≡ 173<\/li><li>173 × 266 = 46018 ≡ 66<\/li><li>66 × 25 = 1650 ≡ 214<\/li><li>214 × 5 = 1070 ≡ 352<\/li><\/ol><p>⇒ 5<sup>223<\/sup> mod 359 = <b>352<\/b><\/p><p><b>K (Alice)<\/b><\/p><p>97 in binary = 1100001<sub>2<\/sub>, so 97 = 64 + 32 + 1.<\/p><div class=\"tw\"><table class=\"wt\"><thead><tr><th>power<\/th><th>working<\/th><th>value mod 359<\/th><\/tr><\/thead><tbody><tr><td>352<sup>1<\/sup><\/td><td>352 mod 359<\/td><td>352<\/td><\/tr><tr><td>352<sup>2<\/sup><\/td><td>352<sup>2<\/sup> = 123904 mod 359<\/td><td>49<\/td><\/tr><tr><td>352<sup>4<\/sup><\/td><td>49<sup>2<\/sup> = 2401 mod 359<\/td><td>247<\/td><\/tr><tr><td>352<sup>8<\/sup><\/td><td>247<sup>2<\/sup> = 61009 mod 359<\/td><td>338<\/td><\/tr><tr><td>352<sup>16<\/sup><\/td><td>338<sup>2<\/sup> = 114244 mod 359<\/td><td>82<\/td><\/tr><tr><td>352<sup>32<\/sup><\/td><td>82<sup>2<\/sup> = 6724 mod 359<\/td><td>262<\/td><\/tr><tr><td>352<sup>64<\/sup><\/td><td>262<sup>2<\/sup> = 68644 mod 359<\/td><td>75<\/td><\/tr><\/tbody><\/table><\/div><p>352<sup>97<\/sup> = 352<sup>64<\/sup> × 352<sup>32<\/sup> × 352<sup>1<\/sup> ≡ 75 × 262 × 352 (mod 359)<\/p><ol class=\"steps\"><li>75 × 262 = 19650 ≡ 264<\/li><li>264 × 352 = 92928 ≡ 306<\/li><\/ol><p>⇒ 352<sup>97<\/sup> mod 359 = <b>306<\/b><\/p><p><b>K (Bob)<\/b><\/p><p>223 in binary = 11011111<sub>2<\/sub>, so 223 = 128 + 64 + 16 + 8 + 4 + 2 + 1.<\/p><div class=\"tw\"><table class=\"wt\"><thead><tr><th>power<\/th><th>working<\/th><th>value mod 359<\/th><\/tr><\/thead><tbody><tr><td>187<sup>1<\/sup><\/td><td>187 mod 359<\/td><td>187<\/td><\/tr><tr><td>187<sup>2<\/sup><\/td><td>187<sup>2<\/sup> = 34969 mod 359<\/td><td>146<\/td><\/tr><tr><td>187<sup>4<\/sup><\/td><td>146<sup>2<\/sup> = 21316 mod 359<\/td><td>135<\/td><\/tr><tr><td>187<sup>8<\/sup><\/td><td>135<sup>2<\/sup> = 18225 mod 359<\/td><td>275<\/td><\/tr><tr><td>187<sup>16<\/sup><\/td><td>275<sup>2<\/sup> = 75625 mod 359<\/td><td>235<\/td><\/tr><tr><td>187<sup>32<\/sup><\/td><td>235<sup>2<\/sup> = 55225 mod 359<\/td><td>298<\/td><\/tr><tr><td>187<sup>64<\/sup><\/td><td>298<sup>2<\/sup> = 88804 mod 359<\/td><td>131<\/td><\/tr><tr><td>187<sup>128<\/sup><\/td><td>131<sup>2<\/sup> = 17161 mod 359<\/td><td>288<\/td><\/tr><\/tbody><\/table><\/div><p>187<sup>223<\/sup> = 187<sup>128<\/sup> × 187<sup>64<\/sup> × 187<sup>16<\/sup> × 187<sup>8<\/sup> × 187<sup>4<\/sup> × 187<sup>2<\/sup> × 187<sup>1<\/sup> ≡ 288 × 131 × 235 × 275 × 135 × 146 × 187 (mod 359)<\/p><ol class=\"steps\"><li>288 × 131 = 37728 ≡ 33<\/li><li>33 × 235 = 7755 ≡ 216<\/li><li>216 × 275 = 59400 ≡ 165<\/li><li>165 × 135 = 22275 ≡ 17<\/li><li>17 × 146 = 2482 ≡ 328<\/li><li>328 × 187 = 61336 ≡ 306<\/li><\/ol><p>⇒ 187<sup>223<\/sup> mod 359 = <b>306<\/b><\/p><\/details>", "k": "calc", "d": "dh", "id": 133}, {"t": "pk", "src": ["E5 C(b)"], "m": null, "q": "Alice and Bob computed a secret key k using Diffie-Hellman with g = 4, p = 467, a = 400 and b = 134. Later they computed another secret key l with the same g, p, b and with a = 167. They found that k = l. Determine both keys and explain why they are identical.", "a": "<div class=\"ans\"><b>Answer:<\/b> k = l = 161<\/div><ol class=\"steps\"><li>B = 4<sup>134<\/sup> mod 467 = 51; k = B<sup>400<\/sup> mod 467 = 161; l = B<sup>167<\/sup> mod 467 = 161.<\/li><li>Why equal: 4 = 2² is a square, so its order divides (p − 1)/2 = 466/2 = 233 (by Euler/Fermat: 4<sup>233<\/sup> = 2<sup>466<\/sup> ≡ 1 mod 467).<\/li><li>In fact ord(4) = 233, so exponents only matter mod 233.<\/li><li>400 − 167 = 233 ⇒ 400 ≡ 167 (mod 233) ⇒ 4<sup>134·400<\/sup> ≡ 4<sup>134·167<\/sup> ⇒ k = l.<\/li><li>Lesson: g should be a primitive root (generator); g = 4 halves the key space.<\/li><\/ol>", "k": "calc", "d": "dh", "id": 134}, {"t": "pk", "src": ["T1B Q3(a)"], "m": 3, "q": "Diffie-Hellman is susceptible to a man-in-the-middle attack. Briefly explain how an adversary could instigate this attack.", "a": "<div class=\"ans\"><b>Answer:<\/b> The attacker intercepts each party's public value and substitutes his own, ending up with a separate shared key with each side.<\/div><ol class=\"steps\"><li>Darth creates his own private/public D-H key(s) X<sub>D1<\/sub>, X<sub>D2<\/sub> → Y<sub>D1<\/sub>, Y<sub>D2<\/sub>.<\/li><li>Alice sends Y<sub>A<\/sub> to Bob; Darth intercepts it and sends Y<sub>D1<\/sub> to Bob instead, and computes K<sub>2<\/sub> = Y<sub>A<\/sub><sup>X<sub>D2<\/sub><\/sup> (shared with Alice).<\/li><li>Bob computes K<sub>1<\/sub> = Y<sub>D1<\/sub><sup>X<sub>B<\/sub><\/sup>, thinking he shares it with Alice.<\/li><li>Bob sends Y<sub>B<\/sub>; Darth intercepts, sends Y<sub>D2<\/sub> to Alice and computes K<sub>1<\/sub> = Y<sub>B<\/sub><sup>X<sub>D1<\/sub><\/sup>.<\/li><li>Alice computes K<sub>2<\/sub> = Y<sub>D2<\/sub><sup>X<sub>A<\/sub><\/sup> thinking she shares it with Bob.<\/li><li>Now Darth decrypts every message with one key, reads/alters it, re-encrypts with the other and forwards — neither side notices.<\/li><li>Root cause: D-H has no authentication of the public values. Fix: sign them (digital signatures/certificates).<\/li><\/ol>", "k": "theory", "d": "dhmitm", "id": 135}, {"t": "pk", "src": ["SUP26 Q4(d)"], "m": 6, "q": "Explain how Diffie-Hellman establishes a shared secret and why authentication is required. [4,2]", "a": "<div class=\"ans\"><b>Answer:<\/b> Each side combines its own secret exponent with the other's public value to get g<sup>X<sub>A<\/sub>X<sub>B<\/sub><\/sup> mod p; without authentication a man-in-the-middle can substitute public values.<\/div><ol class=\"steps\"><li>Public parameters: a large prime p and a primitive root g.<\/li><li>Alice picks secret X<sub>A<\/sub>, sends Y<sub>A<\/sub> = g<sup>X<sub>A<\/sub><\/sup> mod p; Bob picks X<sub>B<\/sub>, sends Y<sub>B<\/sub> = g<sup>X<sub>B<\/sub><\/sup> mod p.<\/li><li>Both compute K = g<sup>X<sub>A<\/sub>X<sub>B<\/sub><\/sup> mod p: Alice as Y<sub>B<\/sub><sup>X<sub>A<\/sub><\/sup>, Bob as Y<sub>A<\/sub><sup>X<sub>B<\/sub><\/sup>.<\/li><li>An eavesdropper sees p, g, Y<sub>A<\/sub>, Y<sub>B<\/sub> but would need a discrete logarithm to get X<sub>A<\/sub> or X<sub>B<\/sub> — infeasible for large p.<\/li><li>Example (lecture): p = 353, g = 3, X<sub>A<\/sub> = 97, X<sub>B<\/sub> = 233 ⇒ Y<sub>A<\/sub> = 40, Y<sub>B<\/sub> = 248, K = 248<sup>97<\/sup> = 40<sup>233<\/sup> = 160 mod 353.<\/li><\/ol><p><b>Why authentication:<\/b> plain D-H never checks <i>whose<\/i> public value arrived, so Darth can run separate exchanges with each side (MITM). Signing the public values or using certificates fixes this.<\/p>", "k": "theory", "d": "dh", "id": 136}, {"t": "pk", "src": ["EX22 Q5(d)"], "m": 10, "q": "Diffie-Hellman (D-H) key exchange is used in TLS.<br>i. Briefly explain how the D-H algorithm works with an example. [6]<br>ii. Mention at least two limitations of D-H. [4]", "a": "<div class=\"ans\"><b>Answer:<\/b> D-H lets two parties agree a secret key over a public channel using modular exponentiation; it's unauthenticated and only exchanges keys.<\/div><h4>i.<\/h4><ol class=\"steps\"><li>Public parameters: a large prime p and a primitive root g.<\/li><li>Alice picks secret X<sub>A<\/sub>, sends Y<sub>A<\/sub> = g<sup>X<sub>A<\/sub><\/sup> mod p; Bob picks X<sub>B<\/sub>, sends Y<sub>B<\/sub> = g<sup>X<sub>B<\/sub><\/sup> mod p.<\/li><li>Both compute K = g<sup>X<sub>A<\/sub>X<sub>B<\/sub><\/sup> mod p: Alice as Y<sub>B<\/sub><sup>X<sub>A<\/sub><\/sup>, Bob as Y<sub>A<\/sub><sup>X<sub>B<\/sub><\/sup>.<\/li><li>An eavesdropper sees p, g, Y<sub>A<\/sub>, Y<sub>B<\/sub> but would need a discrete logarithm to get X<sub>A<\/sub> or X<sub>B<\/sub> — infeasible for large p.<\/li><li>Example (lecture): p = 353, g = 3, X<sub>A<\/sub> = 97, X<sub>B<\/sub> = 233 ⇒ Y<sub>A<\/sub> = 40, Y<sub>B<\/sub> = 248, K = 248<sup>97<\/sup> = 40<sup>233<\/sup> = 160 mod 353.<\/li><\/ol><h4>ii.<\/h4><ol class=\"steps\"><li><b>No authentication<\/b> ⇒ vulnerable to man-in-the-middle.<\/li><li>Only establishes a key — it can't encrypt messages or sign by itself.<\/li><li>Computationally expensive (modular exponentiation), can be abused for clogging/DoS attacks.<\/li><li>Security depends on good parameters (large p, proper generator); weak or reused parameters (e.g. Logjam) are breakable.<\/li><\/ol>", "k": "theory", "d": "dh", "id": 137}, {"t": "pk", "src": ["EX25 Q4(c)", "T2B Q2(c)"], "m": 5, "q": "Explain how Diffie-Hellman key exchange, combined with (RSA) digital signatures, prevents (achieves authentication against) Man-in-the-Middle attacks. Provide the exact sequence of exchanged messages and state your assumptions. <span class='note'>(T2B also asks: explain how digital signatures offer non-repudiation [2].)<\/span>", "a": "<div class=\"ans\"><b>Answer:<\/b> Each side signs its D-H public value with its private key; the other verifies with the sender's certified public key, so a substituted value is rejected.<\/div><ol class=\"steps\"><li><b>Assumption:<\/b> Alice and Bob already have each other's authentic RSA public keys (e.g. via CA certificates).<\/li><li>1. Alice → Bob: Y<sub>A<\/sub>, Sig<sub>A<\/sub> = E(PR<sub>A<\/sub>, H(Y<sub>A<\/sub> ‖ IDs ‖ nonce/timestamp))<\/li><li>2. Bob verifies Sig<sub>A<\/sub> with PU<sub>A<\/sub>. Bob → Alice: Y<sub>B<\/sub>, Sig<sub>B<\/sub> = E(PR<sub>B<\/sub>, H(Y<sub>B<\/sub> ‖ Y<sub>A<\/sub> ‖ IDs))<\/li><li>3. Alice verifies Sig<sub>B<\/sub> with PU<sub>B<\/sub>; both compute K = g<sup>X<sub>A<\/sub>X<sub>B<\/sub><\/sup> mod p.<\/li><li>Darth can still intercept, but he can't produce a valid signature on his own Y<sub>D<\/sub> without PR<sub>A<\/sub>/PR<sub>B<\/sub> — substitution is detected ⇒ MITM prevented.<\/li><li>Including the other side's Y and a nonce/timestamp stops replay of old signed values.<\/li><\/ol><p><b>Non-repudiation (T2B):<\/b> only the signer holds the private key, so a valid signature can be checked by any third party with the public key, and the signer cannot later deny creating it.<\/p>", "k": "theory", "d": "dhsig", "id": 138}, {"t": "pk", "src": ["EX24 Q5(d)"], "m": 2, "q": "Explain why practically Diffie-Hellman is often used in conjunction with RSA.", "a": "<div class=\"ans\"><b>Answer:<\/b> D-H gives the session key (with forward secrecy) but no authentication; RSA signatures/certificates authenticate the D-H values.<\/div><ol class=\"steps\"><li>D-H alone is open to MITM; RSA signatures over the D-H public values prove who sent them (e.g. TLS DHE_RSA).<\/li><li>Using fresh (ephemeral) D-H keys gives forward secrecy, which RSA key transport alone doesn't.<\/li><\/ol>", "k": "theory", "d": null, "id": 139}, {"t": "pk", "src": ["EX24 Q5(b)(ii)"], "m": 1, "q": "When would it be preferable to use RSA over Diffie-Hellman?", "a": "<div class=\"ans\"><b>Answer:<\/b> When you need to encrypt a message/key directly or create digital signatures (or need non-interactive, one-way communication like email) — D-H can only agree a key interactively.<\/div>", "k": "theory", "d": null, "id": 140}, {"t": "pk", "src": ["T2B Q2(a)"], "m": 12, "q": "Differentiate between RSA and Diffie–Hellman in terms of: i. Key generation [4] ii. Encryption method [4] iii. Security basis [4]", "a": "<div class=\"ans\"><b>Answer:<\/b> RSA: prime-based key pair, encrypts/signs, factoring. D-H: exponent-based key agreement only, discrete log.<\/div><div class=\"tw\"><table class=\"wt\"><thead><tr><th><\/th><th>RSA<\/th><th>Diffie–Hellman<\/th><\/tr><\/thead><tbody><tr><td>Key generation<\/td><td>Pick primes p, q; n = pq; φ(n); public e coprime to φ(n); private d = e<sup>−1<\/sup> mod φ(n). Long-term key pair.<\/td><td>Agree public p and generator g; each party picks random secret X and publishes Y = g<sup>X<\/sup> mod p (often fresh/ephemeral each session).<\/td><\/tr><tr><td>Encryption method<\/td><td>Can encrypt directly: c = m<sup>e<\/sup> mod n, m = c<sup>d<\/sup> mod n; also signs (s = m<sup>d<\/sup>).<\/td><td>Does not encrypt messages — only produces a shared secret K = g<sup>X<sub>A<\/sub>X<sub>B<\/sub><\/sup> mod p used as a symmetric key.<\/td><\/tr><tr><td>Security basis<\/td><td>Integer factorisation problem (hard to factor n).<\/td><td>Discrete logarithm problem (hard to find X from g<sup>X<\/sup> mod p).<\/td><\/tr><\/tbody><\/table><\/div>", "k": "theory", "d": null, "id": 141}, {"t": "pk", "src": ["EX24 Q5(c)"], "m": 7, "q": "Using the ElGamal cryptosystem, show the message that Bob will send to Alice given: q = 17, α (a primitive root mod q) = 11, and Alice's private key exponent X<sub>A<\/sub> = 7. Also assume Bob selected k = 5 and message hash m = 12. Also show the recovered message.", "a": "<div class=\"ans\"><b>Answer:<\/b> Bob sends (C<sub>1<\/sub>, C<sub>2<\/sub>) = (10, 9); Alice recovers M = 12<\/div><ol class=\"steps\"><li>Alice's public key: Y<sub>A<\/sub> = α<sup>X<sub>A<\/sub><\/sup> mod q = 11<sup>7<\/sup> mod 17 = <b>3<\/b>  (11² = 121 ≡ 2, 11⁴ ≡ 4, 11⁷ = 11⁴·11²·11 ≡ 4·2·11 = 88 ≡ 3)<\/li><li>One-time key K = Y<sup>k<\/sup> mod q = 3<sup>5<\/sup> mod 17 = <b>5<\/b><\/li><li>C<sub>1<\/sub> = α<sup>k<\/sup> mod q = 11<sup>5<\/sup> mod 17 = <b>10<\/b><\/li><li>C<sub>2<\/sub> = K·M mod q = 5 × 12 = 60 mod 17 = <b>9<\/b><\/li><li><b>Decryption by Alice:<\/b><\/li><li>Recover K = C<sub>1<\/sub><sup>x<\/sup> mod p = 10<sup>7<\/sup> mod 17 = <b>5<\/b><\/li><li>K<sup>−1<\/sup> mod 17 = 7 (check 5 × 7 = 35 ≡ 1)<\/li><li>M = C<sub>2<\/sub>·K<sup>−1<\/sup> mod p = 9 × 7 = 63 mod 17 = <b>12<\/b><\/li><\/ol>", "k": "calc", "d": "elgamal", "id": 142}, {"t": "pk", "src": ["T2B Q2(b)"], "m": 5, "q": "Using the ElGamal cryptosystem, show the message that Alice will send to Bob given: plaintext message m = 11 and k = 3. Bob's parameters: p = 23, α (a primitive root mod p) = 5, and public key exponent = 10.", "a": "<div class=\"ans\"><b>Answer:<\/b> Alice sends (C<sub>1<\/sub>, C<sub>2<\/sub>) = (10, 6)<\/div><ol class=\"steps\"><li>Bob's public key Y<sub>B<\/sub> = 10 (the 'public key' value; Bob's secret exponent stays private).<\/li><li>One-time key K = Y<sup>k<\/sup> mod q = 10<sup>3<\/sup> mod 23 = <b>11<\/b><\/li><li>C<sub>1<\/sub> = α<sup>k<\/sup> mod q = 5<sup>3<\/sup> mod 23 = <b>10<\/b><\/li><li>C<sub>2<\/sub> = K·M mod q = 11 × 11 = 121 mod 23 = <b>6<\/b><\/li><li>Workings: 10<sup>3<\/sup> = 1000 = 43×23 + 11 ⇒ K = 11; 5<sup>3<\/sup> = 125 = 5×23 + 10 ⇒ C<sub>1<\/sub> = 10; 11 × 11 = 121 = 5×23 + 6 ⇒ C<sub>2<\/sub> = 6.<\/li><\/ol>", "k": "calc", "d": "elgamal", "id": 143}, {"t": "pk", "src": ["T1B Q3(b)"], "m": 4, "q": "Using the ElGamal cryptosystem, encrypt message m = 138. Assume p = 257, a primitive root mod p = 3, and public key exponent = 112.", "a": "<div class=\"ans\"><b>Answer:<\/b> With random k = 5: ciphertext (C<sub>1<\/sub>, C<sub>2<\/sub>) = (243, 84)<\/div><ol class=\"steps\"><li>The paper gives no random k, so the sender picks one: choose k = 5 (any 1 ≤ k ≤ p − 2 works; you get marks for the method). Receiver's public key Y = 112.<\/li><li>One-time key K = Y<sup>k<\/sup> mod q = 112<sup>5<\/sup> mod 257 = <b>90<\/b><\/li><li>C<sub>1<\/sub> = α<sup>k<\/sup> mod q = 3<sup>5<\/sup> mod 257 = <b>243<\/b><\/li><li>C<sub>2<\/sub> = K·M mod q = 90 × 138 = 12420 mod 257 = <b>84<\/b><\/li><li>3<sup>5<\/sup> = 243 ⇒ C<sub>1<\/sub> = 243. 112² = 12544 ≡ 208, 112⁴ ≡ 208² = 43264 ≡ 88, 112⁵ ≡ 88 × 112 = 9856 ≡ 90 (mod 257).<\/li><\/ol>", "k": "calc", "d": "elgamal", "id": 144}, {"t": "pk", "src": ["E6 A"], "m": null, "q": "Consider an ElGamal cryptosystem with public key (p, g, y) and private key x.<br>a) Encrypt the message m = 15 using p = 31, g = 7, x = 3 and r = 4 (r = sender's random number).<br>b) Decrypt the ciphertext c = (28, 9) using p = 107, g = 2, x = 67.<br>c) Decrypt the ciphertext c = (68, 18) using p = 71, g = 33, x = 62.", "a": "<div class=\"ans\"><b>Answer:<\/b> a) (14, 23) &nbsp; b) m = 66 &nbsp; c) m = 25<\/div><h4>a)<\/h4><ol class=\"steps\"><li>y = g<sup>x<\/sup> mod p = 7³ = 343 = 11×31 + 2 ⇒ y = 2<\/li><li>One-time key K = Y<sup>k<\/sup> mod p = 2<sup>4<\/sup> mod 31 = <b>16<\/b><\/li><li>C<sub>1<\/sub> = g<sup>k<\/sup> mod p = 7<sup>4<\/sup> mod 31 = <b>14<\/b><\/li><li>C<sub>2<\/sub> = K·M mod p = 16 × 15 = 240 mod 31 = <b>23<\/b><\/li><\/ol><h4>b)<\/h4><ol class=\"steps\"><li>Recover K = C<sub>1<\/sub><sup>x<\/sup> mod p = 28<sup>67<\/sup> mod 107 = <b>5<\/b><\/li><li>K<sup>−1<\/sup> mod 107 = 43 (check 5 × 43 = 215 ≡ 1)<\/li><li>M = C<sub>2<\/sub>·K<sup>−1<\/sup> mod p = 9 × 43 = 387 mod 107 = <b>66<\/b><\/li><\/ol><h4>c)<\/h4><ol class=\"steps\"><li>Recover K = C<sub>1<\/sub><sup>x<\/sup> mod p = 68<sup>62<\/sup> mod 71 = <b>49<\/b><\/li><li>K<sup>−1<\/sup> mod 71 = 29 (check 49 × 29 = 1421 ≡ 1)<\/li><li>M = C<sub>2<\/sub>·K<sup>−1<\/sup> mod p = 18 × 29 = 522 mod 71 = <b>25<\/b><\/li><\/ol>", "k": "calc", "d": "elgamal", "id": 145}, {"t": "pk", "src": ["PZ Q4(c)(d)"], "m": 13, "q": "c) ElGamal, similar to RSA, is a public key cryptosystem. Is the basis for regarding these two algorithms secure the same? [2]<br>d) Consider a simple ElGamal encryption example with prime modulus p = 29, generator g = 3 and private key x = 8.<br>i. Determine the public key value y. [2]<br>ii. Give the ciphertext (c<sub>1<\/sub>, c<sub>2<\/sub>) resulting from encrypting the message m = 13 with the ephemeral key r = 2. [3]<br>iii. Give the plaintext m resulting from decrypting the ciphertext (8, 22). [6]", "a": "<div class=\"ans\"><b>Answer:<\/b> c) No — RSA: factoring; ElGamal: discrete log. d) i. y = 7 ii. (9, 28) iii. m = 4<\/div><h4>c)<\/h4><p><b>No.<\/b> RSA relies on the difficulty of <b>factoring<\/b> n = pq; ElGamal relies on the difficulty of the <b>discrete logarithm<\/b> problem (finding x from g<sup>x<\/sup> mod p), like Diffie–Hellman.<\/p><h4>d) i.<\/h4><p>y = 3<sup>8<\/sup> mod 29: 3⁴ = 81 = 2×29 + 23 ⇒ 23; 3⁸ = 23² = 529 = 18×29 + 7 ⇒ <b>y = 7<\/b><\/p><h4>ii.<\/h4><ol class=\"steps\"><li>One-time key K = Y<sup>k<\/sup> mod p = 7<sup>2<\/sup> mod 29 = <b>20<\/b><\/li><li>C<sub>1<\/sub> = g<sup>k<\/sup> mod p = 3<sup>2<\/sup> mod 29 = <b>9<\/b><\/li><li>C<sub>2<\/sub> = K·M mod p = 20 × 13 = 260 mod 29 = <b>28<\/b><\/li><\/ol><h4>iii.<\/h4><ol class=\"steps\"><li>Recover K = C<sub>1<\/sub><sup>x<\/sup> mod p = 8<sup>8<\/sup> mod 29 = <b>20<\/b><\/li><li>K<sup>−1<\/sup> mod 29 = 16 (check 20 × 16 = 320 ≡ 1)<\/li><li>M = C<sub>2<\/sub>·K<sup>−1<\/sup> mod p = 22 × 16 = 352 mod 29 = <b>4<\/b><\/li><\/ol>", "k": "calc", "d": "elgamal", "id": 146}, {"t": "pk", "src": ["T2A Q3(e)"], "m": 8, "q": "Using the ElGamal cryptosystem, show the signature that Alice will send to Bob given: q = 19, α (a primitive root mod q) = 13, and private key exponent X<sub>A<\/sub> = 7. Also assume Alice selected K as 5 and message hash m = 10. Also, verify the signature.", "a": "<div class=\"ans\"><b>Answer:<\/b> (S<sub>1<\/sub>, S<sub>2<\/sub>) = (14, 4)<\/div><ol class=\"steps\"><li>Public key Y<sub>A<\/sub> = α<sup>X<sub>A<\/sub><\/sup> mod q = 13<sup>7<\/sup> mod 19 = <b>10<\/b><\/li><li>Check gcd(K, q − 1) = gcd(5, 18) = 1 ✓<\/li><li>S<sub>1<\/sub> = α<sup>K<\/sup> mod q = 13<sup>5<\/sup> mod 19 = <b>14<\/b><\/li><li>K<sup>−1<\/sup> mod (q − 1) = 5<sup>−1<\/sup> mod 18 = 11 (check 5 × 11 = 55 ≡ 1 mod 18)<\/li><li>S<sub>2<\/sub> = K<sup>−1<\/sup>(m − X<sub>A<\/sub>S<sub>1<\/sub>) mod (q − 1) = 11 × (10 − 7×14) = 11 × (-88) = -968 mod 18 = <b>4<\/b><\/li><li>Signature sent with m: (S<sub>1<\/sub>, S<sub>2<\/sub>) = (14, 4)<\/li><li><b>Verification<\/b> (Bob, using public Y<sub>A<\/sub>):<\/li><li>V<sub>1<\/sub> = α<sup>m<\/sup> mod q = 13<sup>10<\/sup> mod 19 = <b>6<\/b><\/li><li>V<sub>2<\/sub> = Y<sub>A<\/sub><sup>S<sub>1<\/sub><\/sup>·S<sub>1<\/sub><sup>S<sub>2<\/sub><\/sup> mod q = 10<sup>14<\/sup> × 14<sup>4<\/sup> = 16 × 17 mod 19 = <b>6<\/b><\/li><li>V<sub>1<\/sub> = V<sub>2<\/sub> = 6 ⇒ signature valid ✓<\/li><\/ol>", "k": "calc", "d": "elgsig", "id": 147}, {"t": "pk", "src": ["EX25 Q4(d)"], "m": 6, "q": "Using the ElGamal signature scheme, show the signature that Alice will send to Bob given: q = 19, α (a primitive root mod q) = 10, and private key exponent = 7. Also assume Alice selected K as 5 and message hash m = 15.", "a": "<div class=\"ans\"><b>Answer:<\/b> (S<sub>1<\/sub>, S<sub>2<\/sub>) = (3, 6)<\/div><ol class=\"steps\"><li>Public key Y<sub>A<\/sub> = α<sup>X<sub>A<\/sub><\/sup> mod q = 10<sup>7<\/sup> mod 19 = <b>15<\/b><\/li><li>Check gcd(K, q − 1) = gcd(5, 18) = 1 ✓<\/li><li>S<sub>1<\/sub> = α<sup>K<\/sup> mod q = 10<sup>5<\/sup> mod 19 = <b>3<\/b><\/li><li>K<sup>−1<\/sup> mod (q − 1) = 5<sup>−1<\/sup> mod 18 = 11 (check 5 × 11 = 55 ≡ 1 mod 18)<\/li><li>S<sub>2<\/sub> = K<sup>−1<\/sup>(m − X<sub>A<\/sub>S<sub>1<\/sub>) mod (q − 1) = 11 × (15 − 7×3) = 11 × (-6) = -66 mod 18 = <b>6<\/b><\/li><li>Signature sent with m: (S<sub>1<\/sub>, S<sub>2<\/sub>) = (3, 6)<\/li><li><b>Verification<\/b> (Bob, using public Y<sub>A<\/sub>):<\/li><li>V<sub>1<\/sub> = α<sup>m<\/sup> mod q = 10<sup>15<\/sup> mod 19 = <b>8<\/b><\/li><li>V<sub>2<\/sub> = Y<sub>A<\/sub><sup>S<sub>1<\/sub><\/sup>·S<sub>1<\/sub><sup>S<sub>2<\/sub><\/sup> mod q = 15<sup>3<\/sup> × 3<sup>6<\/sup> = 12 × 7 mod 19 = <b>8<\/b><\/li><li>V<sub>1<\/sub> = V<sub>2<\/sub> = 8 ⇒ signature valid ✓<\/li><\/ol>", "k": "calc", "d": "elgsig", "id": 148}, {"t": "pk", "src": ["EXAB Q6(c)(d)"], "m": 13, "q": "c) ElGamal and RSA are examples of public key algorithms. Is the basis for regarding these two algorithms secure the same? [2]<br>d) Consider a very simple ElGamal example with prime modulus p = 29, generator g = 8 and private key x = 5.<br>i. Determine the public key value y. [2]<br>ii. Give the ciphertext (c<sub>1<\/sub>, c<sub>2<\/sub>) resulting from encrypting the message m = 11 with the ephemeral key r = 2. [3]<br>iii. Give the digital signature value (s<sub>1<\/sub>, s<sub>2<\/sub>) for the message digest value h(m) = 27 with the ephemeral key k = 3. [6]", "a": "<div class=\"ans\"><b>Answer:<\/b> c) No (factoring vs discrete log). d) i. y = 27 ii. (6, 15) iii. (19, 24)<\/div><h4>c)<\/h4><p>No: RSA → difficulty of factoring n; ElGamal → difficulty of discrete logarithms mod p.<\/p><h4>d) i.<\/h4><p>y = 8<sup>5<\/sup> mod 29: 8² = 64 ≡ 6, 8⁴ ≡ 36 ≡ 7, 8⁵ ≡ 7 × 8 = 56 ≡ <b>27<\/b><\/p><h4>ii.<\/h4><ol class=\"steps\"><li>One-time key K = Y<sup>k<\/sup> mod p = 27<sup>2<\/sup> mod 29 = <b>4<\/b><\/li><li>C<sub>1<\/sub> = g<sup>k<\/sup> mod p = 8<sup>2<\/sup> mod 29 = <b>6<\/b><\/li><li>C<sub>2<\/sub> = K·M mod p = 4 × 11 = 44 mod 29 = <b>15<\/b><\/li><\/ol><h4>iii.<\/h4><ol class=\"steps\"><li>s<sub>1<\/sub> = g<sup>k<\/sup> mod p = 8<sup>3<\/sup> = 512 = 17×29 + 19 ⇒ <b>19<\/b><\/li><li>k<sup>−1<\/sup> mod (p − 1) = 3<sup>−1<\/sup> mod 28 = 19 (3 × 19 = 57 = 2×28 + 1)<\/li><li>s<sub>2<\/sub> = k<sup>−1<\/sup>(h(m) − x·s<sub>1<\/sub>) mod 28 = 19 × (27 − 5×19) = 19 × (-68) = -1292 mod 28 = <b>24<\/b><\/li><li>Verify: g<sup>h<\/sup> = 8<sup>27<\/sup> ≡ 11; y<sup>s1<\/sup>·s1<sup>s2<\/sup> = 27<sup>19<\/sup>·19<sup>24<\/sup> ≡ 11 (mod 29) ✓<\/li><\/ol>", "k": "calc", "d": "elgsig", "id": 149}, {"t": "pk", "src": ["E7 B"], "m": null, "q": "a) Simple RSA signature: n = 55, e = 17. i. Find d. ii. Sign h(m) = 35. iii. If s = 37, what is h(m)?<br>b) Simple ElGamal signature: p = 31, g = 3, x = 13. i. Find y. ii. Sign h(m) = 27 with k = 7. iii. Verify that (17, 28) is a valid signature for h(m) = 27 with y = 24.<br>c) Simple DSA: p = 31, q = 5, h = 4, x = 17. i. Find y. ii. Sign h(m) = 27 with k = 13. iii. Verify that (2, 2) is a valid signature for h(m) = 27 and y = 16.", "a": "<div class=\"ans\"><b>Answer:<\/b> a) d = 33, s = 30, h(m) = 27 &nbsp; b) y = 24, (17, 28), valid ✓ &nbsp; c) y = 16, (2, 2), valid ✓<\/div><h4>a) RSA<\/h4><ol class=\"steps\"><li>n = p × q = 5 × 11 = <b>55<\/b><\/li><li>φ(n) = (p − 1)(q − 1) = 4 × 10 = <b>40<\/b><\/li><li>e = 17: gcd(17, 40) = 1 ✓ (e must be coprime to φ(n))<\/li><li>d = e<sup>−1<\/sup> mod φ(n) (solve 17d ≡ 1 mod 40) using extended Euclid:<\/li><\/ol><ol class=\"steps\"><li>40 = 2 × 17 + 6<\/li><li>17 = 2 × 6 + 5<\/li><li>6 = 1 × 5 + 1<\/li><li>5 = 5 × 1 + 0<\/li><\/ol><p>Back-substitute:<\/p><ol class=\"steps\"><li>1 = 6 − 1 × 5<\/li><li>1 = −1 × 17 + (3) × 6<\/li><li>1 = 3 × 40 − (7) × 17<\/li><\/ol><p>⇒ d = 17<sup>−1<\/sup> mod 40 = <b>33<\/b>. Check: 17 × 33 = 561 = 14 × 40 + 1 ✓<\/p><ol class=\"steps cont\"><li>s = h(m)<sup>d<\/sup> mod n = 35<sup>33<\/sup> mod 55 = <b>30<\/b><\/li><li>h(m) = s<sup>e<\/sup> mod n = 37<sup>17<\/sup> mod 55 = <b>27<\/b><\/li><\/ol><h4>b) ElGamal<\/h4><ol class=\"steps\"><li>y = 3<sup>13<\/sup> mod 31 = <b>24<\/b><\/li><li>s<sub>1<\/sub> = g<sup>k<\/sup> = 3<sup>7<\/sup> mod 31 = <b>17<\/b><\/li><li>k<sup>−1<\/sup> mod 30 = 7<sup>−1<\/sup> = 13 (7×13 = 91 = 3×30 + 1)<\/li><li>s<sub>2<\/sub> = 13 × (27 − 13×17) mod 30 = 13 × (-194) = -2522 mod 30 = <b>28<\/b><\/li><li>Verify (17, 28): g<sup>h<\/sup> = 3<sup>27<\/sup> mod 31 = 23; y<sup>s1<\/sup>s1<sup>s2<\/sup> = 24<sup>17<\/sup> × 17<sup>28<\/sup> mod 31 = 13 × 28 ≡ 23 ⇒ equal ✓ valid<\/li><\/ol><h4>c) DSA<\/h4><ol class=\"steps\"><li>g = h<sup>(p−1)/q<\/sup> mod p = 4<sup>6<\/sup> mod 31 = 4096 mod 31 = <b>4<\/b><\/li><li>y = g<sup>x<\/sup> mod p = 4<sup>17<\/sup> mod 31 = <b>16<\/b><\/li><li>r = (g<sup>k<\/sup> mod p) mod q = (4<sup>13<\/sup> mod 31) mod 5 = 2 mod 5 = <b>2<\/b><\/li><li>k<sup>−1<\/sup> mod q = 13<sup>−1<\/sup> mod 5 = 3<sup>−1<\/sup> = 2<\/li><li>s = k<sup>−1<\/sup>(h + x·r) mod q = 2 × (27 + 17×2) = 122 mod 5 = <b>2<\/b><\/li><li>Verify (2, 2), y = 16: w = s<sup>−1<\/sup> mod 5 = 3; u1 = h·w mod q = 27×3 mod 5 = 1; u2 = r·w mod q = 2×3 mod 5 = 1<\/li><li>v = (g<sup>u1<\/sup>·y<sup>u2<\/sup> mod p) mod q = (4<sup>1<\/sup>·16<sup>1<\/sup> mod 31) mod 5 = 2 mod 5 = 2 = r ✓ valid<\/li><\/ol>", "k": "calc", "d": "elgsig", "id": 150}, {"t": "pk", "src": ["T2A Q2(a)"], "m": 4, "q": "Give any two broad categories of applications of public-key cryptosystems. Also explain why secret-key cryptosystems would not be appropriate for each category.", "a": "<div class=\"ans\"><b>Answer:<\/b> 1. Key distribution/exchange; 2. Digital signatures (also encryption of small messages).<\/div><ol class=\"steps\"><li><b>Key exchange / distribution<\/b> (D-H, RSA key transport): two strangers can agree a session key over an open network. Secret-key systems can't: they already need a shared secret to start — the very thing being distributed.<\/li><li><b>Digital signatures<\/b>: only the private-key holder can sign, everyone can verify ⇒ non-repudiation. With a secret key both parties hold the same key, so either could have produced the 'signature' — no non-repudiation.<\/li><li>(Third category: encryption/decryption of short messages to anyone using their public key without prior contact.)<\/li><\/ol>", "k": "theory", "d": null, "id": 151}, {"t": "pk", "src": ["EXAB Q6(a)"], "m": 3, "q": "Public key cryptography is more ideal for a multi-user environment where users are distributed in different locations. What makes public key cryptography more ideal in that context? And why, then, do we still use private key cryptography?", "a": "<div class=\"ans\"><b>Answer:<\/b> Public keys can be published, so n users need only n key pairs and no prior secret sharing; but private-key crypto is far faster, so it's used for the bulk data.<\/div><ol class=\"steps\"><li>With symmetric keys every pair of users needs its own secret: n(n − 1)/2 keys, each delivered securely — impractical when users are spread out.<\/li><li>With public keys each user has one pair (n pairs total), publishes the public key (directory/certificate), and anyone can encrypt to them or verify their signatures.<\/li><li>But public-key operations are ~1000× slower and produce larger ciphertexts, so in practice (hybrid systems, e.g. TLS) public-key crypto exchanges a session key and symmetric AES encrypts the data.<\/li><\/ol>", "k": "theory", "d": null, "id": 152}, {"t": "pk", "src": ["T1D Q1(a)"], "m": 6, "q": "Public and shared-key cryptography complement each other.<br>i. Give one practical application of each of public key and shared key cryptography. Also, provide an example algorithm/standard that falls under each category. [2,2]<br>ii. Explain how each of the cryptosystems is used to offer confidentiality. [2]", "a": "<div class=\"ans\"><b>Answer:<\/b> Public key: key exchange/digital signatures (RSA, D-H); shared key: bulk data encryption (AES).<\/div><ol class=\"steps\"><li><b>Public key:<\/b> exchanging session keys / signing software updates in TLS — RSA, Diffie–Hellman, ElGamal, DSA.<\/li><li><b>Shared (symmetric) key:<\/b> encrypting stored files, Wi-Fi (WPA2) or the bulk traffic of a TLS session — AES, 3DES.<\/li><li><b>Confidentiality with public key:<\/b> sender encrypts with the <i>receiver's public key<\/i>; only the receiver's private key can decrypt.<\/li><li><b>Confidentiality with shared key:<\/b> both parties hold the same secret key; sender encrypts with it and only someone with the key can decrypt.<\/li><\/ol>", "k": "theory", "d": null, "id": 153}, {"t": "hash", "src": ["T2A Q3(a)"], "m": 3, "q": "Name and briefly explain three increasingly demanding security properties expected from a secure hash function h.", "a": "<div class=\"ans\"><b>Answer:<\/b> Preimage resistance → second-preimage (weak collision) resistance → collision (strong collision) resistance.<\/div><ol class=\"steps\"><li><b>Preimage resistance (one-way):<\/b> given h, it is infeasible to find any x with H(x) = h.<\/li><li><b>Second-preimage resistance (weak collision resistance):<\/b> given x, infeasible to find y ≠ x with H(y) = H(x).<\/li><li><b>Collision resistance (strong collision resistance):<\/b> infeasible to find <i>any<\/i> pair x ≠ y with H(x) = H(y). This is the most demanding (attacker chooses both inputs; birthday attack needs only ~2<sup>n/2<\/sup> work).<\/li><\/ol>", "k": "theory", "d": null, "id": 154}, {"t": "hash", "src": ["T2A Q3(b)"], "m": 2, "q": "Determine the value of the padding field in SHA-512 if the length of the message is 2940 bits.", "a": "<div class=\"ans\"><b>Answer:<\/b> Padding = 4 bits: a single 1 followed by 3 zeros (i.e. 1000)<\/div><ol class=\"steps\"><li>SHA-512 pads so that (length + padding) ≡ 896 (mod 1024), leaving 128 bits for the length field. Padding is always 1 to 1024 bits: one '1' then '0's.<\/li><li>2940 mod 1024 = 892 (since 2940 = 2 × 1024 + 892)<\/li><li>Padding = 896 − 892 = <b>4<\/b> bits ⇒ 1000<\/li><li>Total = 2940 + 4 + 128 = 3072 = 3 × 1024 ✓ (a whole number of 1024-bit blocks)<\/li><\/ol>", "k": "calc", "d": null, "id": 155}, {"t": "hash", "src": ["EX24 Q4(c)"], "m": 2, "q": "Determine the value of the padding field in SHA-512 if the length of the message is 3665 bits.", "a": "<div class=\"ans\"><b>Answer:<\/b> Padding = 303 bits: a single 1 followed by 302 zeros<\/div><ol class=\"steps\"><li>SHA-512 pads so that (length + padding) ≡ 896 (mod 1024), leaving 128 bits for the length field. Padding is always 1 to 1024 bits: one '1' then '0's.<\/li><li>3665 mod 1024 = 593 (since 3665 = 3 × 1024 + 593)<\/li><li>Padding = 896 − 593 = <b>303<\/b> bits ⇒ 1 followed by 302 zeros<\/li><li>Total = 3665 + 303 + 128 = 4096 = 4 × 1024 ✓ (a whole number of 1024-bit blocks)<\/li><\/ol>", "k": "calc", "d": null, "id": 156}, {"t": "hash", "src": ["T2A Q3(c)(d)"], "m": 9, "q": "Let M be a confidential email that Alice wants to send to Bob, PU<sub>B<\/sub> Bob's encryption public key and PR<sub>A<\/sub> Alice's private key. Explain if each option would be appropriate to provide confidentiality and integrity to emails: [2,2,2]<br>i. Send E<sub>PUB<\/sub>(M) ‖ E<sub>PRA<\/sub>(M)<br>ii. Send E<sub>PUB<\/sub>(M) ‖ E<sub>PRA<\/sub>(H(M))<br>iii. Send E<sub>PUB<\/sub>(E<sub>PRA<\/sub>(H(M)))<br>d) Bob seeks to stop Alice later denying being part of the communication: i. Name this service. [1] ii. In what order should the signature function and the confidentiality function be applied to the message? Explain. [2]", "a": "<div class=\"ans\"><b>Answer:<\/b> i. Not appropriate (leaks M) &nbsp; ii. Appropriate &nbsp; iii. Not appropriate (M never sent) &nbsp; d) Non-repudiation; sign first, then encrypt.<\/div><ol class=\"steps\"><li><b>i.<\/b> E<sub>PUB<\/sub>(M) is confidential, but E<sub>PRA<\/sub>(M) can be decrypted by <i>anyone<\/i> with Alice's public key ⇒ M is exposed. Gives authentication but <b>no confidentiality<\/b> ✗<\/li><li><b>ii.<\/b> E<sub>PUB<\/sub>(M) gives confidentiality (only Bob can decrypt); E<sub>PRA<\/sub>(H(M)) is a signature on the hash — Bob recomputes H(M) and checks it ⇒ integrity + authentication; the hash doesn't reveal M ✓<\/li><li><b>iii.<\/b> Only the signed hash is sent; Bob can verify a hash but never receives M itself (a hash can't be reversed) ✗<\/li><li><b>d) i.<\/b> <b>Non-repudiation<\/b> (provided by a digital signature).<\/li><li><b>d) ii.<\/b> <b>Sign first, then encrypt<\/b>: E<sub>PUB<\/sub>(M ‖ E<sub>PRA<\/sub>(H(M))). The signature is then on the plaintext Alice actually wrote, so Bob can later show M and the signature to a third party (judge) without revealing his private key; if encryption were done first, the signature would be on ciphertext, and a third party would need Bob's private key to check it.<\/li><\/ol>", "k": "theory", "d": "sigconf", "id": 157}, {"t": "hash", "src": ["EX24 Q4(a)(b)"], "m": 9, "q": "a) Three properties of hash functions for security are: one way property; weak collision resistance; strong collision resistance.<br>i. Explain the property of weak collision resistance. [1]<br>ii. Which property is the easiest for a malicious user to attack? Explain. [2]<br>iii. Explain the benefit of using hash functions with public key cryptography compared to with symmetric key cryptography to provide authentication and confidentiality. [3]<br>b) State and explain the significance of the birthday paradox in cryptographic hash functions. [3]", "a": "<div class=\"ans\"><b>Answer:<\/b> i. Given x, can't find y ≠ x with H(y) = H(x). ii. Strong collision resistance (birthday attack ≈ 2<sup>n/2<\/sup>). iii. Signatures give non-repudiation and need no shared secret. b) ~√(2<sup>n<\/sup>) hashes give a 50% collision chance, so n must be doubled.<\/div><h4>a) i.<\/h4><p>Weak collision (second-preimage) resistance: for a <i>given<\/i> message x it is computationally infeasible to find another y ≠ x with H(y) = H(x).<\/p><h4>a) ii.<\/h4><ol class=\"steps\"><li><b>Strong collision resistance<\/b> is the easiest to attack: the attacker may choose <i>both<\/i> messages freely.<\/li><li>By the birthday paradox about 2<sup>n/2<\/sup> random hashes give a collision, vs ~2<sup>n<\/sup> tries for a preimage or second preimage (e.g. 2<sup>64<\/sup> vs 2<sup>128<\/sup> for a 128-bit hash).<\/li><\/ol><h4>a) iii.<\/h4><ol class=\"steps\"><li>With public key: the hash is signed with the sender's <b>private key<\/b> (E<sub>PR<\/sub>(H(M))). Anyone can verify with the public key, nobody else can forge it ⇒ authentication <b>plus non-repudiation<\/b>, and no secret key has to be pre-shared.<\/li><li>With symmetric key (E<sub>K<\/sub>(H(M)) or a MAC): both parties share K, so either could have produced it ⇒ no non-repudiation, and K must be distributed securely to every pair.<\/li><li>Confidentiality: encrypting with the receiver's public key needs no prior shared secret either (or it protects the session key).<\/li><\/ol><h4>b)<\/h4><ol class=\"steps\"><li><b>Birthday paradox:<\/b> in a room of just 23 people there's a &gt; 50% chance two share a birthday (365 possibilities).<\/li><li>For an n-bit hash (2<sup>n<\/sup> outputs), after about 2<sup>n/2<\/sup> random messages there's a ~50% chance two hash to the same value.<\/li><li>Significance: collision attacks cost 2<sup>n/2<\/sup>, not 2<sup>n<\/sup> ⇒ hashes need twice the bits for the desired security (a 128-bit hash gives only 64-bit collision security; hence SHA-256+). Attackers use it to forge e.g. a fair vs fraudulent contract with the same hash.<\/li><\/ol>", "k": "theory", "d": null, "id": 158}, {"t": "hash", "src": ["EX25 Q6(a)(b)"], "m": 10, "q": "a) Beside encryption, RSA can also be used for digital signatures.<br>i. Is hashing a message before signing it a requirement in RSA signatures? Explain the rationale if this is the case. [2]<br>ii. Describe how non-repudiation is achieved using digital signatures. [2]<br>iii. Given RSA signature s = H(m)<sup>d<\/sup> mod n, explain how the receiver verifies the signature. [3]<br>b) Some protocols authenticate the server only, while others authenticate both parties.<br>i. Give an example of a protocol/application with one-way authentication. [1]<br>ii. Give an example of a protocol/application with mutual authentication. [1]<br>iii. Explain why mutual authentication is necessary in high-security environments. [1]", "a": "<div class=\"ans\"><b>Answer:<\/b> a) i. Yes in practice — for efficiency and to stop forgeries. iii. Check H(m) ≡ s<sup>e<\/sup> mod n. b) i. HTTPS web browsing ii. mutual TLS / Kerberos<\/div><h4>a) i.<\/h4><ol class=\"steps\"><li>Mathematically RSA could sign m directly, but in practice hashing is required:<\/li><li><b>Efficiency:<\/b> m can be much longer than n; signing a short fixed-size digest is one exponentiation.<\/li><li><b>Security:<\/b> raw RSA is multiplicative (s<sub>1<\/sub>s<sub>2<\/sub> is a valid signature on m<sub>1<\/sub>m<sub>2<\/sub>) and allows existential forgery (pick s, compute m = s<sup>e<\/sup>); hashing destroys this structure.<\/li><\/ol><h4>a) ii.<\/h4><p>The signature is created with the signer's private key, which only they hold. Anyone (a judge) can verify it with the signer's certified public key, so the signer cannot later deny having signed — the receiver couldn't have produced it.<\/p><h4>a) iii.<\/h4><ol class=\"steps\"><li>Receiver gets (m, s) and the sender's public key (e, n) (from a certificate).<\/li><li>Computes h<sub>1<\/sub> = H(m) using the same hash function.<\/li><li>Computes h<sub>2<\/sub> = s<sup>e<\/sup> mod n (this 'undoes' the private key).<\/li><li>If h<sub>1<\/sub> = h<sub>2<\/sub> ⇒ valid: message unchanged and signed by the private-key owner; otherwise reject.<\/li><\/ol><h4>b)<\/h4><ol class=\"steps\"><li>i. <b>One-way:<\/b> HTTPS (TLS) web browsing — only the server presents a certificate; the user may log i
